name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      # Android SDK sudah terpasang bawaan runner GitHub; tidak perlu setup-android
      - name: Verifikasi Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null | head -20 || true

      - name: Capacitor add & sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Decode keystore (opsional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/nanime.keystore
            echo "Keystore terpasang — build release akan ditandatangani."
          else
            echo "Tidak ada keystore — memakai debug signing."
          fi

      - name: Gradle assembleRelease
        working-directory: android
        env:
          NANIME_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [ -n "$NANIME_KEYSTORE" ] && [ -f app/nanime.keystore ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Kumpulkan APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nanime-apk
          path: out/*.apk
          retention-days: 30

      - name: Release (untuk tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
