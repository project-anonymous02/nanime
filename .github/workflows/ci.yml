name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: nanime-web
          path: dist
          retention-days: 7

  apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      # Android SDK sudah terpasang bawaan runner GitHub; tidak perlu setup-android
      - name: Verifikasi Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null | head -20 || true

      - name: Capacitor sync
        run: |
          npx cap add android || true
          npx cap sync android

      # Naikkan timeout download wrapper (default 10s, terlalu pendek untuk
      # services.gradle.org yang lambat/504) sebagai cadangan bila gradlew dipakai.
      - name: Tune Gradle wrapper timeout
        run: |
          sed -i 's/networkTimeout=.*/networkTimeout=300000/' android/gradle/wrapper/gradle-wrapper.properties || true
          grep networkTimeout android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Install native Android PiP plugin
        run: bash scripts/setup-android-pip.sh

      - name: Setup Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: bash scripts/setup-firebase-android.sh

      - name: Setup deep-link OAuth (nanime://)
        run: bash scripts/setup-android-deeplink.sh

      - name: Gradle assembleDebug
        working-directory: android
        run: |
          # Retry banyak kali: download distribusi Gradle dari
          # services.gradle.org/github-releases sedang flaky (timeout 10s / 504).
          # Sekali berhasil, setup-gradle meng-cache wrapper dist untuk run berikut.
          for i in $(seq 1 15); do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Gradle gagal (percobaan $i/15), coba lagi..."
            sleep 20
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nanime-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
