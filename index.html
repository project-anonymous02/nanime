<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Nanime - Streaming Anime Premium iOS Style">
    <meta name="theme-color" content="#050505">
    <title>Nanime · Streaming Anime Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        :root {
            /* HITAM iOS PEKAT SESUAI REQUEST */
            --bg-0: #050505; --bg-1: #08090B; --bg-2: #0D0F12; --bg-3: #111318;
            /* AKSEN BIRU CAMPUR PUTIH */
            --p1: #5B8DEF; --p2: #8AB4F8;
            --p-soft: rgba(91,141,239,0.16); --p-glow: rgba(91,141,239,0.32);
            --err: #ef4444; --ok: #22c55e; --warn: #f59e0b;
            --glass: rgba(17,19,24,0.72); --glass-strong: rgba(22,24,30,0.88);
            --border: rgba(138,180,248,0.10); --border-2: rgba(138,180,248,0.20);
            --text: #F5F5F7; --text-2: #AEAEB7; --text-3: #63636B;
            --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px; --r-full:9999px;
            --spring: cubic-bezier(0.34,1.56,0.64,1);
            --ease: cubic-bezier(0.25,0.46,0.45,0.94);
            --safe-t: max(0px, env(safe-area-inset-top));
            --safe-b: max(0px, env(safe-area-inset-bottom));
        }
        html,body {
            min-height:100vh; min-height:100dvh;
            font-family:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            color:var(--text);
            background: radial-gradient(900px 500px at 50% -5%, rgba(91,141,239,0.08), transparent 60%), var(--bg-0);
            overflow-x:hidden; -webkit-font-smoothing:antialiased;
        }
        body { padding: calc(16px + var(--safe-t)) 14px calc(90px + var(--safe-b)); }
        h1,h2,h3,.title,.btn,.chip,.badge { font-family:'Outfit','Figtree',sans-serif; letter-spacing:-0.3px; }
        button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
        input { font-family:inherit; color:inherit; }
        img { display:block; max-width:100%; }
        a { color:inherit; text-decoration:none; }
        .media-lock { pointer-events:none!important; user-select:none!important; -webkit-user-drag:none!important; }
        .media-lock::-webkit-media-controls { display:none!important; }

        /* ========== ANIMASI UTILITAS ========== */
        .fade-in { animation: fadeIn .5s var(--ease) both; }
        .slide-up { animation: slideUp .6s var(--spring) both; }
        .stagger { opacity:0; transform: translateY(14px) scale(.98); transition: all .6s var(--spring); }
        .stagger.in { opacity:1!important; transform:none!important; }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        @keyframes slideUp { from{opacity:0; transform:translateY(20px) scale(.97)} to{opacity:1; transform:none} }
        @keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
        .skeleton {
            background: linear-gradient(90deg, var(--bg-2) 0%, var(--bg-3) 50%, var(--bg-2) 100%);
            background-size: 800px 100%;
            animation: shimmer 1.4s infinite linear;
            border-radius: var(--r-md);
        }

        /* ========== PAGE TRANSITION ========== */
        .page { display:none; animation: fadeIn .4s var(--ease); }
        .page.active { display:block; }

        /* ========== HOME HEADER + ASSET WAJIB ========== */
        .home-header { text-align:center; margin-bottom: 22px; }
        .logo-wrap {
            width: clamp(72px, 18vw, 96px); aspect-ratio:1/1;
            margin: 0 auto 14px;
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid var(--border-2);
            box-shadow: 0 14px 36px rgba(91,141,239,0.22), 0 6px 18px rgba(0,0,0,.5);
            transition: transform .4s var(--spring), box-shadow .4s var(--ease);
            background: linear-gradient(135deg, #1a1d24, #5B8DEF);
        }
        .logo-wrap:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 20px 48px rgba(91,141,239,0.34); }
        .logo-wrap img { width:100%; height:100%; object-fit:cover; }
        .brand-title {
            font-size: clamp(30px, 8.5vw, 44px); font-weight:900; letter-spacing:-1.2px; line-height:1;
            background: linear-gradient(135deg, #fff 0%, var(--p1) 55%, var(--p2) 100%);
            -webkit-background-clip:text; background-clip:text; color:transparent;
            margin-bottom: 4px;
        }
        .brand-sub { font-size:13px; color:var(--text-2); margin-bottom: 16px; }
        .dashboard-video {
            width:100%; aspect-ratio:16/9;
            border-radius: var(--r-xl); overflow:hidden;
            border: 1px solid var(--border);
            box-shadow: 0 16px 44px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.02);
            margin-bottom: 26px;
            background: var(--bg-2);
            position:relative;
        }
        .dashboard-video video { width:100%; height:100%; object-fit:cover; }

        /* ========== SECTION ========== */
        .section { margin-bottom: 28px; }
        .section-head {
            display:flex; align-items:center; justify-content:space-between;
            margin-bottom: 12px; padding: 0 2px;
        }
        .section-title { font-size:18px; font-weight:800; letter-spacing:-.4px; }
        .section-more { font-size:12px; color:var(--p2); font-weight:700; display:flex; align-items:center; gap:4px; transition: gap .25s var(--ease); }
        .section-more:hover { gap:8px; }

        /* ========== CAROUSEL HORIZONTAL ========== */
        .carousel {
            display:flex; gap:12px; overflow-x:auto; overflow-y:hidden;
            padding: 4px 2px 14px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .carousel::-webkit-scrollbar { display:none; }
        .carousel > * { scroll-snap-align: start; flex-shrink:0; }

        /* ========== CARD ANIME ========== */
        .card {
            width: clamp(120px, 32vw, 150px);
            border-radius: var(--r-lg);
            overflow:hidden;
            background: var(--bg-2);
            border: 1px solid var(--border);
            box-shadow: 0 8px 22px rgba(0,0,0,.4);
            cursor:pointer;
            transition: transform .35s var(--spring), box-shadow .35s var(--ease), border-color .3s;
            position:relative;
        }
        .card:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 16px 38px rgba(91,141,239,0.18); border-color: var(--border-2); }
        .card-poster { aspect-ratio: 2/3; overflow:hidden; background: var(--bg-3); position:relative; }
        .card-poster img { width:100%; height:100%; object-fit:cover; transition: transform .6s var(--ease); }
        .card:hover .card-poster img { transform: scale(1.08); }
        .card-fav {
            position:absolute; top:8px; right:8px; z-index:2;
            width:30px; height:30px; border-radius:50%;
            background: rgba(0,0,0,.55); backdrop-filter: blur(8px);
            display:flex; align-items:center; justify-content:center;
            color: #fff; font-size:13px;
            transition: all .3s var(--spring);
            border: 1px solid rgba(255,255,255,.1);
        }
        .card-fav:hover { transform: scale(1.15); }
        .card-fav.active { color: #ef4444; background: rgba(239,68,68,.18); border-color: rgba(239,68,68,.4); }
        .card-fav.active i { animation: heartPop .5s var(--spring); }
        @keyframes heartPop { 0%{transform:scale(1)} 40%{transform:scale(1.4)} 100%{transform:scale(1)} }
        .card-badge {
            position:absolute; top:8px; left:8px; z-index:2;
            padding: 3px 7px; border-radius: 6px;
            background: rgba(91,141,239,.9); color:#061028;
            font-size:10px; font-weight:800; letter-spacing:.3px;
        }
        .card-body { padding: 9px 10px 11px; }
        .card-title {
            font-size:12.5px; font-weight:700; line-height:1.35;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
            margin-bottom: 4px;
        }
        .card-meta { font-size:10.5px; color:var(--text-3); display:flex; align-items:center; gap:6px; }
        .card-meta i { color: var(--p2); font-size:9px; }

        /* Featured Card Lebih Besar */
        .card-featured {
            width: min(78vw, 300px);
            border-radius: var(--r-xl);
        }
        .card-featured .card-poster { aspect-ratio: 16/10; }
        .card-featured .card-body { padding: 12px 13px 14px; }
        .card-featured .card-title { font-size:14.5px; }

        /* Grid */
        .grid {
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }
        .grid .card { width:100%; }

        /* ========== GENRE CHIPS ========== */
        .chips { display:flex; flex-wrap:wrap; gap:7px; }
        .chip {
            padding: 7px 12px; border-radius: var(--r-full);
            background: var(--bg-2); color: var(--text-2);
            border: 1px solid var(--border);
            font-size: 12px; font-weight:700;
            transition: all .3s var(--spring);
            cursor:pointer;
        }
        .chip:hover { transform: translateY(-1px) scale(1.04); color:#fff; border-color: var(--border-2); background: var(--bg-3); }
        .chip.active { background: linear-gradient(135deg, var(--p1), var(--p2)); color:#061028; border-color: transparent; box-shadow: 0 6px 16px rgba(91,141,239,.3); }

        /* ========== SEARCH ========== */
        .search-wrap {
            display:flex; align-items:center; gap:10px;
            background: var(--bg-2);
            border: 1.5px solid transparent;
            border-radius: var(--r-lg);
            padding: 13px 15px; min-height:52px;
            margin-bottom: 18px;
            transition: all .35s var(--spring);
        }
        .search-wrap:focus-within {
            border-color: var(--p1);
            background: rgba(91,141,239,.05);
            box-shadow: 0 0 0 5px rgba(91,141,239,.14);
            transform: translateY(-1px);
        }
        .search-wrap i { color: var(--p2); font-size:15px; transition: transform .3s var(--spring); }
        .search-wrap:focus-within i { transform: scale(1.15) rotate(-6deg); }
        .search-input {
            flex:1; background:transparent; border:none; outline:none;
            font-size:15px; min-width:0;
        }
        .search-input::placeholder { color: var(--text-3); }
        .search-clear {
            width:28px; height:28px; border-radius:50%;
            background: rgba(255,255,255,.06); color: var(--text-2);
            display:none; align-items:center; justify-content:center; font-size:12px;
            transition: all .25s var(--ease);
        }
        .search-clear.show { display:flex; }
        .search-clear:hover { background: rgba(239,68,68,.2); color:#fff; transform: rotate(90deg); }

        /* ========== DETAIL ANIME ========== */
        .detail-cover {
            width: min(56vw, 220px); aspect-ratio: 2/3;
            margin: 0 auto 18px;
            border-radius: var(--r-xl); overflow:hidden;
            border: 1px solid var(--border-2);
            box-shadow: 0 20px 50px rgba(91,141,239,.22), 0 10px 30px rgba(0,0,0,.6);
            background: var(--bg-2);
            position:relative;
        }
        .detail-cover img { width:100%; height:100%; object-fit:cover; }
        .detail-title {
            font-size: clamp(20px, 5.5vw, 26px); font-weight:800;
            letter-spacing:-.6px; line-height:1.2;
            text-align:center; margin-bottom:6px;
        }
        .detail-alt { font-size:12.5px; color:var(--text-3); text-align:center; margin-bottom:12px; }
        .detail-meta-row {
            display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
            margin-bottom: 14px;
        }
        .detail-meta {
            padding: 5px 10px; border-radius: var(--r-full);
            background: var(--bg-2); border: 1px solid var(--border);
            font-size:11.5px; color: var(--text-2); font-weight:700;
            display:inline-flex; align-items:center; gap:5px;
        }
        .detail-meta i { color: var(--p2); font-size:10px; }
        .detail-synopsis {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: var(--r-lg); padding: 14px 15px;
            font-size:13.5px; line-height:1.65; color: var(--text-2);
            margin-bottom: 14px;
        }
        .synopsis-text { overflow:hidden; transition: max-height .5s var(--ease); }
        .synopsis-text.collapsed { max-height: 88px; -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent); }
        .read-more {
            margin-top:8px; color: var(--p2); font-size:12px; font-weight:800;
            cursor:pointer; display:inline-block;
        }
        .detail-genres { margin-bottom: 20px; }
        .detail-section-title {
            font-size:16px; font-weight:800; letter-spacing:-.3px;
            margin: 0 2px 10px; display:flex; align-items:center; gap:8px;
        }
        .detail-section-title i { color: var(--p2); font-size:13px; }

        /* Episode List */
        .ep-search {
            display:flex; align-items:center; gap:8px;
            background: var(--bg-2); border:1px solid var(--border);
            border-radius: var(--r-md); padding: 9px 12px;
            margin-bottom: 12px; min-height: 42px;
            transition: all .3s var(--ease);
        }
        .ep-search:focus-within { border-color: var(--p1); box-shadow: 0 0 0 4px rgba(91,141,239,.12); }
        .ep-search i { color: var(--p2); font-size:13px; }
        .ep-search input { flex:1; background:transparent; border:none; outline:none; font-size:13.5px; }
        .ep-list {
            display:grid; gap:8px;
            grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
            max-height: 380px; overflow-y:auto;
            padding: 4px 2px 10px;
        }
        .ep-btn {
            min-height: 44px; padding: 10px 6px;
            border-radius: var(--r-sm);
            background: var(--bg-2); border:1px solid var(--border);
            font-size:13px; font-weight:800; color: var(--text);
            transition: all .25s var(--spring);
            display:flex; flex-direction:column; align-items:center; gap:2px;
        }
        .ep-btn:hover { transform: translateY(-1px) scale(1.04); border-color: var(--border-2); background: var(--bg-3); }
        .ep-btn.active { background: linear-gradient(135deg, var(--p1), var(--p2)); color:#061028; border-color: transparent; box-shadow: 0 6px 16px rgba(91,141,239,.3); }
        .ep-btn small { font-size:9.5px; font-weight:600; opacity:.7; }
        .ep-empty { text-align:center; padding: 30px 10px; color: var(--text-3); font-size:13px; }

        /* ========== VIDEO PLAYER ========== */
        .player-wrap {
            width:100%; aspect-ratio: 16/9;
            border-radius: var(--r-lg); overflow:hidden;
            background:#000;
            margin-bottom: 14px;
            position:relative;
            box-shadow: 0 14px 40px rgba(0,0,0,.6);
        }
        .player-wrap video { width:100%; height:100%; background:#000; }
        .player-controls {
            display:flex; gap:10px; margin-bottom: 16px; flex-wrap:wrap;
        }
        .btn {
            min-height: 46px; padding: 0 16px;
            border-radius: var(--r-md);
            font-size:13.5px; font-weight:800;
            display:inline-flex; align-items:center; justify-content:center; gap:7px;
            transition: all .3s var(--spring);
            flex:1; min-width: 120px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3d6fd6, var(--p1) 50%, var(--p2));
            color:#061028;
            box-shadow: 0 8px 22px rgba(91,141,239,.28);
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px) scale(1.01); box-shadow: 0 14px 32px rgba(91,141,239,.42); }
        .btn-primary:active:not(:disabled) { transform: scale(.97); }
        .btn-ghost {
            background: var(--bg-2); color: var(--text-2);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { color:#fff; border-color: var(--border-2); transform: translateY(-1px); }
        .btn:disabled { opacity:.5; cursor:not-allowed; }

        .player-error {
            position:absolute; inset:0;
            background: rgba(5,5,5,.92);
            display:none; flex-direction:column; align-items:center; justify-content:center;
            padding: 20px; text-align:center; gap:10px;
            z-index:5;
        }
        .player-error.show { display:flex; }
        .player-error i { font-size:36px; color: var(--err); }
        .player-error p { font-size:13px; color: var(--text-2); }

        /* ========== FAVORITE EMPTY ========== */
        .empty-state {
            text-align:center; padding: 60px 20px;
            color: var(--text-3);
        }
        .empty-state i {
            font-size: 54px; color: var(--p2); opacity:.4;
            margin-bottom: 14px;
        }
        .empty-state h3 { font-size:18px; color: var(--text-2); margin-bottom:6px; }
        .empty-state p { font-size:13px; }

        /* ========== BOTTOM NAV (MOBILE) ========== */
        .bottom-nav {
            position: fixed;
            left: 50%; transform: translateX(-50%);
            bottom: calc(10px + var(--safe-b));
            width: min(520px, calc(100% - 28px));
            background: rgba(10,12,16,.82);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--border-2);
            border-radius: var(--r-xl);
            padding: 7px;
            display:grid; grid-template-columns: repeat(3, 1fr);
            z-index: 1000;
            box-shadow: 0 12px 36px rgba(0,0,0,.55);
        }
        .nav-item {
            position:relative; z-index:2;
            min-height: 48px;
            border-radius: calc(var(--r-xl) - 6px);
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
            font-size:11px; font-weight:700; color: var(--text-3);
            transition: color .35s var(--ease);
        }
        .nav-item i { font-size:16px; }
        .nav-item.active { color: var(--p2); }
        .nav-indicator {
            position:absolute; top:7px; bottom:7px; left:7px;
            width: calc((100% - 14px) / 3);
            background: var(--p-soft);
            border: 1px solid var(--border-2);
            border-radius: calc(var(--r-xl) - 6px);
            transition: transform .55s var(--spring);
            z-index:1;
        }
        .nav-indicator.pos-1 { transform: translateX(0); }
        .nav-indicator.pos-2 { transform: translateX(100%); }
        .nav-indicator.pos-3 { transform: translateX(200%); }

        /* ========== TOAST ========== */
        .toast-wrap {
            position:fixed; top: calc(14px + var(--safe-t)); left:50%; transform: translateX(-50%);
            z-index: 9999; width: calc(100% - 28px); max-width: 420px;
            display:flex; flex-direction:column; gap:8px; pointer-events:none;
        }
        .toast {
            background: rgba(15,17,22,.94); backdrop-filter: blur(20px);
            border: 1px solid var(--border-2);
            border-left: 4px solid var(--p1);
            border-radius: var(--r-md);
            padding: 12px 14px;
            box-shadow: 0 12px 32px rgba(0,0,0,.5);
            display:flex; align-items:flex-start; gap:10px;
            font-size:13px; line-height:1.4;
            pointer-events:auto;
            opacity:0; transform: translateY(-16px) scale(.97);
            animation: toastIn .5s var(--spring) forwards;
        }
        .toast.err { border-left-color: var(--err); }
        .toast.ok { border-left-color: var(--ok); }
        .toast i { flex-shrink:0; font-size:15px; margin-top:1px; color: var(--p2); }
        .toast.err i { color: var(--err); } .toast.ok i { color: var(--ok); }
        @keyframes toastIn { to { opacity:1; transform:none; } }
        .toast.out { animation: toastOut .35s var(--ease) forwards; }
        @keyframes toastOut { to { opacity:0; transform: translateY(-10px) scale(.97); } }

        /* ========== RESPONSIVE DESKTOP ========== */
        @media (min-width: 900px) {
            body { padding: 24px 24px 24px 96px; max-width: 1200px; margin: 0 auto; }
            .bottom-nav {
                left: 18px; bottom: auto; top: 50%; transform: translateY(-50%);
                width: 64px;
                grid-template-columns: 1fr;
                grid-template-rows: repeat(3, 64px);
                padding: 8px;
                gap: 6px;
            }
            .nav-item { font-size: 10px; min-height: 60px; }
            .nav-item span { display:none; }
            .nav-indicator {
                top:8px; left:8px; right:8px; bottom:auto;
                height: 60px; width: auto;
                transition: transform .55s var(--spring);
            }
            .nav-indicator.pos-1 { transform: translateY(0); }
            .nav-indicator.pos-2 { transform: translateY(calc(100% + 6px)); }
            .nav-indicator.pos-3 { transform: translateY(calc(200% + 12px)); }
        }
        @media (prefers-reduced-motion: reduce) {
            *,*::before,*::after { animation:none!important; transition:none!important; }
        }
    </style>
</head>
<body>

    <!-- ========== PAGES ========== -->
    <main id="app">

        <!-- HOME -->
        <section class="page active" id="page-home">
            <div class="home-header slide-up">
                <div class="logo-wrap stagger">
                    <img src="/logo.jpg" alt="Nanime" class="media-lock" draggable="false" ondragstart="return false;" onerror="this.style.display='none'">
                </div>
                <h1 class="brand-title stagger">Nanime</h1>
                <p class="brand-sub stagger">Streaming Anime Premium · iOS Style</p>
                <div class="dashboard-video stagger">
                    <video src="/dashboard.mp4" class="media-lock" autoplay muted loop playsinline preload="auto"
                        draggable="false" ondragstart="return false;" oncontextmenu="return false;"
                        controlslist="nodownload nofullscreen noremoteplayback" disablepictureinpicture disableremoteplayback
                        onerror="this.style.display='none'"></video>
                </div>
            </div>

            <div class="section stagger">
                <div class="section-head"><h2 class="section-title">🔥 Trending Sekarang</h2></div>
                <div class="carousel" id="home-trending"></div>
            </div>

            <div class="section stagger">
                <div class="section-head"><h2 class="section-title">✨ Popular Musim Ini</h2></div>
                <div class="carousel" id="home-popular"></div>
            </div>

            <div class="section stagger">

<script>
'use strict';

/* ============================================================
   NANIME · VERCEL HOBBY EDITION
   Arsitektur: Client-side semua logika berat, Vercel = static + CORS helper ringan
   ============================================================ */

// ==================== KONFIG API (VERIFED WORK, NO KEY, CORS OK) ====================
const API = {
    ANILIST: 'https://graphql.anilist.co',
    JIKAN: 'https://api.jikan.moe/v4',
    CONSUMET: [
        'https://api.consumet.org/anime/gogoanime',
        'https://consumet-api-nu.vercel.app/anime/gogoanime'
    ],
    CORS: (url) => `/api/cors?url=${encodeURIComponent(url)}`
};
const GENRES = ['Action','Adventure','Comedy','Drama','Fantasy','Horror','Romance','Sci-Fi','Slice of Life','Sports','Supernatural','Mystery','Thriller','Music','Ecchi'];
const CACHE_TTL = { TRENDING:1800, RECENT:1800, ONGOING:1800, DETAIL:86400, SEARCH:3600, EPISODES:3600, VIDEO:600 };

// ==================== STATE ====================
const S = {
    route: 'home',
    cache: new Map(),
    fav: JSON.parse(localStorage.getItem('nanime_fav') || '{}'),
    currentAnime: null,
    currentEp: null,
    hls: null
};

// ==================== UTIL ====================
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const fmt = {
    num: n => { if(!n)return'0';n=Number(n);return n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':n.toString(); },
    ep: n => String(n).padStart(2,'0')
};
const debounce = (fn,d=350)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),d);};};
const toast = (msg,type='info',dur=3000)=>{
    const t=document.createElement('div');
    t.className='toast '+(type==='error'?'err':type==='success'?'ok':'');
    const ic=type==='error'?'fa-circle-exclamation':type==='success'?'fa-circle-check':'fa-circle-info';
    t.innerHTML=`<i class="fas ${ic}"></i><span></span>`;
    t.querySelector('span').textContent=msg;
    $('#toast-wrap').appendChild(t);
    setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),400);},dur);
};
const cache = {
    key: (...a) => a.join('::'),
    get(k){ const v=S.cache.get(k); if(!v)return null; if(Date.now()>v.exp){S.cache.delete(k);return null;} return v.data; },
    set(k,d,ttl=3600){ S.cache.set(k,{data:d,exp:Date.now()+ttl*1000}); }
};
const saveFav = () => localStorage.setItem('nanime_fav', JSON.stringify(S.fav));
const isFav = id => !!S.fav[id];
const toggleFav = (anime) => {
    if(!anime || !anime.id) return;
    if(S.fav[anime.id]){ delete S.fav[anime.id]; toast('Dihapus dari favorit'); }
    else { S.fav[anime.id] = { id:anime.id, title:anime.title.romaji||anime.title.userPreferred||'Anime', cover:anime.coverImage?.large||'', year:anime.seasonYear||'' }; toast('♥ Ditambahkan ke favorit','success'); }
    saveFav();
    renderFavIcons();
    if(S.route==='favorite') renderFavorite();
};
const renderFavIcons = () => {
    $$('.card-fav').forEach(b=>{
        const id = b.dataset.id;
        if(!id) return;
        b.classList.toggle('active', isFav(id));
        b.innerHTML = `<i class="fas ${isFav(id)?'fa-solid fa-heart':'fa-regular fa-heart'}"></i>`;
    });
};

// ==================== API: ANILIST GRAPHQL ====================
async function anilist(query, variables={}) {
    const ck = cache.key('al', query, JSON.stringify(variables));
    const c = cache.get(ck); if(c) return c;
    try {
        const r = await fetch(API.ANILIST, {
            method:'POST',
            headers:{'Content-Type':'application/json','Accept':'application/json'},
            body: JSON.stringify({query, variables})
        });
        if(!r.ok) throw new Error('HTTP '+r.status);
        const j = await r.json();
        if(j.errors) throw new Error(j.errors[0]?.message || 'GQL Error');
        cache.set(ck, j.data, 3600);
        return j.data;
    } catch(e) {
        console.warn('[Anilist] gagal, fallback ke Jikan:', e.message);
        return null;
    }
}
const Q = {
    TRENDING: `query($p:Int=1,$pp:Int=10){Page(page:$p,perPage:$pp){media(sort:TRENDING_DESC,type:ANIME,format_in:[TV,MOVIE,OVA,ONA]){id title{romaji userPreferred english native} coverImage{large medium color} averageScore meanScore seasonYear format episodes status genres isAdult}}}`,
    POPULAR: `query($p:Int=1,$pp:Int=12,$s:Int){Page(page:$p,perPage:$pp){media(sort:POPULARITY_DESC,type:ANIME,seasonYear:$s,status:RELEASING){id title{romaji userPreferred english} coverImage{large} averageScore seasonYear episodes status genres nextAiringEpisode{episode}}}}`,
    RECENT: `query($p:Int=1,$pp:Int=18){Page(page:$p,perPage:$pp){media(sort:START_DATE_DESC,type:ANIME,format_in:[TV,ONA]){id title{romaji userPreferred english} coverImage{large} startDate{year} episodes status averageScore genres}}}`,
    ONGOING: `query($p:Int=1,$pp:Int=18){Page(page:$p,perPage:$pp){media(sort:POPULARITY_DESC,type:ANIME,status:RELEASING){id title{romaji userPreferred english} coverImage{large} averageScore seasonYear episodes nextAiringEpisode{episode} genres}}}`,
    DETAIL: `query($id:Int!){Media(id:$id,type:ANIME){id title{romaji userPreferred english native} synonyms coverImage{large extraLarge} bannerImage description(asHtml:false) averageScore meanScore seasonYear season status(format:VERSION_2) episodes duration genres studios(isMain:true){nodes{name}} startDate{year month day} endDate{year month day} nextAiringEpisode{episode airingAt timeUntilAiring} relations{edges{relationType node{id title{romaji userPreferred} type coverImage{large} status(format:VERSION_2)}}}}}`,
    SEARCH: `query($q:String,$g:[String],$p:Int=1,$pp:Int=24){Page(page:$p,perPage:$pp){media(search:$q,genre_in:$g,sort:POPULARITY_DESC,type:ANIME){id title{romaji userPreferred english native} coverImage{large} averageScore seasonYear episodes status genres}}}`,
    MALID: `query($id:Int){Media(idMal:$id,type:ANIME){id title{romaji userPreferred} coverImage{large}}}`
};

// ==================== API: JIKAN FALLBACK ====================
async function jikan(path) {
    const ck = cache.key('jk', path);
    const c = cache.get(ck); if(c) return c;
    try {
        const r = await fetch(API.JIKAN+path, { headers:{'Accept':'application/json'} });
        if(r.status===429) throw new Error('Jikan limit');
        if(!r.ok) throw new Error('HTTP '+r.status);
        const j = await r.json();
        cache.set(ck, j, 1800);
        return j;
    } catch(e) { console.warn('[Jikan]',e.message); return null; }
}

// ==================== API: CONSUMET VIDEO ====================
async function consumet(path) {
    for(const base of API.CONSUMET) {
        try {
            const url = base + path;
            const r = await fetch(url, { headers:{'Accept':'application/json'} });
            if(!r.ok) continue;
            const j = await r.json();
            if(j) return j;
        } catch(e){ continue; }
    }
    return null;
}
// Cari consumet ID dari judul (bridge Anilist → Consumet)
async function findConsumetId(anime) {
    const t = (anime.title?.romaji||anime.title?.userPreferred||'').toString().toLowerCase();
    if(!t) return null;
    const ck = cache.key('csrch', t);
    const c = cache.get(ck); if(c) return c;
    const r = await consumet(`/${encodeURIComponent(t)}`);
    if(r && r.results && r.results.length){
        // ambil yang paling mirip
        const best = r.results.find(x => x.title.toLowerCase()===t) || r.results[0];
        cache.set(ck, best.id, CACHE_TTL.DETAIL);
        return best.id;
    }
    return null;
}
async function getEpisodes(consumetId) {
    if(!consumetId) return [];
    const ck = cache.key('eps', consumetId);
    const c = cache.get(ck); if(c) return c;
    const r = await consumet(`/info/${consumetId}`);
    const eps = (r && r.episodes) || [];
    cache.set(ck, eps, CACHE_TTL.EPISODES);
    return eps;
}
async function getVideoSource(consumetEpId) {
    if(!consumetEpId) return null;
    const ck = cache.key('vid', consumetEpId);
    const c = cache.get(ck); if(c) return c;
    const r = await consumet(`/watch/${consumetEpId}`);
    if(!r || !r.sources) return null;
    // prioritas: m3u8 kualitas terbaik
    const hls = r.sources.filter(s => s.isM3U8 && s.quality !== 'backup').sort((a,b)=>{
        const qa = parseInt(a.quality)||0, qb = parseInt(b.quality)||0; return qb-qa;
    });
    const mp4 = r.sources.filter(s => !s.isM3U8 && s.quality !== 'backup').sort((a,b)=>(parseInt(b.quality)||0)-(parseInt(a.quality)||0));
    const out = { hls: hls[0]?.url || null, mp4: mp4[0]?.url || null, all: r.sources, intro: r.intro, outro: r.outro };
    cache.set(ck, out, CACHE_TTL.VIDEO);
    return out;
}

// ==================== CARD RENDER ====================
function animeCard(a, opts={}) {
    const t = a.title?.romaji || a.title?.userPreferred || a.title || 'Anime';
    const cov = a.coverImage?.large || a.coverImage?.medium || a.image || '';
    const rate = a.averageScore || a.meanScore || a.rating || null;
    const year = a.seasonYear || a.year || '';
    const ep = a.episodes || '';
    const fav = isFav(a.id);
    const badge = opts.featured ? `<div class="card-badge">${rate?rate+'%':'TRENDING'}</div>` : '';
    return `
    <div class="card ${opts.featured?'card-featured':''}" data-id="${a.id}" onclick="goAnime(${a.id})">
        <div class="card-poster">
            ${cov?`<img src="${cov}" alt="${t.replace(/"/g,'&quot;')}" loading="lazy" onerror="this.style.visibility='hidden'">`:'<div class="skeleton" style="width:100%;height:100%"></div>'}
            ${badge}
            <button class="card-fav ${fav?'active':''}" data-id="${a.id}" onclick="event.stopPropagation(); _toggleFavById(${a.id}, this)" aria-label="Favorite">
                <i class="${fav?'fa-solid':'fa-regular'} fa-heart"></i>
            </button>
        </div>
        <div class="card-body">
            <div class="card-title">${t}</div>
            <div class="card-meta">
                ${rate?`<span><i class="fas fa-star"></i> ${(rate/10).toFixed(1)}</span>`:''}
                ${year?`<span><i class="fas fa-calendar"></i> ${year}</span>`:''}
                ${ep?`<span><i class="fas fa-play"></i> ${ep} eps</span>`:''}
            </div>
        </div>
    </div>`;
}
function skeleton(n=6, card='') {
    let h='';
    for(let i=0;i<n;i++) h += `<div class="card ${card}"><div class="card-poster skeleton"></div><div class="card-body"><div class="skeleton" style="height:12px;margin-bottom:6px"></div><div class="skeleton" style="height:10px;width:60%"></div></div></div>`;
    return h;
}
window._toggleFavById = async (id, btn) => {
    const ck = cache.key('al', Q.DETAIL, JSON.stringify({id}));
    let a = cache.get(ck);
    if(!a) {
        const d = await anilist(Q.DETAIL, {id});
        a = d?.Media || null;
    }
    if(!a) { toast('Gagal, coba lagi','error'); return; }
    toggleFav(a);
};

// ==================== HOME RENDER ====================
async function renderHome() {
    const tr = $('#home-trending'), pop=$('#home-popular'), rec=$('#home-recent'), ong=$('#home-ongoing'), gn=$('#home-genres');
    tr.innerHTML = skeleton(5, 'card-featured');
    pop.innerHTML = skeleton(6);
    rec.innerHTML = skeleton(8);
    ong.innerHTML = skeleton(8);

    // Genre
    gn.innerHTML = GENRES.map(g=>`<button class="chip" onclick="goSearchGenre('${g}')">${g}</button>`).join('');

    // Pararel request
    const [dTr, dPop, dRec, dOng] = await Promise.all([
        anilist(Q.TRENDING, {pp:8}).then(d=>{ cache.set(cache.key('al',Q.TRENDING,'1'), d, CACHE_TTL.TRENDING); return d; }),
        anilist(Q.POPULAR).then(d=>{ cache.set(cache.key('al',Q.POPULAR,'1'), d, CACHE_TTL.TRENDING); return d; }),
        anilist(Q.RECENT, {pp:12}).then(d=>{ cache.set(cache.key('al',Q.RECENT,'1'), d, CACHE_TTL.RECENT); return d; }),
        anilist(Q.ONGOING, {pp:12}).then(d=>{ cache.set(cache.key('al',Q.ONGOING,'1'), d, CACHE_TTL.ONGOING); return d; })
    ]);

    tr.innerHTML = (dTr?.Page?.media||[]).filter(a=>!a.isAdult).map(a=>animeCard(a,{featured:true})).join('') || emptyMini('Tidak ada data');
    pop.innerHTML = (dPop?.Page?.media||[]).filter(a=>!a.isAdult).map(a=>animeCard(a)).join('') || emptyMini();
    rec.innerHTML = (dRec?.Page?.media||[]).filter(a=>!a.isAdult).slice(0,12).map(a=>animeCard(a)).join('') || emptyMini();
    ong.innerHTML = (dOng?.Page?.media||[]).filter(a=>!a.isAdult).slice(0,12).map(a=>animeCard(a)).join('') || emptyMini();
    renderFavIcons();
    runStagger('#page-home .stagger');
}
function emptyMini(t='Data tidak tersedia') { return `<div style="padding:30px 10px;color:var(--text-3);font-size:13px;text-align:center;width:100%">${t}</div>`; }

// ==================== SEARCH RENDER ====================
function renderSearchInit() {
    $('#search-quick-genre').innerHTML = GENRES.slice(0,10).map(g=>`<button class="chip" onclick="goSearchGenre('${g}')">${g}</button>`).join('');
    $('#search-input').value = '';
    $('#search-clear').classList.remove('show');
    $('#search-results').innerHTML = `<div class="empty-state" style="padding:40px 10px"><i class="fas fa-magnifying-glass"></i><h3>Mulai mencari</h3><p>Ketik judul anime atau pilih genre di atas</p></div>`;
    runStagger('#page-search .stagger');
}
async function doSearch(q, genre=null) {
    const out = $('#search-results');
    out.innerHTML = `<div class="grid">${skeleton(10)}</div>`;
    const variables = { pp: 24 };
    if(q && q.trim()) variables.q = q.trim();
    if(genre) variables.g = [genre];
    const d = await anilist(Q.SEARCH, variables);
    const list = (d?.Page?.media||[]).filter(a=>!a.isAdult);
    if(!list.length) {
        out.innerHTML = `<div class="empty-state"><i class="fas fa-face-frown"></i><h3>Tidak ditemukan</h3><p>Coba kata kunci lain atau genre berbeda</p></div>`;
        return;
    }
    out.innerHTML = `<div class="section-head" style="margin-bottom:12px"><h2 class="section-title">${list.length} hasil</h2></div><div class="grid">${list.map(a=>animeCard(a)).join('')}</div>`;
    renderFavIcons();
}

// ==================== DETAIL RENDER ====================
async function renderDetail(id) {
    const page = $('#page-detail');
    page.innerHTML = `<div style="padding:40px 10px;text-align:center"><div class="skeleton" style="width:180px;height:270px;margin:0 auto 18px;border-radius:var(--r-xl)"></div><div class="skeleton" style="height:22px;width:70%;margin:0 auto 8px"></div><div class="skeleton" style="height:14px;width:50%;margin:0 auto 20px"></div><div class="skeleton" style="height:120px;border-radius:var(--r-lg);margin-bottom:14px"></div><div class="skeleton" style="height:200px;border-radius:var(--r-lg)"></div></div>`;

    const d = await anilist(Q.DETAIL, {id: Number(id)});
    const a = d?.Media;
    if(!a) { page.innerHTML = `<div class="empty-state"><i class="fas fa-triangle-exclamation"></i><h3>Anime tidak ditemukan</h3><p>ID tidak valid atau API sedang gangguan</p><button class="btn btn-ghost" style="margin-top:14px" onclick="go('home')">← Kembali ke Home</button></div>`; return; }
    S.currentAnime = a;
    const t = a.title?.romaji || a.title?.userPreferred || 'Anime';
    const alt = [a.title?.english, a.title?.native, ...(a.synonyms||[])].filter(Boolean).slice(0,3).join(' · ');
    const cov = a.coverImage?.extraLarge || a.coverImage?.large || '';
    const rate = a.averageScore || a.meanScore || null;
    const year = a.seasonYear || a.startDate?.year || '';
    const season = a.season ? String(a.season).charAt(0)+String(a.season).slice(1).toLowerCase() : '';
    const status = ({RELEASING:'Ongoing','FINISHED':'Selesai','NOT_YET_RELEASED':'Belum Tayang','CANCELLED':'Dibataled','HIATUS':'Hiatus'}[a.status]||a.status||'-');
    const ep = a.episodes || '?';
    const dur = a.duration ? `${a.duration}m/ep` : '';
    const studio = a.studios?.nodes?.[0]?.name || '';
    const syn = (a.description||'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').trim() || 'Sinopsis tidak tersedia.';
    const genres = (a.genres||[]).filter(Boolean);
    const fav = isFav(a.id);

    // Cari consumet ID + episodes (async, tidak block render)
    let epList = [];
    let cid = null;
    (async () => {
        cid = await findConsumetId(a);
        if(cid) epList = await getEpisodes(cid);
        S.currentAnime._cid = cid;
        renderEpList(epList);
    })();

    page.innerHTML = `
    <div class="slide-up">
        <button class="btn-ghost btn" style="margin-bottom:14px;min-width:auto;padding:0 14px;min-height:38px;font-size:12.5px" onclick="history.back()"><i class="fas fa-arrow-left"></i> Kembali</button>

        <div class="detail-cover stagger">
            ${cov?`<img src="${cov}" alt="" loading="eager" onerror="this.style.visibility='hidden'">`:''}
        </div>
        <h1 class="detail-title stagger">${t}</h1>
        ${alt?`<p class="detail-alt stagger">${alt}</p>`:''}
        <div class="detail-meta-row stagger">
            ${rate?`<span class="detail-meta"><i class="fas fa-star"></i> ${(rate/10).toFixed(1)}</span>`:''}
            ${year?`<span class="detail-meta"><i class="fas fa-calendar"></i> ${season} ${year}</span>`:''}
            <span class="detail-meta"><i class="fas fa-signal"></i> ${status}</span>
            <span class="detail-meta"><i class="fas fa-play"></i> ${ep} eps</span>
            ${dur?`<span class="detail-meta"><i class="fas fa-clock"></i> ${dur}</span>`:''}
            ${studio?`<span class="detail-meta"><i class="fas fa-clapperboard"></i> ${studio}</span>`:''}
        </div>

        <div class="detail-synopsis stagger">
            <div class="synopsis-text collapsed" id="syn-text">${syn.replace(/\n/g,'<br>')}</div>
            ${syn.length>120?`<div class="read-more" id="syn-btn" onclick="toggleSyn()">Baca selengkapnya ▾</div>`:''}
        </div>

        ${genres.length?`<div class="detail-genres stagger">
            <h3 class="detail-section-title"><i class="fas fa-tags"></i> Genre</h3>
            <div class="chips">${genres.map(g=>`<button class="chip" onclick="goSearchGenre('${g}')">${g}</button>`).join('')}</div>
        </div>`:''}

        <div class="player-controls stagger">
            <button class="btn btn-primary" id="btn-watch-first" onclick="goWatchFirst()" disabled><i class="fas fa-play"></i> Mulai Tonton</button>
            <button class="btn btn-ghost" id="btn-fav" onclick="toggleFav(S.currentAnime)"><i class="${fav?'fa-solid':'fa-regular'} fa-heart"></i> ${fav?'Favorit':'Tambah Favorit'}</button>
        </div>

        <div class="stagger">
            <h3 class="detail-section-title" style="margin-top:18px"><i class="fas fa-list"></i> Daftar Episode <span id="ep-count" style="color:var(--text-3);font-size:13px;font-weight:600">(memuat...)</span></h3>
            <div class="ep-search">
                <i class="fas fa-magnifying-glass"></i>
                <input type="text" id="ep-search-input" placeholder="Cari nomor episode (cth: 12, 24, 1000)..." oninput="filterEp(this.value)">
            </div>
            <div class="ep-list" id="ep-list">
                <div class="ep-empty"><i class="fas fa-spinner fa-spin" style="color:var(--p2)"></i> &nbsp; Memuat daftar episode...</div>
            </div>
        </div>
    </div>`;
    runStagger('#page-detail .stagger');
}
function toggleSyn() {
    const t = $('#syn-text'), b = $('#syn-btn');
    const col = t.classList.toggle('collapsed');
    b.textContent = col ? 'Baca selengkapnya ▾' : 'Sembunyikan ▴';
}
function renderEpList(list) {
    const wrap = $('#ep-list'), cnt = $('#ep-count'), btn = $('#btn-watch-first');
    if(!wrap) return;
    cnt.textContent = `(${list.length} eps)`;
    S._epList = list;
    if(!list.length) {
        wrap.innerHTML = `<div class="ep-empty">Episode belum tersedia untuk sumber ini</div>`;
        if(btn) btn.innerHTML = '<i class="fas fa-triangle-exclamation"></i> Episode belum ada';
        return;
    }
    wrap.innerHTML = list.map(e=>`
        <button class="ep-btn" data-ep="${e.number}" data-cid="${e.id}" onclick="goWatch('${e.id}', ${e.number})">
            ${fmt.ep(e.number)}
            ${e.title?`<small>${String(e.title).slice(0,14)}</small>`:''}
        </button>`).join('');
    if(btn){ btn.disabled = false; btn.dataset.firstCid = list[0].id; btn.dataset.firstNum = list[0].number; }
}
window.filterEp = (v) => {
    const list = S._epList || [];
    const q = String(v||'').trim().toLowerCase();
    const filtered = !q ? list : list.filter(e =>
        String(e.number) === q ||
        String(e.number).includes(q) ||
        (e.title && String(e.title).toLowerCase().includes(q))
    );
    const wrap = $('#ep-list');
    if(!filtered.length){ wrap.innerHTML = `<div class="ep-empty">Episode tidak ditemukan</div>`; return; }
    wrap.innerHTML = filtered.map(e=>`
        <button class="ep-btn" data-ep="${e.number}" data-cid="${e.id}" onclick="goWatch('${e.id}', ${e.number})">
            ${fmt.ep(e.number)}
            ${e.title?`<small>${String(e.title).slice(0,14)}</small>`:''}
        </button>`).join('');
    // scroll ke yang cocok pertama
    setTimeout(()=>{
        const hit = wrap.querySelector('.ep-btn');
        if(hit && q) hit.scrollIntoView({block:'nearest', behavior:'smooth'});
    },30);
};
window.goWatchFirst = () => {
    const b = $('#btn-watch-first');
    if(!b || b.disabled) return;
    const cid = b.dataset.firstCid, num = b.dataset.firstNum;
    if(cid) goWatch(cid, num);
};

// ==================== WATCH / PLAYER ====================
async function renderWatch(epCid, epNum) {
    const page = $('#page-watch');
    S.currentEp = { cid: epCid, num: epNum };
    page.innerHTML = `
    <div class="slide-up">
        <button class="btn-ghost btn" style="margin-bottom:12px;min-width:auto;padding:0 14px;min-height:38px;font-size:12.5px" onclick="goBackFromWatch()"><i class="fas fa-arrow-left"></i> Kembali</button>
        <div class="player-wrap stagger">
            <video id="v-player" playsinline controls preload="auto"></video>
            <div class="player-error" id="v-err">
                <i class="fas fa-triangle-exclamation"></i>
                <strong>Video gagal dimuat</strong>
                <p>Sumber video sedang gangguan. Coba lagi nanti atau ganti episode.</p>
                <button class="btn btn-primary" style="min-width:auto;padding:0 16px;min-height:40px;font-size:12.5px;margin-top:6px" onclick="retryLoadVideo()"><i class="fas fa-rotate"></i> Coba Lagi</button>
            </div>
        </div>
        <h2 style="font-size:17px;font-weight:800;letter-spacing:-.3px;margin-bottom:10px" class="stagger">
            ${S.currentAnime?(S.currentAnime.title?.romaji||S.currentAnime.title?.userPreferred):''}
            <span style="color:var(--p2)">· Episode ${epNum}</span>
        </h2>
        <div class="player-controls stagger">
            <button class="btn btn-ghost" id="btn-prev" onclick="navEp(-1)"><i class="fas fa-chevron-left"></i> Episode Sebelum</button>
            <button class="btn btn-ghost" id="btn-next" onclick="navEp(+1)">Episode Berikut <i class="fas fa-chevron-right"></i></button>
        </div>
        <p style="text-align:center;font-size:11.5px;color:var(--text-3);margin-top:6px" class="stagger">Jika video macet, coba ganti kualitas di pojok kanan bawah player</p>
    </div>`;
    runStagger('#page-watch .stagger');
    loadVideo(epCid);
}
async function loadVideo(epCid) {
    const v = $('#v-player'), err = $('#v-err');
    if(S.hls){ try{S.hls.destroy();}catch(e){} S.hls=null; }
    err.classList.remove('show');
    v.removeAttribute('src'); v.load();
    const src = await getVideoSource(epCid);
    if(!src || (!src.hls && !src.mp4)) { err.classList.add('show'); return; }
    const url = src.hls || src.mp4;
    try {
        if(src.hls && Hls.isSupported()) {
            S.hls = new Hls({ enableWorker:true, lowLatencyMode:false });
            S.hls.loadSource(url);
            S.hls.attachMedia(v);
            S.hls.on(Hls.Events.MANIFEST_PARSED, () => { v.play().catch(()=>{}); });
            S.hls.on(Hls.Events.ERROR, (e,d) => {
                if(d && d.fatal) {
                    if(d.type===Hls.ErrorTypes.NETWORK_ERROR && src.mp4) {
                        try{S.hls.destroy();}catch(x){}
                        v.src = src.mp4; v.play().catch(()=>{});
                    } else err.classList.add('show');
                }
            });
        } else {
            v.src = url;
            v.play().catch(()=>{});
        }
        v.addEventListener('error', ()=> err.classList.add('show'), {once:true});
    } catch(e) { err.classList.add('show'); }
}
window.retryLoadVideo = () => { if(S.currentEp?.cid) loadVideo(S.currentEp.cid); };
window.navEp = (delta) => {
    const list = S._epList || [];
    const cur = Number(S.currentEp?.num||0);
    const idx = list.findIndex(e => Number(e.number)===cur);
    if(idx<0) return;
    const next = list[idx+delta];
    if(!next) { toast('Tidak ada episode selanjutnya','warning'); return; }
    goWatch(next.id, next.number);
};
window.goBackFromWatch = () => {
    if(S.currentAnime?.id) go('anime', S.currentAnime.id); else go('home');
};

// ==================== FAVORITE ====================
function renderFavorite() {
    const wrap = $('#fav-list');
    const ids = Object.keys(S.fav);
    if(!ids.length) {
        wrap.innerHTML = `<div class="empty-state"><i class="fas fa-heart"></i><h3>Belum ada favorit</h3><p>Tekan ♥ di card anime untuk menyimpan di sini</p><button class="btn btn-primary" style="margin-top:14px" onclick="go('home')"><i class="fas fa-house"></i> Cari Anime di Home</button></div>`;
        return;
    }
    wrap.innerHTML = `<div class="grid">${ids.map(id=>{
        const a = S.fav[id];
        return animeCard({ id: Number(id), title:{romaji:a.title}, coverImage:{large:a.cover}, seasonYear:a.year, episodes:'' });
    }).join('')}</div>`;
    renderFavIcons();
}

// ==================== ROUTER (HASH) ====================
function parseHash() {
    const h = location.hash.replace(/^#\/?/,'').trim() || 'home';
    const parts = h.split('/').filter(Boolean);
    return { name: parts[0] || 'home', args: parts.slice(1) };
}
function go(name, ...args) {
    location.hash = `#/${name}${args.length?'/'+args.join('/'):''}`;
}
window.go = go;
window.goAnime = id => go('anime', id);
window.goSearchGenre = g => { $('#search-input').value=''; $('#search-clear').classList.remove('show'); go('search','genre='+encodeURIComponent(g)); };
window.goWatch = (cid, num) => { if(!S.currentAnime?._cid) S.currentAnime._cid = cid; go('watch', cid, num); };

async function handleRoute() {
    const {name, args} = parseHash();
    S.route = name;
    $$('.page').forEach(p=>p.classList.remove('active'));
    $$('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.route===name));
    const ind = $('#nav-indicator');
    const pos = ({home:1,search:2,favorite:3})[name] || 1;
    ind.className = 'nav-indicator pos-'+pos;

    switch(name) {
        case 'home':
            $('#page-home').classList.add('active');
            await renderHome();
            break;
        case 'search': {
            $('#page-search').classList.add('active');
            renderSearchInit();
            const a0 = args[0] || '';
            if(a0.startsWith('genre=')) {
                const g = decodeURIComponent(a0.slice(6));
                doSearch(null, g);
            } else if(a0) {
                const q = decodeURIComponent(a0);
                $('#search-input').value = q; $('#search-clear').classList.add('show');
                doSearch(q);
            }
            break;
        }
        case 'anime':
            $('#page-detail').classList.add('active');
            await renderDetail(args[0]);
            break;
        case 'watch':
            $('#page-watch').classList.add('active');
            await renderWatch(decodeURIComponent(args[0]||''), Number(args[1]||1));
            break;
        case 'favorite':
            $('#page-favorite').classList.add('active');
            renderFavorite();
            break;
        default: go('home');
    }
    window.scrollTo({top:0, behavior:'instant' in ScrollBehavior?'instant':'auto'});
}

// ==================== STAGGER TRIGGER ====================
function runStagger(scope='') {
    $$(`${scope} .stagger`).forEach((el,i)=> setTimeout(()=>el.classList.add('in'), 40 + (i*70)));
}

// ==================== BIND EVENTS ====================
function bind() {
    // Nav
    $$('.nav-item').forEach(n => n.addEventListener('click', ()=> go(n.dataset.route)));
    // Search
    const si = $('#search-input'), sc = $('#search-clear');
    const onSearch = debounce(v => {
        v = (v||'').trim();
        sc.classList.toggle('show', !!v);
        if(!v) return;
        location.hash = `#/search/${encodeURIComponent(v)}`;
    }, 400);
    si.addEventListener('input', e => onSearch(e.target.value));
    si.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); onSearch(e.target.value, true); }});
    sc.addEventListener('click', ()=>{ si.value=''; sc.classList.remove('show'); $('#search-results').innerHTML = `<div class="empty-state" style="padding:40px 10px"><i class="fas fa-magnifying-glass"></i><h3>Mulai mencari</h3><p>Ketik judul anime atau pilih genre</p></div>`; });
    // Autoplay dashboard video after user gesture (jaga-jaga)
    ['click','touchstart','keydown'].forEach(ev => document.addEventListener(ev, ()=>{
        const v = document.querySelector('.dashboard-video video');
        if(v && v.paused) v.play().catch(()=>{});
    }, { once:true, passive:true }));
}

// ==================== INIT ====================
async function init() {
    bind();
    window.addEventListener('hashchange', handleRoute);
    await handleRoute();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
