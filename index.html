<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080A0F">
<meta name="color-scheme" content="dark">
<title>Nanime — Premium Anime Streaming</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/sora/index.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0F;--bg2:#0D1118;--bg3:#121824;--bg4:#182131;
  --text:#F2F5FA;--text2:#AEB7C6;--text3:#727D90;
  --primary:#7893FF;--primary2:#9DAFFF;--primarySoft:rgba(120,147,255,.13);
  --pink:#F276A8;--green:#39D69F;--yellow:#F7C95D;--red:#FF7373;
  --border:rgba(255,255,255,.075);--border2:rgba(255,255,255,.13);
  --shadow:0 25px 70px rgba(0,0,0,.45);
  --r1:14px;--r2:18px;--r3:25px;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.42,.5,1);
  --grad:linear-gradient(130deg,#fff 0%,#d7dfff 52%,#aebdff 70%,#f5a3c3 100%);
  --grad2:linear-gradient(135deg,#7893FF,#F276A8);
  --side-w:250px;--top-h:62px;--nav-h:66px;
}
html{background:var(--bg);scroll-behavior:smooth}
body{
  min-height:100vh;overflow-x:hidden;color:var(--text);
  background:
    radial-gradient(circle at 15% -5%,rgba(120,147,255,.14),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(242,118,168,.07),transparent 28%),
    radial-gradient(circle at 50% 110%,rgba(20,60,140,.12),transparent 62%),
    var(--bg);
  font-family:'Inter Variable',Inter,-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:14px;line-height:1.55;letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Sora Variable',Sora,'Inter Variable',sans-serif;letter-spacing:-.03em}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18)}
:focus-visible{outline:2px solid var(--primary2);outline-offset:3px;border-radius:8px}

/* Background Orbs */
.orb{position:fixed;border-radius:50%;pointer-events:none;filter:blur(100px);opacity:.07;z-index:0;animation:orbFloat 12s ease-in-out infinite}
.orb.a{width:520px;height:520px;top:-160px;left:-160px;background:#6685ff}
.orb.b{width:460px;height:460px;right:-180px;top:35%;background:#ec5d9a;animation-delay:-5s}
@keyframes orbFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(20px,30px,0)}}

/* Top Progress */
.topgrad{position:fixed;left:0;top:0;z-index:900;width:0;height:3px;background:var(--grad2);box-shadow:0 0 14px rgba(120,147,255,.9);transition:width .3s var(--ease),opacity .3s;opacity:0}
.topgrad.on{opacity:1}

/* App Shell */
#app{position:relative;z-index:1;min-height:100vh}
.shell{max-width:1480px;margin:0 auto;padding:0 18px}

/* Topbar (mobile) */
#topbar{
  position:sticky;top:0;z-index:600;height:var(--top-h);
  display:flex;align-items:center;gap:12px;
  padding:0 14px;
  background:rgba(8,10,15,.76);
  backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:36px;height:36px;border-radius:11px;object-fit:cover;border:1px solid var(--border2);background:var(--bg3);box-shadow:0 8px 25px rgba(0,0,0,.28)}
.brand-name{font-family:'Sora Variable',sans-serif;font-size:17px;font-weight:800;letter-spacing:-.035em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.top-spacer{flex:1}
.icon-btn{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,.045);border:1px solid var(--border);
  color:var(--text2);transition:.25s var(--ease);
}
.icon-btn:hover{background:rgba(255,255,255,.075);border-color:var(--border2);color:var(--text)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px}

/* Sidebar (desktop) */
#sidebar{
  display:none;position:fixed;left:0;top:0;bottom:0;width:var(--side-w);z-index:700;
  flex-direction:column;padding:28px 18px;
  background:rgba(10,13,19,.9);border-right:1px solid var(--border);
  backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);
}
.side-brand{display:flex;align-items:center;gap:11px;margin-bottom:32px}
.side-brand img{width:42px;height:42px;border-radius:13px;object-fit:cover;border:1px solid var(--border2)}
.side-brand strong{font-family:'Sora Variable',sans-serif;font-size:21px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.side-nav{display:flex;flex-direction:column;gap:7px;flex:1}
.side-nav-item{
  width:100%;display:flex;align-items:center;gap:13px;padding:12px 14px;
  color:var(--text2);border:1px solid transparent;border-radius:13px;
  transition:.25s var(--ease);font-size:14px;font-weight:600;
}
.side-nav-item:hover{color:var(--text);background:rgba(255,255,255,.04);transform:translateX(2px)}
.side-nav-item.active{color:var(--primary2);background:var(--primarySoft);border-color:rgba(120,147,255,.20)}
.side-nav-item svg{width:20px;height:20px;flex:none}
.side-footer{margin-top:auto;padding:14px;border:1px solid var(--border);border-radius:15px;background:rgba(255,255,255,.025);color:var(--text3);font-size:11px}
.api-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--yellow)}
.api-dot.online{background:var(--green);box-shadow:0 0 12px rgba(57,214,159,.6)}
.api-dot.offline{background:var(--red)}

/* Bottom Nav (mobile) */
#bottomNav{
  position:fixed;left:0;right:0;bottom:0;z-index:600;
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:rgba(8,10,15,.82);
  backdrop-filter:blur(25px) saturate(150%);-webkit-backdrop-filter:blur(25px) saturate(150%);
  border-top:1px solid var(--border);
}
.bottom-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:7px 2px;color:var(--text3);border-radius:13px;transition:.25s var(--ease);
}
.bottom-item svg{width:21px;height:21px}
.bottom-item span{font-size:10px;font-weight:600}
.bottom-item.active{color:var(--primary2);background:rgba(120,147,255,.08)}
.bottom-item:active{transform:scale(.94)}

/* Main */
.main{min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px)}
.page-enter{animation:pageEnter .42s var(--ease) both}
@keyframes pageEnter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Hero */
.hero{
  position:relative;overflow:hidden;min-height:390px;border-radius:var(--r3);
  border:1px solid var(--border);box-shadow:var(--shadow);background:#10151e;
  isolation:isolate;margin-top:18px;
}
.hero-bg{position:absolute;inset:0;z-index:-2}
.hero-bg video{width:100%;height:100%;object-fit:cover;opacity:.48}
.hero-bg::after{
  content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(90deg,rgba(8,10,15,.94) 0%,rgba(8,10,15,.63) 43%,rgba(8,10,15,.24) 72%,rgba(8,10,15,.63) 100%);
}
.hero-inner{
  position:relative;z-index:2;min-height:390px;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:clamp(22px,5vw,55px);
}
.hero-logo-wrap{
  position:relative;width:88px;height:88px;border-radius:24px;padding:4px;
  background:linear-gradient(150deg,rgba(255,255,255,.24),rgba(255,255,255,.05) 40%,rgba(242,118,168,.18));
  box-shadow:0 18px 44px -18px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.24);
  animation:logoIn .9s var(--spring) .12s both;margin-bottom:18px;
}
@keyframes logoIn{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
.hero-logo-wrap::after{
  content:"";position:absolute;inset:-14px;border-radius:38px;z-index:-1;
  background:radial-gradient(circle,rgba(120,147,255,.35),transparent 68%);filter:blur(16px);opacity:.75;
  animation:breathe 5.5s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.5;transform:scale(.95)}50%{opacity:.85;transform:scale(1.06)}}
.hero-logo-inner{width:100%;height:100%;border-radius:20px;overflow:hidden;background:#0A0C11;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.hero-logo-inner img{width:100%;height:100%;object-fit:cover}
.hero-kicker{
  display:inline-flex;align-items:center;gap:7px;width:max-content;
  margin-bottom:13px;padding:7px 11px;border-radius:999px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  color:#dce3ee;font-size:11px;font-weight:700;backdrop-filter:blur(10px);
  animation:pageEnter .9s var(--ease) .2s both;
}
.hero-kicker i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.hero-title{
  max-width:760px;font-size:clamp(34px,8vw,74px);line-height:.98;letter-spacing:-.065em;font-weight:800;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:pageEnter .9s var(--ease) .25s both;
}
.hero-description{max-width:600px;margin-top:14px;color:#b4bdcc;font-size:clamp(12px,2vw,15px);animation:pageEnter .9s var(--ease) .35s both}
.hero-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px;animation:pageEnter .9s var(--ease) .45s both}

/* Dashboard Preview (16:9) */
.dash{
  position:relative;width:100%;max-width:980px;margin:24px auto 0;aspect-ratio:16/9;
  border-radius:var(--r2);overflow:hidden;background:#07080C;
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.95),0 0 0 1px rgba(120,147,255,.10),0 0 70px -28px rgba(120,147,255,.42);
  animation:pageEnter 1s var(--ease) .5s both;
}
.dash video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none}
.dash .shine{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.dash .shine::before{
  content:"";position:absolute;top:-60%;left:-70%;width:52%;height:220%;transform:rotate(16deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.055),transparent);
  animation:shine 7.5s var(--ease) infinite 1.6s;
}
@keyframes shine{0%{left:-70%}55%,100%{left:130%}}
.dash-badge{
  position:absolute;left:14px;top:14px;z-index:2;display:flex;align-items:center;gap:7px;
  padding:6px 11px;border-radius:99px;font-size:11px;font-weight:650;letter-spacing:.04em;color:#dce7ff;
  background:rgba(8,10,16,.5);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);pointer-events:none;
}

/* Buttons */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 18px;border-radius:13px;font-size:12.5px;font-weight:700;
  border:1px solid var(--border);color:var(--text);background:rgba(255,255,255,.04);
  transition:.3s var(--ease);white-space:nowrap;
}
.btn svg{width:17px;height:17px}
.btn:hover{transform:translateY(-2px);border-color:var(--border2);background:rgba(255,255,255,.08);box-shadow:var(--shadow)}
.btn:active{transform:scale(.96)}
.btn.primary{
  background:linear-gradient(135deg,#7893FF,#506EF0);border-color:transparent;color:#fff;
  box-shadow:0 12px 25px rgba(80,110,240,.25),inset 0 1px 0 rgba(255,255,255,.28);
}
.btn.primary:hover{box-shadow:0 18px 35px rgba(80,110,240,.4),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.danger{border-color:rgba(242,118,168,.35);color:#ffd1e3;background:rgba(242,118,168,.10)}
.btn.sm{height:36px;padding:0 13px;border-radius:11px;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* Search Box */
.search-box{
  position:relative;display:flex;align-items:center;gap:10px;min-height:54px;padding:0 16px;
  border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.025));
  border:1px solid var(--border);transition:.3s var(--ease);
}
.search-box:focus-within{border-color:rgba(120,147,255,.46);box-shadow:0 0 0 4px rgba(120,147,255,.08)}
.search-box svg{width:20px;height:20px;color:var(--text3);flex:none}
.search-box input{width:100%;border:0;outline:none;color:var(--text);background:transparent;font-size:14px}
.search-box input::placeholder{color:var(--text3)}

/* Sections */
.section{margin-top:34px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:14px}
.section-title-wrap{display:flex;flex-direction:column;gap:3px}
.section-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--primary2);font-weight:700}
.section-title{font-size:clamp(18px,3vw,24px);letter-spacing:-.035em;font-weight:800}
.section-desc{font-size:12px;color:var(--text3)}
.section-more{
  flex:none;padding:9px 12px;border-radius:11px;color:var(--text2);
  background:rgba(255,255,255,.035);border:1px solid var(--border);
  font-size:12px;font-weight:600;transition:.25s;
}
.section-more:hover{color:var(--text);border-color:var(--border2);background:rgba(255,255,255,.06);transform:translateY(-1px)}

/* Shelf */
.shelf{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(145px,172px);gap:13px;
  overflow-x:auto;padding:5px 4px 12px;scroll-snap-type:x mandatory;
  overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.shelf::-webkit-scrollbar{display:none}

/* Grid */
.anime-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}

/* Card */
.card{
  position:relative;overflow:hidden;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.018));
  border:1px solid var(--border);cursor:pointer;transform:translateZ(0);
  transition:transform .38s var(--ease),border-color .28s,box-shadow .38s var(--ease);
  animation:cardEnter .55s var(--ease) both;scroll-snap-align:start;
}
@keyframes cardEnter{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.card:hover{transform:translateY(-5px) scale(1.015);border-color:rgba(255,255,255,.14);box-shadow:0 18px 45px rgba(0,0,0,.28)}
.card:active{transform:translateY(-2px) scale(.99)}
.poster{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--bg3)}
.poster img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.015);transition:opacity .4s,transform .5s var(--ease)}
.poster img.loaded{opacity:1}
.card:hover .poster img{transform:scale(1.055)}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.3));pointer-events:none}
.badge{
  position:absolute;z-index:2;top:8px;left:8px;padding:5px 8px;border-radius:8px;
  background:rgba(5,7,11,.70);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(9px);
  font-size:9px;font-weight:700;color:var(--primary2);
}
.card-heart{
  position:absolute;z-index:4;top:7px;right:7px;width:31px;height:31px;
  display:grid;place-items:center;border-radius:50%;color:#fff;
  background:rgba(5,7,11,.68);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);
  transition:transform .25s,background .25s;font-size:15px;
}
.card-heart:hover{transform:scale(1.08)}
.card-heart.active{background:var(--pink);color:#fff}
.card-heart.beat{animation:beat .55s var(--spring)}
@keyframes beat{0%{transform:scale(1)}35%{transform:scale(1.42)}60%{transform:scale(.88)}100%{transform:scale(1)}}
.card-body{padding:10px 10px 11px}
.card-title{
  height:35px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  font-size:12px;line-height:1.4;font-weight:650;color:var(--text);
}
.card-meta{margin-top:8px;display:flex;justify-content:space-between;gap:7px;font-size:10px;color:var(--text3)}
.score{color:var(--yellow);font-weight:700}

/* Genre Chips */
.genre-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 7px;scrollbar-width:none}
.genre-scroll::-webkit-scrollbar{display:none}
.genre-chip{
  flex:none;padding:9px 13px;border-radius:999px;
  background:rgba(255,255,255,.035);border:1px solid var(--border);
  color:var(--text2);white-space:nowrap;font-size:12px;font-weight:600;
  transition:transform .25s,background .25s,border-color .25s,color .25s;
}
.genre-chip:hover{transform:translateY(-2px);border-color:var(--border2);color:var(--text)}
.genre-chip.active{
  background:linear-gradient(135deg,rgba(120,147,255,.24),rgba(120,147,255,.11));
  border-color:rgba(120,147,255,.36);color:var(--primary2);
}

/* Detail */
.detail-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:23px}
.detail-poster{
  aspect-ratio:2/3;overflow:hidden;border-radius:20px;border:1px solid var(--border);
  background:var(--bg3);box-shadow:var(--shadow);
  animation:coverIn .95s var(--spring) both;
}
@keyframes coverIn{from{opacity:0;transform:translateY(26px) scale(.9)}to{opacity:1;transform:none}}
.detail-poster img{width:100%;height:100%;object-fit:cover}
.detail-content{min-width:0}
.detail-provider{
  display:inline-flex;padding:6px 9px;border-radius:8px;color:var(--primary2);
  background:var(--primarySoft);border:1px solid rgba(120,147,255,.2);
  font-size:10px;font-weight:700;margin-bottom:10px;
}
.detail-title{font-size:clamp(26px,5vw,42px);line-height:1.02;letter-spacing:-.055em;font-weight:800}
.detail-alt{margin-top:7px;color:var(--text3);font-size:12px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:18px}
.info-box{
  min-height:62px;padding:11px 12px;border:1px solid var(--border);border-radius:13px;
  background:rgba(255,255,255,.025);transition:.25s var(--ease);
}
.info-box:hover{background:rgba(255,255,255,.05);transform:translateY(-2px)}
.info-box label{display:block;margin-bottom:4px;color:var(--text3);font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.info-box strong{display:block;color:var(--text);font-size:12px;line-height:1.4}
.detail-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}

/* Panel */
.panel{
  margin-top:18px;padding:17px;border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.018));
  border:1px solid var(--border);
}
.panel-title{font-size:14px;font-weight:750;margin-bottom:11px;display:flex;align-items:center;gap:9px}
.panel-title::before{content:"";width:3px;height:17px;border-radius:2px;background:var(--grad2);box-shadow:0 0 12px rgba(120,147,255,.8)}
.synopsis{color:var(--text2);font-size:13px;line-height:1.8;white-space:pre-line}

/* Episode Grid */
.episode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;max-height:380px;overflow:auto;padding:2px}
.episode-button{
  min-height:50px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid var(--border);
  color:var(--text2);font-size:12px;font-weight:700;
  transition:background .25s,border-color .25s,color .25s,transform .25s;
}
.episode-button:hover{color:var(--text);border-color:var(--border2);transform:translateY(-1px);background:rgba(255,255,255,.06)}
.episode-button.active{color:#fff;background:var(--primary);border-color:var(--primary)}

/* Player */
.player-shell{
  position:relative;overflow:hidden;width:100%;aspect-ratio:16/9;border-radius:20px;
  background:#020305;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:16px;
  animation:coverIn .8s var(--ease) both;
}
.player-shell iframe{width:100%;height:100%;display:block;border:0;background:#000}
.player-empty{width:100%;height:100%;display:grid;place-items:center;padding:30px;text-align:center;color:var(--text3)}
.player-empty strong{color:var(--text)}

/* Server */
.server-list{display:flex;flex-direction:column;gap:12px}
.server-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.server-label{min-width:78px;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:750}
.server-button{
  min-height:34px;padding:0 11px;border-radius:9px;
  background:rgba(255,255,255,.035);border:1px solid var(--border);color:var(--text2);
  font-size:11px;font-weight:650;transition:transform .22s,background .22s,color .22s,border-color .22s;
}
.server-button:hover{transform:translateY(-1px);border-color:var(--border2);color:var(--text)}
.server-button.active{color:#fff;background:var(--primary);border-color:var(--primary)}
.server-button.loading{pointer-events:none;opacity:.5}

/* State */
.state{padding:75px 20px;text-align:center;color:var(--text3)}
.state-icon{
  width:62px;height:62px;display:grid;place-items:center;margin:0 auto 15px;
  border-radius:20px;background:rgba(255,255,255,.035);border:1px solid var(--border);
  font-size:26px;animation:floaty 4.6s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.state h3{color:var(--text);font-size:18px;margin-bottom:6px}
.state p{max-width:520px;margin:auto;font-size:12px;line-height:1.7}

/* Skeleton */
.skeleton{
  position:relative;overflow:hidden;
  background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));
  background-size:200% 100;animation:skeletonMove 1.5s linear infinite;border-radius:15px;
}
@keyframes skeletonMove{from{background-position:200% 0}to{background-position:-200% 0}}
.skeleton-card{overflow:hidden;border-radius:16px;background:rgba(255,255,255,.025);border:1px solid var(--border)}
.skeleton-poster{aspect-ratio:2/3}
.skeleton-line{height:10px;margin:11px}
.skeleton-line.short{width:55%;margin-top:-4px}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 22px);z-index:9000;
  min-width:180px;max-width:calc(100vw - 30px);padding:12px 15px;border-radius:13px;
  background:rgba(18,24,36,.94);border:1px solid var(--border2);box-shadow:var(--shadow);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  text-align:center;font-size:12px;font-weight:540;
  opacity:0;pointer-events:none;transform:translate(-50%,25px) scale(.96);
  transition:opacity .3s var(--ease),transform .3s var(--ease);
}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast.ok{border-color:rgba(57,214,159,.35)}
#toast.err{border-color:rgba(255,115,115,.35)}

/* Load More */
.load-more-wrap{display:flex;justify-content:center;margin-top:20px}
.load-more{min-width:145px}

/* Reveal */
.rv{opacity:0;transform:translateY(18px);transition:opacity .62s var(--ease),transform .62s var(--ease);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}

/* Footer */
footer.ft{margin:46px 0 8px;padding:22px 0 8px;border-top:1px solid var(--border);display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:11.8px;color:var(--text3)}
footer.ft .lg{display:flex;align-items:center;gap:9px;color:var(--text2)}
footer.ft img{width:22px;height:22px;border-radius:7px}

/* Desktop */
@media(min-width:900px){
  #sidebar{display:flex}
  #topbar{display:none}
  .main{padding-left:var(--side-w);padding-bottom:40px}
  .shell{padding:0 34px}
  #bottomNav{display:none}
  .hero{min-height:500px}
  .hero-inner{min-height:500px}
  .hero-logo-wrap{width:108px;height:108px;border-radius:28px}
  .anime-grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:18px}
  .shelf{grid-auto-columns:178px;gap:16px}
  .detail-layout{grid-template-columns:240px minmax(0,1fr);gap:28px}
  #toast{bottom:26px;left:auto;right:26px;transform:none}
  #toast.show{transform:translateY(0) scale(1)}
}
@media(max-width:620px){
  .shell{padding:0 14px}
  .hero{min-height:390px;border-radius:21px}
  .hero-inner{min-height:390px;padding:21px}
  .hero-title{font-size:clamp(35px,12vw,53px)}
  .hero-description{font-size:12px}
  .anime-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .shelf{grid-auto-columns:140px}
  .detail-layout{grid-template-columns:120px minmax(0,1fr);gap:14px}
  .detail-title{font-size:24px}
  .info-grid{grid-template-columns:repeat(2,1fr)}
  .panel{padding:14px}
}
@media(max-width:390px){
  .anime-grid{gap:8px}
  .card-body{padding:8px}
  .card-title{font-size:11px}
  .detail-layout{grid-template-columns:100px minmax(0,1fr)}
  .detail-title{font-size:21px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="orb a"></div>
<div class="orb b"></div>
<div class="topgrad" id="topgrad"></div>

<div id="app">
  <aside id="sidebar"></aside>

  <header id="topbar">
    <button class="icon-btn" id="backButton" style="display:none" aria-label="Kembali">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="brand">
      <img class="brand-logo" src="logo.jpg" alt="Nanime" onerror="this.style.display='none'">
      <div class="brand-name">NANIME</div>
    </div>
    <div class="top-spacer"></div>
    <span id="tbStatus"></span>
    <button class="icon-btn" id="searchTop" aria-label="Cari">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
  </header>

  <main class="main">
    <div class="shell">
      <div id="view"></div>
    </div>
  </main>

  <nav id="bottomNav"></nav>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   CONFIG
========================================================= */
const API_BASE_URL = "https://enables-steel-relates-temporarily.trycloudflare.com";

const PROVIDERS = {
  otakudesu:{name:"Otakudesu",active:true,search:true},
  oploverz:{name:"Oploverz",active:true,search:true},
  kuramanime:{name:"Kuramanime",active:true,search:false},
  samehadaku:{name:"Samehadaku",active:false,search:false}
};

const STORAGE = {favorites:"nanime:favorites",history:"nanime:history"};

/* =========================================================
   ICONS
========================================================= */
const ICONS = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  explore:'<path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/><circle cx="8" cy="5" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="10" cy="19" r="2"/>',
  favorite:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8L12 21l7.8-7.5a5.5 5.5 0 0 0 1-8.9Z"/>',
  history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const svg = (n,cls) => '<svg class="'+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||'')+'</svg>';

/* =========================================================
   NAV
========================================================= */
const NAV_ITEMS = [
  {key:"home",label:"Home",icon:"home"},
  {key:"search",label:"Cari",icon:"search"},
  {key:"explore",label:"Jelajah",icon:"explore"},
  {key:"fav",label:"Favorit",icon:"favorite"},
  {key:"history",label:"Riwayat",icon:"history"}
];

/* =========================================================
   CACHE
========================================================= */
const CARD_CACHE = new Map();
let CARD_ID = 0;
function registerCard(anime){const id=`card_${++CARD_ID}`;CARD_CACHE.set(id,anime);return id}

/* =========================================================
   UTIL
========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const readStorage = k => {try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}};
const writeStorage = (k,v) => localStorage.setItem(k,JSON.stringify(v));
const debounce = (fn,ms) => {let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),ms)}};

function toast(message,type=''){
  const el = $('#toast');
  el.textContent = message;
  el.className = `show ${type}`;
  clearTimeout(el._timer);
  el._timer = setTimeout(()=>{el.className=''},3200);
}
const cleanText = s => String(s??'').replace(/\s+/g,' ').trim();
function progress(on,pct){const g=$('#topgrad');g.classList.toggle('on',!!on);if(pct!=null)g.style.width=pct+'%';if(!on)setTimeout(()=>{g.style.width='0'},340)}

/* =========================================================
   FETCH
========================================================= */
async function fetchAPI(endpoint,timeout=20000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(),timeout);
  try{
    const response = await fetch(`${API_BASE_URL}${endpoint}`,{method:'GET',headers:{Accept:'application/json'},signal:controller.signal});
    const raw = await response.text();
    clearTimeout(timer);
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    try{return JSON.parse(raw)}catch{throw new Error('Tunnel mengirim response non-JSON.')}
  }catch(error){
    clearTimeout(timer);
    if(error.name==='AbortError') throw new Error('Request timeout. Quick Tunnel tidak merespons.');
    throw error;
  }
}

/* =========================================================
   LAZY IMAGES
========================================================= */
let IMG_IO = null;
function initLazyImages(){
  if(!IMG_IO){
    IMG_IO = new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(!entry.isIntersecting) return;
        const img = entry.target;
        img.src = img.dataset.src;
        img.onload = ()=>img.classList.add('loaded');
        img.onerror = ()=>img.removeAttribute('src');
        IMG_IO.unobserve(img);
      });
    },{rootMargin:'250px'});
  }
  $$('img[data-src]').forEach(img=>IMG_IO.observe(img));
}

/* Reveal */
let RV_IO = null;
function initReveal(root){
  if(!RV_IO){
    RV_IO = new IntersectionObserver(entries=>{
      entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');RV_IO.unobserve(e.target)}});
    },{rootMargin:'0px 0px -8% 0px',threshold:.05});
  }
  $$('.rv:not(.in)',root||document).forEach(n=>RV_IO.observe(n));
}

/* =========================================================
   FAVORITES
========================================================= */
function isFavorite(id,provider){return readStorage(STORAGE.favorites).some(i=>i.id===id&&i.provider===provider)}
function toggleFavorite(anime){
  let favs = readStorage(STORAGE.favorites);
  const idx = favs.findIndex(i=>i.id===anime.id&&i.provider===anime.provider);
  if(idx>=0){favs.splice(idx,1);toast('Dihapus dari favorit')}
  else{favs.unshift(anime);toast('Ditambahkan ke favorit','ok')}
  writeStorage(STORAGE.favorites,favs);
  renderNavigation();
}

/* =========================================================
   HISTORY
========================================================= */
function saveHistory(anime,episode){
  let hist = readStorage(STORAGE.history);
  hist = hist.filter(i=>!(i.id===anime.id&&i.provider===anime.provider));
  hist.unshift({...anime,episode,watchedAt:Date.now()});
  writeStorage(STORAGE.history,hist.slice(0,60));
}

/* =========================================================
   NORMALIZERS
========================================================= */
function normalizeOtakudesuCard(item){
  return {id:item.animeId,slug:'',provider:'otakudesu',title:item.title||'Unknown',poster:item.poster||'',score:item.score||'-',type:item.type||'',status:item.status||'',episodes:item.episodes||'',meta:item.latestReleaseDate||item.lastReleaseDate||item.releaseDay||''};
}
function normalizeGenreCard(item){
  return {id:item.animeId,slug:'',provider:'otakudesu',title:item.title||'Unknown',poster:item.poster||'',score:item.score||'-',type:'',status:'',episodes:item.episodes||'',meta:item.season||item.studios||''};
}
function normalizeOploverzSearch(item){
  return {id:item.slug,slug:item.slug,provider:'oploverz',title:item.title||'Unknown',poster:item.poster||'',score:'-',type:item.type||'',status:item.status||'',episodes:'',meta:item.type||''};
}

/* =========================================================
   API
========================================================= */
const API = {
  async home(){
    const r = await fetchAPI('/otakudesu/home');
    const h = r?.data;
    return {ongoing:h?.ongoing?.animeList||[],completed:h?.completed?.animeList||[]};
  },
  async genres(){const r=await fetchAPI('/otakudesu/genre');return r?.data?.genreList||[]},
  async ongoing(page=1){const r=await fetchAPI(`/otakudesu/ongoing?page=${page}`);return{list:(r?.data?.animeList||[]).map(normalizeOtakudesuCard),pagination:r?.pagination||null}},
  async completed(page=1){const r=await fetchAPI(`/otakudesu/completed?page=${page}`);return{list:(r?.data?.animeList||[]).map(normalizeOtakudesuCard),pagination:r?.pagination||null}},
  async genre(genreId,page=1){const r=await fetchAPI(`/otakudesu/genre/${encodeURIComponent(genreId)}?page=${page}`);return{list:(r?.data?.animeList||[]).map(normalizeGenreCard),pagination:r?.pagination||null}},
  async search(query){
    const providers = Object.entries(PROVIDERS).filter(([,p])=>p.active&&p.search);
    const results = await Promise.all(providers.map(async([key])=>{
      try{
        if(key==='otakudesu'){const r=await fetchAPI(`/otakudesu/search?q=${encodeURIComponent(query)}`);return(r?.data?.animeList||[]).map(normalizeOtakudesuCard)}
        if(key==='oploverz'){const r=await fetchAPI(`/oploverz/search?q=${encodeURIComponent(query)}`);return(r?.data?.animeList||[]).map(normalizeOploverzSearch)}
        return [];
      }catch{return[]}
    }));
    return results.flat();
  },
  async detail(provider,id,slug=''){
    let endpoint;
    if(provider==='otakudesu') endpoint=`/otakudesu/anime/${encodeURIComponent(id)}`;
    else if(provider==='oploverz') endpoint=`/oploverz/anime/${encodeURIComponent(id)}`;
    else if(provider==='kuramanime') endpoint=`/kuramanime/anime/${encodeURIComponent(id)}/${encodeURIComponent(slug||id)}`;
    else throw new Error('Provider tidak tersedia.');
    const r = await fetchAPI(endpoint);
    const data = r?.data?.details;
    if(!data) throw new Error('Detail anime tidak ditemukan.');
    if(provider==='otakudesu'){
      return {id,slug:'',provider,title:data.title||'Unknown',alt:data.japanese||'',poster:data.poster||'',score:data.score||'-',type:data.type||'-',status:data.status||'-',year:data.aired||'-',episodes:data.episodes||'-',duration:data.duration||'-',studio:data.studios||'-',genres:(data.genreList||[]).map(i=>i.title),synopsis:(data.synopsis?.paragraphList||[]).join('\n\n')||'Sinopsis tidak tersedia.',episodeList:(data.episodeList||[]).map(i=>({num:i.title,id:i.episodeId,slug:'',date:''}))};
    }
    if(provider==='oploverz'){
      return {id,slug:data.title?id:id,provider,title:data.title||'Unknown',alt:'',poster:data.poster||'',score:data.rating||'-',type:data.type||'-',status:data.status||'-',year:data.releasedOn||'-',episodes:(data.episodeList||[]).length,duration:data.duration||'-',studio:data.studio||'-',genres:Array.isArray(data.genres)?data.genres:[],synopsis:(data.synopsis?.paragraphList||[]).join('\n\n')||'Sinopsis tidak tersedia.',episodeList:(data.episodeList||[]).map(i=>{const href=i.href||'';const s=href.split('/').filter(Boolean).pop()||'';return{num:i.episode,id:href,slug:s,date:i.date||''}})};
    }
    return {id:data.animeId||id,slug:data.animeSlug||slug,provider,title:data.title||'Unknown',alt:data.alternativeTitle||'',poster:data.poster||'',score:data.score||'-',type:data.type?.title||'-',status:data.status?.title||'-',year:data.aired||'-',episodes:data.episodes||'-',duration:data.duration||'-',studio:Array.isArray(data.studioList)?data.studioList.map(x=>x.title).join(', '):'-',genres:(data.genreList||[]).map(x=>cleanText(x.title)),synopsis:(data.synopsis?.paragraphList||[]).join('\n\n')||'Sinopsis tidak tersedia.',episodeList:[]};
  },
  async episode(provider,params){
    let endpoint;
    if(provider==='otakudesu') endpoint=`/otakudesu/episode/${encodeURIComponent(params.episodeId)}`;
    else if(provider==='oploverz') endpoint=`/oploverz/episode/${encodeURIComponent(params.episodeSlug||params.episodeId)}`;
    else if(provider==='kuramanime') endpoint=`/kuramanime/episode/${encodeURIComponent(params.animeId)}/${encodeURIComponent(params.animeSlug)}/${encodeURIComponent(params.episodeId)}`;
    else throw new Error('Provider tidak tersedia.');
    const r = await fetchAPI(endpoint);
    const details = r?.data?.details;
    if(!details) throw new Error('Data episode tidak ditemukan.');
    if(provider==='otakudesu'){
      return {provider,title:details.title||`Episode ${params.episode}`,playerUrl:details.defaultStreamingUrl||'',qualities:(details.server?.qualityList||[]).map(q=>({title:cleanText(q.title),servers:(q.serverList||[]).map(s=>({name:s.title,id:s.serverId}))}))};
    }
    if(provider==='oploverz'){
      return {provider,title:details.title||`Episode ${params.episode}`,playerUrl:details.streamingUrl||'',qualities:[]};
    }
    return {provider,title:details.episodeTitle||details.title||`Episode ${params.episode}`,playerUrl:'',qualities:Array.isArray(details.server?.qualityList)?details.server.qualityList:[]};
  },
  async resolveServer(serverId){const r=await fetchAPI(`/otakudesu/server/${encodeURIComponent(serverId)}`);return r?.data?.details?.url||''}
};

/* =========================================================
   CARD HTML
========================================================= */
function animeCardHTML(anime){
  const key = registerCard(anime);
  const fav = isFavorite(anime.id,anime.provider);
  return `<article class="card" data-card-key="${key}">
    <div class="poster">
      <img data-src="${esc(anime.poster)}" alt="${esc(anime.title)}">
      <span class="badge">${esc(PROVIDERS[anime.provider]?.name||anime.provider)}</span>
      <button class="card-heart ${fav?'active':''}" data-favorite aria-label="Favorit">${fav?'♥':'♡'}</button>
    </div>
    <div class="card-body">
      <div class="card-title">${esc(anime.title)}</div>
      <div class="card-meta">
        <span>${esc(anime.episodes?`${anime.episodes} eps`:anime.meta||'')}</span>
        <span class="score">${anime.score&&anime.score!=='-'?`★ ${esc(anime.score)}`:''}</span>
      </div>
    </div>
  </article>`;
}

function bindCards(){
  $$('[data-card-key]').forEach(card=>{
    const key = card.dataset.cardKey;
    const anime = CARD_CACHE.get(key);
    if(!anime) return;
    card.addEventListener('click',e=>{
      if(e.target.closest('[data-favorite]')) return;
      router.navigate('detail',{provider:anime.provider,id:anime.id,slug:anime.slug||''});
    });
    const fav = card.querySelector('[data-favorite]');
    fav?.addEventListener('click',e=>{
      e.stopPropagation();
      toggleFavorite(anime);
      const active = isFavorite(anime.id,anime.provider);
      fav.classList.toggle('active',active);
      fav.textContent = active?'♥':'♡';
      fav.classList.remove('beat');void fav.offsetWidth;fav.classList.add('beat');
    });
  });
}

function skeletonCards(n=8){return Array.from({length:n},()=>`<div class="skeleton-card"><div class="skeleton skeleton-poster"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div>`).join('')}

function footerHTML(){
  return `<footer class="ft"><span class="lg"><img src="logo.jpg" alt="" onerror="this.style.display='none'"><b style="color:var(--text2);font-weight:600">Nanime</b> · Powered by Wajik API</span><span>Quick Tunnel · Otakudesu · Oploverz · Kuramanime</span></footer>`;
}

/* =========================================================
   NAVIGATION UI
========================================================= */
function renderNavigation(){
  const current = router.current?.page||'home';
  $('#sidebar').innerHTML = `
    <div class="side-brand">
      <img src="logo.jpg" alt="Nanime" onerror="this.style.display='none'">
      <strong>NANIME</strong>
    </div>
    <div class="side-nav">
      ${NAV_ITEMS.map(i=>`<button class="side-nav-item ${current===i.key?'active':''}" data-nav="${i.key}">${svg(i.icon)}<span>${i.label}</span></button>`).join('')}
    </div>
    <div class="side-footer">
      <span class="api-dot" id="apiDot"></span>
      <span id="apiStatusText">Mengecek API...</span>
      <br><small>Quick Tunnel</small>
    </div>`;
  $('#bottomNav').innerHTML = NAV_ITEMS.map(i=>`<button class="bottom-item ${current===i.key?'active':''}" data-nav="${i.key}">${svg(i.icon)}<span>${i.label}</span></button>`).join('');
  $$('[data-nav]').forEach(el=>{el.onclick=()=>router.navigate(el.dataset.nav,{},{push:false})});
  const backVisible = !['home','search','explore','fav','history'].includes(current);
  $('#backButton').style.display = backVisible?'grid':'none';
  checkAPIStatus();
}

async function checkAPIStatus(){
  const dot = $('#apiDot');const text = $('#apiStatusText');const tb = $('#tbStatus');
  if(!dot||!text) return;
  try{
    await fetchAPI('/otakudesu/',9000);
    dot.className='api-dot online';text.textContent='API Online';
    if(tb) tb.innerHTML='<span class="api-dot online" title="API Online"></span>';
  }catch{
    dot.className='api-dot offline';text.textContent='API / Tunnel Error';
    if(tb) tb.innerHTML='<span class="api-dot offline" title="API Offline"></span>';
  }
}

/* =========================================================
   HOME
========================================================= */
const homeState = {genres:[],genreShelves:[]};

async function renderHome(){
  $('#view').innerHTML = `

    try{

async function renderCatalog(params){
  const type = params.type==='completed'?'completed':'ongoing';
  const title = type==='ongoing'?'Sedang Tayang':'Anime Selesai';
  let currentPage = 1;let hasNextPage = true;
  $('#view').innerHTML = `
    <div class="page-enter">
      <section class="section" style="margin-top:4px">
        <div class="section-head">
          <div class="section-title-wrap">
            <span class="section-kicker">CATALOG</span>
            <h1 class="section-title">${title}</h1>
          </div>
        </div>
        <div id="catalogGrid" class="anime-grid">${skeletonCards(12)}</div>
        <div class="load-more-wrap" id="loadMoreWrap">
          <button class="btn load-more" id="loadMore">Muat lebih banyak</button>
        </div>
        ${footerHTML()}
      </section>
    </div>`;
  async function loadPage(page,append=false){
    const result = await (type==='ongoing'?API.ongoing(page):API.completed(page));
    currentPage = page;hasNextPage = !!result.pagination?.hasNextPage;
    const normalized = result.list;
    const grid = $('#catalogGrid');
    if(!append) grid.innerHTML = normalized.map(animeCardHTML).join('');
    else grid.insertAdjacentHTML('beforeend',normalized.map(animeCardHTML).join(''));
    bindCards();initLazyImages();initReveal(grid);
    $('#loadMoreWrap').style.display = hasNextPage?'flex':'none';
  }
  try{
    await loadPage(1,false);
    $('#loadMore').onclick = async()=>{
      if(!hasNextPage) return;
      const b = $('#loadMore');b.disabled=true;b.textContent='Memuat...';
      try{await loadPage(currentPage+1,true)}catch(e){toast(e.message,'err')}
      finally{b.disabled=false;b.textContent='Muat lebih banyak'}
    };
  }catch(error){
    $('#catalogGrid').innerHTML = `<div style="grid-column:1/-1"><div class="state"><div class="state-icon">⚠️</div><h3>Katalog gagal dimuat</h3><p>${esc(error.message)}</p></div></div>`;
    $('#loadMoreWrap').style.display = 'none';
  }
}

async function renderPlayer(params){

    let playerUrl = stream.playerUrl||'';
    const episodes = Array.isArray(params.episodeList)?params.episodeList:[];
    const index = episodes.findIndex(ep=>String(ep.num)===String(params.episode));
    const previous = index>0?episodes[index-1]:null;
    const next = index>=0&&index<episodes.length-1?episodes[index+1]:null;
    const playerMarkup = playerUrl?`<iframe id="playerFrame" src="${esc(playerUrl)}" allowfullscreen loading="eager" referrerpolicy="no-referrer"></iframe>`:`<div class="player-empty"><div><div class="state-icon" style="margin-bottom:13px">🎬</div><strong>Player tidak tersedia</strong><p style="margin-top:7px">Provider tidak memberikan player URL untuk episode ini.</p></div></div>`;

          <div class="section-title-wrap">
            <span class="section-kicker">PLAYER</span>
            <h1 class="section-title">${esc(params.title)} · Episode ${esc(params.episode)}</h1>
          </div>
        </div>
        <div class="player-shell">${playerMarkup}</div>
        <div class="detail-actions" style="margin-bottom:17px">
          ${previous?`<button class="btn" id="prevEpisode">← Prev</button>`:`<button class="btn" disabled>← Prev</button>`}
          <button class="btn" id="episodeListButton">☷ Episode</button>
          ${next?`<button class="btn primary" id="nextEpisode">Next →</button>`:`<button class="btn" disabled>Next →</button>`}
        </div>
        ${stream.qualities.length?`<div class="panel"><div class="panel-title">Server & Kualitas</div><div class="server-list">${stream.qualities.map(q=>`<div class="server-row"><span class="server-label">${esc(q.title)}</span>${q.servers.map(s=>`<button class="server-button" data-server-id="${esc(s.id)}">${esc(s.name)}</button>`).join('')}</div>`).join('')}</div></div>`:`<div class="panel"><div class="panel-title">Player</div><div style="color:var(--text3);font-size:12px">${playerUrl?'Provider menggunakan player URL langsung.':'Tidak ada player URL dari API.'}</div></div>`}
        ${episodes.length?`<div class="panel"><div class="panel-title">Episode Lainnya</div><div class="episode-grid">${episodes.map(ep=>`<button class="episode-button ${String(ep.num)===String(params.episode)?'active':''}" data-play-episode="${registerCard(ep)}">${esc(ep.num)}</button>`).join('')}</div></div>`:''}

      </div>`;

    $('#nextEpisode')?.addEventListener('click',()=>{router.navigate('player',{...params,episode:next.num,episodeId:next.id,episodeSlug:next.slug})});

      b.onclick = async()=>{
        const serverId = b.dataset.serverId;
        if(!serverId){toast('Server ID kosong.','err');return}
        if(params.provider!=='otakudesu'){toast('Resolver server hanya tersedia untuk Otakudesu.','err');return}
        $$('.server-button').forEach(i=>i.classList.remove('active'));
        b.classList.add('loading');
        try{
          const resolvedUrl = await API.resolveServer(serverId);
          if(!resolvedUrl) throw new Error('Wajik mengembalikan response tanpa data.details.url.');
          const iframe = $('#playerFrame');
          if(!iframe) throw new Error('Player iframe tidak ditemukan.');
          iframe.src = resolvedUrl;
          b.classList.remove('loading');b.classList.add('active');
          toast(`Server ${b.textContent.trim()} aktif.`,'ok');
        }catch(error){
          b.classList.remove('loading');
          toast(error.message,'err');
        }
      };
    });
    $$('[data-play-episode]').forEach(b=>{
      b.onclick = ()=>{
        const ep = CARD_CACHE.get(b.dataset.playEpisode);
        if(!ep) return;
        router.navigate('player',{...params,episode:ep.num,episodeId:ep.id,episodeSlug:ep.slug});
      };
    });
  }catch(error){
    progress(false);
    $('#view').innerHTML = `<div class="state page-enter"><div class="state-icon">⚠️</div><h3>Stream gagal dimuat</h3><p>${esc(error.message)}</p><div class="detail-actions" style="justify-content:center;margin-top:15px"><button class="btn primary" id="retryPlayer">Coba lagi</button><button class="btn" id="backFromPlayer">Kembali</button></div></div>`;
    $('#retryPlayer').onclick = ()=>renderPlayer(params);
    $('#backFromPlayer').onclick = ()=>router.back();
  }
}

/* =========================================================
   ROUTER
========================================================= */
const router = {
  stack:[],current:null,
  async navigate(page,params={},options={}){
    const push = options.push!==false;
    if(push&&this.current) this.stack.push(this.current);
    await this.render(page,params);
    window.scrollTo({top:0,behavior:'smooth'});
  },
  async back(){
    const previous = this.stack.pop();
    if(previous) await this.render(previous.page,previous.params);
    else await this.render('home');
    window.scrollTo({top:0,behavior:'smooth'});
  },
  async render(page,params={}){
    this.current = {page,params};
    renderNavigation();
    switch(page){
      case 'home':await renderHome();break;
      case 'search':renderSearch();break;
      case 'explore':await renderExplore();break;
      case 'catalog':await renderCatalog(params);break;
      case 'genre':await renderGenre(params);break;
      case 'detail':await renderDetail(params);break;
      case 'player':await renderPlayer(params);break;
      case 'fav':renderFavorites();break;
      case 'history':renderHistory();break;
      default:await renderHome();
    }
    renderNavigation();
  }
};

/* =========================================================
   GLOBAL EVENTS
========================================================= */
$('#backButton').onclick = ()=>router.back();
$('#searchTop').onclick = ()=>router.navigate('search');

/* =========================================================
   START
========================================================= */
router.render('home');
</script>
