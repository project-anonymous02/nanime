<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<meta name="color-scheme" content="dark">
<title>Nanime — Premium Anime Streaming</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/sora/index.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#05060A;--bg2:#08090B;--panel:#0D0F12;--panel2:#111318;--panel3:#151922;
--txt:#EDF1F8;--mut:#98A2B3;--dim:#6C7686;
--acc:#3E7BFA;--acc2:#7DB4FF;--acc-soft:rgba(62,123,250,.14);
--love:#FF4D6D;--ok:#31D0AA;--warn:#F5A524;--err:#FF5F6D;
--grad:linear-gradient(104deg,#FFFFFF 0%,#D8E7FF 38%,#4C8DFF 78%,#2E6BE6 100%);
--grad2:linear-gradient(135deg,#4C8DFF,#8AB6FF);
--line:rgba(255,255,255,.072);--line2:rgba(255,255,255,.13);
--glass:linear-gradient(168deg,rgba(255,255,255,.062),rgba(255,255,255,.018));
--r1:10px;--r2:13px;--r3:17px;--r4:22px;--r5:28px;--r6:34px;
--sh1:0 2px 10px rgba(0,0,0,.4);--sh2:0 20px 48px -20px rgba(0,0,0,.9);--sh3:0 34px 80px -28px rgba(0,0,0,.95);
--ease:cubic-bezier(.22,.61,.36,1);--spring:cubic-bezier(.34,1.42,.5,1);
--nav-h:66px;--side-w:250px;--top-h:60px;--maxw:1440px;
}
html{scroll-behavior:smooth;background:var(--bg)}
body{min-height:100dvh;overflow-x:hidden;color:var(--txt);background:var(--bg);font-family:'Inter Variable',Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:15px;line-height:1.55;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:'Sora Variable',Sora,'Inter Variable',sans-serif;letter-spacing:-.028em;margin:0}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18);background-clip:content-box}
:focus-visible{outline:2px solid var(--acc2);outline-offset:3px;border-radius:8px}

#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(120% 80% at 12% -10%,rgba(46,107,230,.16),transparent 58%),radial-gradient(90% 70% at 92% 4%,rgba(120,90,255,.10),transparent 60%),radial-gradient(120% 90% at 50% 110%,rgba(20,60,140,.12),transparent 62%),linear-gradient(180deg,#05060A,#07080C 45%,#05060A)}
#bg .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.42}
#bg .orb.a{width:480px;height:480px;left:-150px;top:-110px;background:radial-gradient(circle,rgba(62,123,250,.26),transparent 70%)}
#bg .orb.b{width:420px;height:420px;right:-130px;top:18%;background:radial-gradient(circle,rgba(140,90,255,.15),transparent 70%)}

.topgrad{height:3px;position:fixed;left:0;top:0;z-index:400;width:0;background:var(--grad2);box-shadow:0 0 14px rgba(76,141,255,.9);transition:width .3s var(--ease),opacity .3s;opacity:0}
.topgrad.on{opacity:1}

#app{position:relative;z-index:1;min-height:100dvh}
.shell{max-width:var(--maxw);margin:0 auto;padding:0 18px}

#topbar{position:sticky;top:0;z-index:60;height:var(--top-h);display:none;align-items:center;gap:12px;padding:0 14px;background:rgba(8,9,12,.8);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border-bottom:1px solid var(--line)}
.tb-logo{display:flex;align-items:center;gap:9px;font-family:'Sora Variable',sans-serif;font-weight:700;letter-spacing:-.03em}
.tb-logo img{width:28px;height:28px;border-radius:8px;object-fit:cover;border:1px solid var(--line2)}
.tb-logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.spacer{flex:1}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--mut);transition:.24s var(--ease)}
.ibtn:hover{color:#fff;background:rgba(255,255,255,.06)}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:19px;height:19px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px rgba(49,208,170,.7)}
.dot.off{background:var(--err)}
.dot.idle{background:var(--warn)}

#sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--side-w);z-index:70;display:none;flex-direction:column;padding:22px 16px 16px;background:linear-gradient(180deg,rgba(13,15,18,.86),rgba(8,9,12,.9));backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-right:1px solid var(--line)}
.sb-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px}
.sb-brand .lbox{width:44px;height:44px;border-radius:13px;overflow:hidden;flex:none;border:1px solid var(--line2);box-shadow:var(--sh1),inset 0 1px 0 rgba(255,255,255,.14);transition:.4s var(--spring)}
.sb-brand .lbox img{width:100%;height:100%;object-fit:cover}
.sb-brand:hover .lbox{transform:scale(1.06) rotate(-2deg)}
.sb-brand .wm{display:block;font-family:'Sora Variable',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.05em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sb-brand .sub{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.16em;text-transform:uppercase;margin-top:-2px}
.sb-nav{display:flex;flex-direction:column;gap:5px}
.sb-link{position:relative;display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:14px;color:var(--mut);font-weight:550;font-size:14.5px;transition:.28s var(--ease);overflow:hidden}
.sb-link svg{width:20px;height:20px;flex:none;transition:.28s var(--spring)}
.sb-link:hover{color:#fff}
.sb-link.active{color:#fff}
.sb-link.active::before{content:"";position:absolute;inset:0;border-radius:14px;background:linear-gradient(100deg,rgba(62,123,250,.22),rgba(62,123,250,.05));box-shadow:inset 0 0 0 1px rgba(125,180,255,.22)}
.sb-link.active svg{color:var(--acc2)}
.sb-link .pill{position:absolute;right:11px;top:50%;transform:translateY(-50%);min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--love);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 4px 14px -4px rgba(255,77,109,.7)}
.sb-foot{margin-top:auto}
.sb-status{padding:12px 13px;border-radius:15px;background:var(--glass);border:1px solid var(--line);font-size:12px;margin-bottom:10px}
.sb-status .row{display:flex;align-items:center;gap:8px;color:var(--mut)}
.sb-status b{color:var(--txt);font-weight:600}

#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:80;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:stretch;background:rgba(8,9,12,.8);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-top:1px solid var(--line)}
#tabbar::before{content:"";position:absolute;top:-24px;left:0;right:0;height:24px;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(5,6,10,.55))}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);transition:color .3s var(--ease)}
.tab svg{width:22px;height:22px;transition:.42s var(--spring)}
.tab span{font-size:10.5px;font-weight:600;letter-spacing:.01em}
.tab .ind{position:absolute;top:6px;width:34px;height:34px;border-radius:12px;background:var(--acc-soft);opacity:0;transform:scale(.5);transition:.42s var(--spring);z-index:-1}
.tab.active{color:#fff}
.tab.active .ind{opacity:1;transform:scale(1)}
.tab.active svg{color:var(--acc2);transform:translateY(-1px) scale(1.06)}
.tab:active svg{transform:scale(.86)}
.tab .badge{position:absolute;top:5px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--love);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 3px 10px -3px rgba(255,77,109,.8)}

#view{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 26px);min-height:60dvh}
main.anim-in{animation:viewIn .32s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.rv{opacity:0;transition:opacity .45s var(--ease);transition-delay:var(--d,0ms)}
.rv.in{opacity:1}
.rv-s{opacity:0;transition:opacity .4s var(--ease);transition-delay:var(--d,0ms)}
.rv-s.in{opacity:1}

.hero{position:relative;margin:18px 0 8px;border-radius:var(--r5);overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));border:1px solid var(--line);box-shadow:var(--sh3);padding:22px 18px 20px;animation:heroIn .5s var(--ease) both}
@keyframes heroIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 100% at 50% -20%,rgba(76,141,255,.16),transparent 62%);pointer-events:none}
.hero-in{position:relative;display:flex;flex-direction:column;align-items:stretch}
.hero-row{display:flex;align-items:center;gap:14px}
.logo-wrap{position:relative;width:62px;height:62px;border-radius:18px;padding:3px;flex:none;background:linear-gradient(150deg,rgba(255,255,255,.22),rgba(255,255,255,.05) 40%,rgba(125,180,255,.16));box-shadow:0 14px 34px -16px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.22);transition:.4s var(--spring)}
.logo-wrap::after{content:"";position:absolute;inset:-10px;border-radius:26px;z-index:-1;background:radial-gradient(circle,rgba(62,123,250,.30),transparent 68%);filter:blur(12px);opacity:.7}
.logo-inner{width:100%;height:100%;border-radius:15px;overflow:hidden;background:#0A0C11;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.logo-inner img{width:100%;height:100%;object-fit:cover;transition:.6s var(--spring)}
.logo-wrap:hover{transform:translateY(-2px) scale(1.03)}
.logo-wrap:hover .logo-inner img{transform:scale(1.06)}
.hero-tx{min-width:0}
.hero-title{font-family:'Sora Variable',sans-serif;font-weight:800;line-height:1;font-size:clamp(26px,6.6vw,40px);letter-spacing:-.05em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-tag{margin:5px 0 0;color:var(--mut);font-size:12.6px;line-height:1.45}
.hero-tag b{color:#cfe0ff;font-weight:600}
.hero-search{display:flex;align-items:center;gap:11px;height:50px;margin-top:16px;padding:0 8px 0 16px;border-radius:99px;background:rgba(255,255,255,.045);border:1px solid var(--line2);color:var(--dim);transition:.3s var(--ease)}
.hero-search:hover{background:rgba(255,255,255,.075);border-color:rgba(125,180,255,.4);transform:translateY(-1px);color:var(--mut)}
.hero-search:active{transform:scale(.99)}
.hero-search .sic{display:grid;place-items:center;flex:none}
.hero-search .sic svg{width:18px;height:18px}
.hero-search .ph{flex:1;min-width:0;font-size:14px;font-weight:500;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-search .go{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc2);flex:none}
.hero-search .go svg{width:15px;height:15px}
.hero-cta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.dash{position:relative;width:100%;max-width:980px;margin:18px auto 0;aspect-ratio:16/9;border-radius:var(--r4);overflow:hidden;background:#07080C;border:1px solid rgba(255,255,255,.11);box-shadow:0 30px 80px -30px rgba(0,0,0,.95),0 0 0 1px rgba(76,141,255,.10);animation:dashIn .6s var(--ease) .1s both}
@keyframes dashIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.dash::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -60px 90px -60px rgba(0,0,0,.85)}
.dash video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none;-webkit-user-select:none}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:14px;font-size:13.5px;font-weight:620;letter-spacing:-.01em;border:1px solid var(--line2);color:var(--txt);background:var(--glass);overflow:hidden;transition:.3s var(--ease);white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.24);box-shadow:var(--sh2)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,#4C8DFF,#2E6BE6);border-color:transparent;color:#fff;box-shadow:0 12px 30px -12px rgba(62,123,250,.75),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.primary:hover{box-shadow:0 18px 42px -14px rgba(62,123,250,.9),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.ghost{background:rgba(255,255,255,.03)}
.btn.sm{height:34px;padding:0 13px;border-radius:11px;font-size:12.5px}
.btn.danger{border-color:rgba(255,95,109,.35);color:#ffb4ba;background:rgba(255,95,109,.10)}
.btn[disabled]{opacity:.45;pointer-events:none}

.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:99px;font-size:12.8px;font-weight:560;color:var(--mut);background:rgba(255,255,255,.035);border:1px solid var(--line);transition:.28s var(--ease);white-space:nowrap}
.chip:hover{color:#fff;border-color:var(--line2);background:rgba(255,255,255,.075);transform:translateY(-1px)}
.chip:active{transform:scale(.94)}
.chip.on{color:#fff;background:linear-gradient(120deg,rgba(76,141,255,.30),rgba(76,141,255,.12));border-color:rgba(125,180,255,.42);box-shadow:0 6px 22px -10px rgba(62,123,250,.9)}

.sec{margin:34px 0 0}
.sec-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:15px}
.sec-head .t{flex:1;min-width:0}
.sec-head h2{font-size:clamp(17px,2.5vw,21px);font-weight:700;display:flex;align-items:center;gap:9px}
.sec-head h2 .bar{width:3px;height:17px;border-radius:2px;background:var(--grad2);box-shadow:0 0 12px rgba(76,141,255,.8)}
.sec-head p{margin:3px 0 0;font-size:12.4px;color:var(--dim)}
.arw{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--mut);background:rgba(255,255,255,.04);border:1px solid var(--line);transition:.26s var(--ease)}
.arw:hover{color:#fff;background:rgba(255,255,255,.09);transform:translateY(-1px)}
.arw:active{transform:scale(.9)}
.arw svg{width:16px;height:16px}
.link-more{font-size:12.5px;color:var(--acc2);font-weight:600;display:inline-flex;align-items:center;gap:4px;transition:.24s}
.link-more:hover{gap:8px;color:#fff}
.link-more svg{width:14px;height:14px}

.rail{position:relative;margin:0 -18px;padding:4px 18px 8px}
.rail-track{display:flex;gap:13px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:6px 2px 12px;cursor:grab}
.rail-track::-webkit-scrollbar{display:none}
.rail-track.drag{cursor:grabbing;scroll-snap-type:none}
.rail-track>*{scroll-snap-align:start;flex:none}
.rail::before,.rail::after{content:"";position:absolute;top:0;bottom:8px;width:26px;z-index:3;pointer-events:none;transition:.3s}
.rail::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.rail::after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
.rail.s-start::before,.rail.e-end::after{opacity:0}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}

.card{position:relative;display:block;width:148px;border-radius:var(--r3);overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:.42s var(--ease);will-change:transform}
.card.g{width:100%}
.card:hover{transform:translateY(-6px) scale(1.018);border-color:var(--line2);box-shadow:var(--sh3),0 0 0 1px rgba(125,180,255,.16)}
.card:active{transform:translateY(-2px) scale(.99)}
.card .poster{position:relative;aspect-ratio:2/3;overflow:hidden;background:linear-gradient(150deg,#141922,#0A0C11)}
.card .poster img{width:100%;height:100%;object-fit:cover;transition:.7s var(--ease);opacity:0;transform:scale(1.06)}
.card .poster img.ld{opacity:1;transform:scale(1)}
.card:hover .poster img{transform:scale(1.06)}
.card .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,10,.02) 40%,rgba(5,6,10,.55) 72%,rgba(5,6,10,.88));opacity:.9;transition:.4s var(--ease)}
.card:hover .veil{opacity:1}
.card .body{position:absolute;left:0;right:0;bottom:0;padding:10px 11px 11px}
.card .nm{font-size:12.8px;font-weight:640;line-height:1.32;letter-spacing:-.012em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.card .meta{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:10.4px;color:#a7b3c6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:30px}
.card .meta:empty{display:none}
.card .meta i{width:3px;height:3px;border-radius:50%;background:#5d6a7d;font-style:normal}
.badge{position:absolute;left:8px;top:8px;z-index:2;padding:4px 7px;border-radius:7px;font-size:9.5px;font-weight:700;letter-spacing:.03em;background:rgba(8,10,16,.68);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);color:#e6edf9}
.badge.score{left:auto;right:8px;color:#ffe9a8;border-color:rgba(245,165,36,.36);background:rgba(40,28,6,.65)}
.badge.score svg{width:10px;height:10px;color:#FFD479;vertical-align:-1.5px;flex:none}
.badge.live{color:#b9ffe9;border-color:rgba(49,208,170,.4);background:rgba(6,32,26,.62)}
.badge.live::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ok);margin-right:5px;box-shadow:0 0 8px var(--ok);animation:pulse 1.6s infinite;vertical-align:1px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.play-ov{position:absolute;inset:0;z-index:2;display:grid;place-items:center;opacity:0;transition:.36s var(--ease)}
.card:hover .play-ov{opacity:1}
.play-ov .cir{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(62,123,250,.86);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.3);box-shadow:0 12px 34px -10px rgba(62,123,250,.9);transform:scale(.72);transition:.42s var(--spring)}
.card:hover .play-ov .cir{transform:scale(1)}
.play-ov svg{width:18px;height:18px;margin-left:2px}
.fav-btn{position:absolute;right:8px;bottom:8px;z-index:4;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(8,10,16,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);color:#c3ccd9;opacity:1;transform:none;transition:.34s var(--spring)}
.card:hover .fav-btn{color:#fff;border-color:rgba(255,255,255,.3)}
.fav-btn svg{width:15px;height:15px;transition:.3s var(--spring)}
.fav-btn:hover{color:#fff;border-color:rgba(255,77,109,.5);background:rgba(255,77,109,.2)}
.fav-btn.on{color:var(--love);opacity:1;transform:none;border-color:rgba(255,77,109,.4);background:rgba(255,77,109,.14)}
.fav-btn.on svg{fill:var(--love)}
.fav-btn.beat svg{animation:beat .55s var(--spring)}
@keyframes beat{0%{transform:scale(1)}35%{transform:scale(1.42)}60%{transform:scale(.88)}100%{transform:scale(1)}}

.searchbar{position:relative;display:flex;align-items:center;gap:11px;height:54px;padding:0 15px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--line);transition:.36s var(--ease)}
.searchbar::before{content:"";position:absolute;inset:-1px;border-radius:19px;padding:1px;opacity:0;transition:.4s var(--ease);background:linear-gradient(120deg,rgba(125,180,255,.7),rgba(125,180,255,.06) 40%,rgba(140,90,255,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.searchbar:focus-within{background:rgba(255,255,255,.062);border-color:transparent;box-shadow:0 14px 44px -18px rgba(62,123,250,.6);transform:translateY(-1px)}
.searchbar:focus-within::before{opacity:1}
.searchbar .sic{color:var(--dim);display:grid;place-items:center;transition:.4s var(--spring)}
.searchbar .sic svg{width:19px;height:19px}
.searchbar:focus-within .sic{color:var(--acc2);transform:scale(1.1) rotate(-8deg)}
.searchbar input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:15px;font-weight:500;letter-spacing:-.01em}
.searchbar input::placeholder{color:var(--dim)}
.searchbar .clr{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--dim);opacity:0;transform:scale(.7);transition:.3s var(--spring);pointer-events:none}
.searchbar .clr svg{width:15px;height:15px}
.searchbar.has .clr{opacity:1;transform:none;pointer-events:auto}
.searchbar .clr:hover{background:rgba(255,255,255,.08);color:#fff}
.searchbar .prov-ind{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600;color:var(--acc2);background:var(--acc-soft);border:1px solid rgba(62,123,250,.22);flex:none}

.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}

.detail-hero{position:relative;margin:0 -18px;padding:0 18px;overflow:hidden}
.detail-hero .bd{position:absolute;inset:-20px -18px auto;height:420px;background-size:cover;background-position:center 22%;filter:blur(2px) saturate(125%);transform:scale(1.08);opacity:.42;animation:bdIn 1.1s var(--ease) both}
@keyframes bdIn{from{opacity:0;transform:scale(1.2)}to{opacity:.42;transform:scale(1.08)}}
.detail-hero .bd::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,10,.55),rgba(5,6,10,.86) 58%,var(--bg))}
.detail-in{position:relative;z-index:2;padding:26px 0 8px;display:grid;grid-template-columns:1fr;gap:20px;justify-items:center;text-align:center}
.cover-box{position:relative;width:min(230px,54vw);aspect-ratio:2/3;border-radius:var(--r4);overflow:hidden;padding:5px;background:linear-gradient(155deg,rgba(255,255,255,.26),rgba(255,255,255,.04) 45%,rgba(125,180,255,.2));box-shadow:var(--sh3),0 0 70px -30px rgba(62,123,250,.55);animation:coverIn .95s var(--spring) both}
@keyframes coverIn{from{opacity:0;transform:translateY(26px) scale(.9) rotateX(9deg)}to{opacity:1;transform:none}}
.cover-box .in{width:100%;height:100%;border-radius:calc(var(--r4) - 5px);overflow:hidden;background:#0B0D12;position:relative}
.cover-box img{width:100%;height:100%;object-fit:cover;transition:.7s var(--ease)}
.cover-box:hover img{transform:scale(1.05)}
.detail-meta{max-width:760px}
.detail-meta h1{font-size:clamp(24px,5.4vw,40px);font-weight:760;line-height:1.1}
.detail-meta .alt{margin-top:7px;font-size:12.8px;color:var(--dim);line-height:1.5}
.detail-meta .stats{justify-content:center;margin-top:16px}
.detail-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.panel{border-radius:var(--r4);background:var(--glass);border:1px solid var(--line);padding:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.panel h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.syn{font-size:13.6px;color:#b9c3d2;line-height:1.72;white-space:pre-line}
.syn.clip{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;position:relative}
.syn.clip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52px;background:linear-gradient(180deg,transparent,var(--panel))}
.readmore{margin-top:9px;font-size:12.6px;font-weight:640;color:var(--acc2);display:inline-flex;align-items:center;gap:5px;transition:.26s}
.readmore:hover{gap:9px;color:#fff}
.readmore svg{width:14px;height:14px;transition:.3s var(--ease)}
.readmore.open svg{transform:rotate(180deg)}

.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:11px;font-size:12.2px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--mut)}
.stat b{color:var(--txt);font-weight:650}
.stat svg{width:14px;height:14px;color:var(--acc2)}

.ep-grid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.ep{position:relative;display:flex;gap:11px;align-items:center;padding:9px;border-radius:14px;text-align:left;background:rgba(255,255,255,.028);border:1px solid var(--line);transition:.3s var(--ease);overflow:hidden}
.ep:hover{background:rgba(255,255,255,.062);border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--sh2)}
.ep:active{transform:scale(.98)}
.ep .no{width:44px;height:44px;flex:none;border-radius:11px;display:grid;place-items:center;font-family:'Sora Variable',sans-serif;font-size:14px;font-weight:750;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#cdd8e8;transition:.3s var(--ease)}
.ep:hover .no{background:linear-gradient(135deg,rgba(76,141,255,.28),rgba(76,141,255,.1));border-color:rgba(125,180,255,.4);color:#fff}
.ep .tx{min-width:0;flex:1}
.ep .tx b{display:block;font-size:12.8px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .tx span{font-size:11px;color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .go{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;color:var(--dim);transition:.3s var(--spring)}
.ep:hover .go{color:var(--acc2);transform:translateX(3px)}
.ep .go svg{width:14px;height:14px}

.pw{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r4);overflow:hidden;background:#000;border:1px solid var(--line2);box-shadow:var(--sh3),0 0 90px -40px rgba(62,123,250,.7);animation:coverIn .8s var(--ease) both;user-select:none}
.pw iframe{width:100%;height:100%;display:block;background:#000;border:0}
.pw .empty{width:100%;height:100%;display:grid;place-items:center;padding:30px;text-align:center;color:var(--mut);background:#000}
.pw .empty strong{color:var(--txt);display:block;margin-bottom:8px;font-size:16px}

.srv{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;flex-wrap:wrap}
.srv::-webkit-scrollbar{display:none}
.srv button{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:12px;font-size:12.4px;font-weight:600;color:var(--mut);background:rgba(255,255,255,.035);border:1px solid var(--line);white-space:nowrap;transition:.28s var(--ease)}
.srv button:hover{color:#fff;background:rgba(255,255,255,.08);transform:translateY(-1px)}
.srv button.on{color:#fff;background:linear-gradient(135deg,rgba(76,141,255,.32),rgba(76,141,255,.12));border-color:rgba(125,180,255,.45);box-shadow:0 8px 24px -12px rgba(62,123,250,.9)}

.sk{position:relative;overflow:hidden;background:rgba(255,255,255,.045);border-radius:var(--r3)}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.075),transparent);animation:shim 1.5s infinite}
@keyframes shim{100%{transform:translateX(100%)}}
.sk-card{width:148px;aspect-ratio:2/3;border-radius:var(--r3)}
.sk-card.g{width:100%}

.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:52px 22px;border-radius:var(--r5);background:var(--glass);border:1px solid var(--line)}
.state .ic{width:66px;height:66px;border-radius:22px;display:grid;place-items:center;color:var(--acc2);background:linear-gradient(150deg,rgba(76,141,255,.18),rgba(76,141,255,.04));border:1px solid rgba(125,180,255,.22);box-shadow:0 18px 44px -20px rgba(62,123,250,.7)}
.state .ic svg{width:28px;height:28px}
.state h3{font-size:17px;font-weight:700}
.state p{margin:0;color:var(--mut);font-size:13.2px;max-width:44ch;line-height:1.65}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 22px);z-index:200;display:flex;flex-direction:column-reverse;gap:9px;pointer-events:none;width:min(420px,calc(100vw - 28px))}
.toast{display:flex;align-items:center;gap:11px;padding:12px 15px;border-radius:15px;pointer-events:auto;background:rgba(16,19,25,.92);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:1px solid var(--line2);box-shadow:var(--sh3);animation:tIn .46s var(--spring);font-size:13.2px;font-weight:540}
.toast.out{animation:tOut .34s var(--ease) forwards}
@keyframes tIn{from{opacity:0;transform:translateY(22px) scale(.92);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes tOut{to{opacity:0;transform:translateY(14px) scale(.95);filter:blur(4px)}}
.toast .ti{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.toast .ti svg{width:15px;height:15px}
.toast.ok .ti{background:rgba(49,208,170,.15);color:var(--ok)}
.toast.err .ti{background:rgba(255,95,109,.15);color:var(--err)}
.toast.info .ti{background:rgba(76,141,255,.15);color:var(--acc2)}

#sheet-root{position:fixed;inset:0;z-index:300;display:none}
#sheet-root.open{display:block}
.sheet-bd{position:absolute;inset:0;background:rgba(3,4,7,.66);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#12151B,#0A0C11);border-top:1px solid var(--line2);border-radius:var(--r5) var(--r5) 0 0;box-shadow:0 -30px 80px -20px rgba(0,0,0,.95);animation:sheetIn .44s var(--spring);overflow:hidden}
@keyframes sheetIn{from{transform:translateY(102%);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:9px auto 0;flex:none}
.sheet-hd{display:flex;align-items:center;gap:12px;padding:14px 18px 12px;flex:none;border-bottom:1px solid var(--line)}
.sheet-hd h3{font-size:16px;font-weight:700;flex:1}
.sheet-bd2{padding:16px 18px calc(22px + env(safe-area-inset-bottom));overflow-y:auto;flex:1}

.set-grp{margin-bottom:20px}
.set-grp>h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:0 0 10px}
.adp{border-radius:var(--r3);border:1px solid var(--line);background:rgba(255,255,255,.028);padding:13px;margin-bottom:10px;transition:.3s var(--ease)}
.adp.live{border-color:rgba(49,208,170,.3);background:rgba(49,208,170,.05)}
.adp.dead{border-color:rgba(255,95,109,.2);opacity:.6}
.adp .top{display:flex;align-items:center;gap:10px}
.adp .top b{font-size:13.4px;font-weight:650;flex:1;min-width:0}
.adp .desc{margin:7px 0 0;font-size:11.8px;color:var(--dim);line-height:1.58}
.sw{width:44px;height:26px;border-radius:99px;background:rgba(255,255,255,.13);position:relative;flex:none;transition:.32s var(--ease);border:1px solid var(--line)}
.sw i{position:absolute;left:3px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:#8d97a8;transition:.34s var(--spring)}
.sw.on{background:linear-gradient(135deg,#4C8DFF,#2E6BE6);border-color:transparent}
.sw.on i{left:21px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12.4px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.kv:last-child{border:0}
.kv span{color:var(--dim)}
.note{padding:12px 13px;border-radius:var(--r2);font-size:11.9px;line-height:1.66;color:var(--mut);background:rgba(245,165,36,.06);border:1px solid rgba(245,165,36,.18)}
.note b{color:#e8eefb}

footer.ft{margin:46px 0 8px;padding:22px 0 8px;border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:11.8px;color:var(--dim)}
footer.ft .lg{display:flex;align-items:center;gap:9px;color:var(--mut)}
footer.ft img{width:22px;height:22px;border-radius:7px}

@media(max-width:899px){
#topbar{display:flex}
.shell{padding:0 14px}
.rail{margin:0 -14px;padding:4px 14px 8px}
.detail-hero{margin:0 -14px;padding:0 14px}
}

#tabbar{display:none}

#view{padding-bottom:40px}
#toasts{bottom:26px;left:auto;right:26px;transform:none}
.shell{padding:0 26px}
.rail{margin:0 -26px;padding:4px 26px 8px}
.detail-hero{margin:0 -26px;padding:0 26px}
.detail-in{grid-template-columns:auto 1fr;justify-items:start;text-align:left;gap:34px;padding:44px 0 12px}
.detail-meta .stats{justify-content:flex-start}
.detail-actions{justify-content:flex-start}
.card{width:166px}
.sk-card{width:166px}
.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 48px));max-height:84dvh;border-radius:var(--r5);border:1px solid var(--line2);animation:modalIn .4s var(--spring)}
@keyframes modalIn{from{opacity:0;transform:translate(-50%,-46%) scale(.94);filter:blur(8px)}to{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0)}}
.sheet .grab{display:none}
}
@media(min-width:1200px){.card{width:178px}.sk-card{width:178px}}
@media(max-width:400px){.card{width:132px}.sk-card{width:132px}.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ── utilities & komponen baru ── */
.chip svg{width:14px;height:14px;flex:none}
.srv button svg{width:14px;height:14px;flex:none}
.pw .empty svg{width:34px;height:34px;display:block;margin:0 auto 10px;color:var(--dim)}
.card .poster .perr{position:absolute;inset:0;display:grid;place-items:center;color:#3a4350;pointer-events:none}
.card .poster .perr svg{width:30px;height:30px}
.sbar-wrap{position:sticky;top:0;z-index:45;padding:10px 0 4px;box-shadow:0 0 0 100vmax rgba(5,6,10,.9);clip-path:inset(0 -100vmax);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.filters.sfil{flex-wrap:wrap;padding:12px 2px 2px;overflow:visible}
.qhist{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:4px 2px 0}
.qhist .lb{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-right:2px}
.qhist .chip{height:30px;font-size:12.2px;padding:0 12px}
#resInfo .src{color:var(--dim);font-size:11.6px}
#resInfo .src .bad{color:var(--err);font-weight:600}
.ep-empty{font-size:13px;color:var(--dim);padding:14px 4px}
.panel h3 svg{width:17px;height:17px;flex:none;color:var(--acc2)}
@media(max-width:400px){.grid.wide{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}}
@media(max-width:899px){.sbar-wrap{top:var(--top-h)}}
</style>
</head>

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const debounce = (fn,ms) => {let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),ms)}};
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const cleanVal = v => {
  const s = String(v == null ? '' : v).trim();
  if (!s || s === '-' || s === '?' || s === 'null' || s === 'undefined' || /^unknown$/i.test(s)) return '';
  return s.replace(/^\s*(Rating|Status|Score)\s*:\s*/i, '').replace(/,+$/, '').trim();
};
const epsNum = v => { const m = String(v == null ? '' : v).match(/\d+/); return m ? m[0] : ''; };
const seriesSlug = v => String(v == null ? '' : v).split('\t')[0].replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').toLowerCase();

/* ═══════ SEARCH NORMALIZATION ═══════ */
function normalizeSearchText(s) {
  if (!s) return '';
  return String(s)
    .normalize('NFKD')
    .toLowerCase()
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\w\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function buildSearchFields(anime) {
  const fields = [];
  if (anime.title) fields.push(normalizeSearchText(anime.title));
  if (anime.englishTitle) fields.push(normalizeSearchText(anime.englishTitle));
  if (anime.japaneseTitle) fields.push(normalizeSearchText(anime.japaneseTitle));
  if (anime.romajiTitle) fields.push(normalizeSearchText(anime.romajiTitle));
  if (anime.altTitles) anime.altTitles.forEach(t => fields.push(normalizeSearchText(t)));
  return [...new Set(fields.filter(Boolean))];
}

function scoreSearchMatch(anime, query) {
  const q = normalizeSearchText(query);
  if (!q) return 0;
  const fields = buildSearchFields(anime);
  let best = 0;
  for (const f of fields) {
    if (f === q) { best = Math.max(best, 100); break; }
    if (f.startsWith(q)) best = Math.max(best, 80);
    else if (f.includes(q)) best = Math.max(best, 60);
    else {
      const tokens = q.split(' ').filter(Boolean);
      const matched = tokens.filter(t => f.includes(t)).length;
      if (matched > 0) best = Math.max(best, 30 + (matched / tokens.length) * 20);
    }
  }
  return best;
}

    if(this.hist.length>24)this.hist.length=24;
    LS.set('hist',this.hist);
  },
  addQ(q){
    q = String(q || '').trim();
    if (q.length < 2) return;
    this.shist = this.shist.filter(x => String(x).toLowerCase() !== q.toLowerCase());
    this.shist.unshift(q);
    if (this.shist.length > 10) this.shist.length = 10;

/* ═══════ API CLIENT ═══════ */
const CACHE = new Map();
const INFLIGHT = new Map();
const TTL = { home:600000, search:300000, detail:1800000, episode:360000, genre:3600000 };

async function apiGet(endpoint, timeout=20000, cacheKey=null, ttl=0) {
  if (cacheKey && CACHE.has(cacheKey)) {
    const c = CACHE.get(cacheKey);
    if (Date.now() - c.ts < ttl) return c.data;
  }
  if (cacheKey && INFLIGHT.has(cacheKey)) return INFLIGHT.get(cacheKey);
  
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  
  const promise = (async () => {
    try {
      const response = await fetch(`${API_BASE}${endpoint}`, {
        method:'GET', headers:{Accept:'application/json'}, signal:controller.signal
      });
      const raw = await response.text();
      clearTimeout(timer);
      if (!response.ok) { const err = new Error(`HTTP ${response.status}`); err.status = response.status; throw err; }
      const data = JSON.parse(raw);
      if (cacheKey) CACHE.set(cacheKey, {data, ts:Date.now()});
      return data;
    } catch (error) {
      clearTimeout(timer);
      if (error.name === 'AbortError') throw new Error('Request timeout.');
      throw error;
    }
  })();
  
  if (cacheKey) {
    INFLIGHT.set(cacheKey, promise);
    promise.then(() => INFLIGHT.delete(cacheKey), () => INFLIGHT.delete(cacheKey));
  }
  return promise;
}

/* ═══════ PROVIDER ADAPTERS ═══════ */
function getPoster(item) {
  if (!item) return '';
  return item.poster || item.image || item.cover || item.thumbnail || '';
}

function normalizeOtakudesuCard(item) {
  if (!item) return null;
  const eps = cleanVal(item.episodes);
  const isOngoing = !!(item.latestReleaseDate || item.releaseDay);
  const date = cleanVal(item.latestReleaseDate || item.lastReleaseDate);
  return {
    id: String(item.animeId || ''),
    provider: 'otakudesu',
    title: cleanVal(item.title) || 'Unknown',
    poster: String(getPoster(item)),
    score: cleanVal(item.score),
    type: cleanVal(item.type),
    status: cleanVal(item.status),
    epLabel: eps ? (isOngoing ? 'Ep ' + eps : eps + ' Eps') : '',
    sub: date || cleanVal(item.releaseDay),
    sourceUrl: item.otakudesuUrl || ''
  };
}

function normalizeOploverzCard(item) {
  if (!item) return null;
  const href = item.href || '';
  let slug = cleanVal(item.slug);
  if (!slug && href.indexOf('/anime/') > -1) slug = href.split('/anime/').pop().split(/[?#/]/).filter(Boolean)[0] || '';
  if (!slug) slug = seriesSlug(item.seriesName || item.title || '');
  const series = item.seriesName ? String(item.seriesName).split('\t')[0].replace(/\s+/g, ' ').trim() : '';
  return {
    id: slug || cleanVal(item.title) || 'Unknown',
    provider: 'oploverz',
    title: series || cleanVal(item.title) || 'Unknown',
    poster: String(getPoster(item)),
    score: cleanVal(item.score),
    type: cleanVal(item.type),
    status: cleanVal(item.status),
    epLabel: cleanVal(item.episode),
    sub: cleanVal(item.releaseTime) || cleanVal(item.status),
    sourceUrl: href
  };
}

function normalizeKuramanimeCard(item) {
  if (!item) return null;
  const eps = cleanVal(item.episodes);
  const total = cleanVal(item.totalEpisodes);
  return {
    id: String(item.animeId || ''),
    provider: 'kuramanime',
    title: cleanVal(item.title) || 'Unknown',
    poster: String(getPoster(item)),
    score: cleanVal(item.highlight),
    type: cleanVal(item.type),
    status: '',
    epLabel: eps ? (total ? eps + '/' + total : 'Ep ' + eps) : '',
    sub: cleanVal(item.quality),
    sourceUrl: item.kuramanimeUrl || '',
    slug: item.animeSlug || ''
  };
}

function normalizeCard(item, provider) {
  switch (provider) {
    case 'otakudesu': return normalizeOtakudesuCard(item);
    case 'oploverz': return normalizeOploverzCard(item);
    case 'kuramanime': return normalizeKuramanimeCard(item);
    default: return null;
  }
}

      } catch (e2) {

      }
    }
    
    return { ongoing, completed, movie };
  },
  
  async search(query) {
    if (!query || query.trim().length < 2) return { items: [], sources: [] };
    const preferred = Store.getProvider();
    const ids = Object.keys(PROVIDERS).filter(id => PROVIDERS[id].active && PROVIDERS[id].search);
    ids.sort((a, b) => (a === preferred ? -1 : b === preferred ? 1 : 0));
    
    const sources = await Promise.all(ids.map(async id => {
      try {
        const r = await apiGet(`/${id}/search?q=${encodeURIComponent(query)}`, 20000, `search:${id}:${query}`, TTL.search);
        const list = (r?.data?.animeList || []).map(i => normalizeCard(i, id)).filter(Boolean);
        return { id, ok: true, count: list.length, items: list };
      } catch (e) {
        if (e.status === 404) return { id, ok: true, count: 0, items: [] };
        console.warn('Search failed:', id, e);
        return { id, ok: false, count: 0, items: [], error: e.message || 'Gagal' };
      }
    }));
    
    if (sources.every(s => !s.ok)) {
      throw new Error(sources.map(s => s.error).filter(Boolean)[0] || 'Pencarian gagal.');
    }
    
    const items = [];
    const seen = new Set();
    sources.forEach(s => s.items.forEach(a => {
      const key = a.provider + ':' + a.id;
      if (seen.has(key)) return;
      seen.add(key);
      items.push(a);
    }));
    return { items, sources: sources.map(s => ({ id: s.id, ok: s.ok, count: s.count, error: s.error })) };
  },

/* ═══════ REVEAL + LAZY + RAILS ═══════ */
let IO = null;
function initReveal(root) {
  if (!IO) {
    IO = new IntersectionObserver(es => {
      es.forEach(e => { if(e.isIntersecting){e.target.classList.add('in');IO.unobserve(e.target)} });
    }, {rootMargin:'0px 0px -8% 0px', threshold:.05});
  }
  $$('.rv:not(.in),.rv-s:not(.in)', root||document).forEach(n => IO.observe(n));
}

let IMG_IO = null;
function initLazy(root) {
  if (!IMG_IO) {
    IMG_IO = new IntersectionObserver(es => {
      es.forEach(e => {
        if(e.isIntersecting){
          const im=e.target;
          if(im.dataset.src){im.src=im.dataset.src;delete im.dataset.src;}
          IMG_IO.unobserve(im);
        }
      });
    }, {rootMargin:'400px 0px'});
  }
  $$('img[data-src]', root||document).forEach(n => IMG_IO.observe(n));
}

function initRails(root) {
  $$('[data-railwrap]', root||document).forEach(w => {
    const tr = $('.rail-track', w); if(!tr || tr._ok) return; tr._ok=1;
    const upd = () => {
      w.classList.toggle('s-start', tr.scrollLeft<8);
      w.classList.toggle('e-end', tr.scrollLeft+tr.clientWidth >= tr.scrollWidth-8);
    };
    tr.addEventListener('scroll', ()=>{upd()}, {passive:true}); upd();
    let down=false, sx=0, sl=0, moved=0;
    tr.addEventListener('pointerdown', e => { if(e.target.closest('button'))return; down=true; moved=0; sx=e.clientX; sl=tr.scrollLeft; tr.classList.add('drag'); try{ tr.setPointerCapture(e.pointerId) }catch{} });
    tr.addEventListener('pointermove', e => { if(!down)return; const d=e.clientX-sx; moved=Math.abs(d); if(moved>6){tr.scrollLeft=sl-d;e.preventDefault()} });
    const release = () => { if(down){down=false;tr.classList.remove('drag')} };
    tr.addEventListener('pointerup', release);
    tr.addEventListener('pointercancel', release);
    tr.addEventListener('click', e => { if(moved>10){e.preventDefault();e.stopPropagation()} }, true);
  });
}

function railScroll(id, dir) { const tr=$('#'+id); if(!tr)return; tr.scrollBy({left:tr.clientWidth*.82*dir, behavior:'smooth'}) }

/* ═══════ ROUTER ═══════ */
const view = $('#view');
function parseHash() {
  let h = (location.hash||'#/home').replace(/^#/,'');
  let qs = '';
  const qi = h.indexOf('?'); if(qi>-1){qs=h.slice(qi+1);h=h.slice(0,qi)}
  const parts = h.split('/').filter(Boolean).map(decodeURIComponent);
  const query = {};
  qs.split('&').filter(Boolean).forEach(kv => { const i=kv.indexOf('='); query[decodeURIComponent(kv.slice(0,i))]=decodeURIComponent(kv.slice(i+1)||'') });
  return {parts, q:query, path:h||'/home'};
}
function go(path, replace) { const target='#'+path; if(location.hash===target){render();return} if(replace)location.replace(target); else location.hash=target }
function back() { if(history.length>1) history.back(); else go('/home') }

let curRoute = '';
async function render() {
  const r = parseHash();
  const route = r.parts[0] || 'home';
  view.classList.remove('anim-in'); void view.offsetWidth; view.classList.add('anim-in');
  const showBack = ['anime','watch','genre'].indexOf(route) > -1;
  $('#tbBack').style.display = showBack ? 'grid' : 'none';
  $('#tbBrand').style.display = showBack ? 'none' : 'flex';
  renderNav();
  window.scrollTo({top:0, behavior:'auto'});
  curRoute = route;
  try {
    if(route==='home') await ViewHome(r);
    else if(route==='search') await ViewSearch(r);
    else if(route==='explore') await ViewExplore(r);
    else if(route==='favorite') await ViewFavorite(r);
    else if(route==='history') await ViewHistory(r);
    else if(route==='anime') await ViewDetail(r);
    else if(route==='watch') await ViewWatch(r);
    else if(route==='genre') await ViewGenre(r);
    else await ViewHome(r);
  } catch(e) {
    console.error(e);
    view.innerHTML = '<div class="shell">'+stateHTML('err','Terjadi kesalahan',e.message||'Tidak dapat memuat halaman.','<button class="btn primary" data-act="reload">'+svg('refresh','',2.1)+' Muat ulang</button>')+'</div>';
  }
  initReveal(view); initLazy(view); initRails(view);
  document.title = 'Nanime' + (r.parts.length>1 ? ' · '+r.parts.map(decodeURIComponent).slice(-1)[0] : '');
}

let dashVid = null;
let dashBound = false;
function forceDash() {
  const v = dashVid;
  if (!v || !v.isConnected) { dashVid = null; return; }
  try {
    v.muted = true; v.loop = true; v.removeAttribute('controls');
    const p = v.play(); if (p && p.catch) p.catch(()=>{});
  } catch(e) {}
}

function initDashVideo() {
  const v = $('#dashVideo'); if(!v) return;
  dashVid = v;
  v.removeAttribute('controls');
  v.setAttribute('controlslist','nodownload noplaybackrate noremoteplayback');
  v.muted=true; v.defaultMuted=true; v.loop=true; v.playsInline=true; v.autoplay=true;
  v.setAttribute('tabindex','-1'); v.setAttribute('disablepictureinpicture','');
  v.style.pointerEvents='none'; v.style.userSelect='none';
  v.addEventListener('pause', forceDash);
  v.addEventListener('ended', forceDash);
  v.addEventListener('contextmenu', e => e.preventDefault());
  v.addEventListener('dragstart', e => e.preventDefault());
  if (!dashBound) {
    dashBound = true;
    document.addEventListener('visibilitychange', () => { if(!document.hidden) forceDash() });
    window.addEventListener('pageshow', forceDash);
  }
  forceDash();
  setTimeout(forceDash, 500);
}

  (lastRes.sources || []).forEach(s => { counts[s.id] = s.ok ? s.count : null; });
  paintFilterRow(counts);
  const items = lastRes.items.filter(a => searchFilter === 'all' || a.provider === searchFilter);
  const srcTxt = (lastRes.sources || []).map(s =>
    esc(PROVIDERS[s.id].name) + ' <b style="color:var(--txt)">' + (s.ok ? s.count : '—') + '</b>' + (s.ok ? '' : ' <span class="bad">gagal</span>')
  ).join(' · ');
  if (!items.length) {
    if (ri) ri.innerHTML = '0 hasil untuk <b style="color:var(--acc2)">'+esc(lastQuery)+'</b>';
    box.innerHTML = stateHTML('search','Tidak Ditemukan','Tidak ada anime yang cocok dengan "'+lastQuery+'". Coba kata kunci lain.','<button class="btn primary" data-act="retry-search">'+svg('refresh','',2.1)+' Coba lagi</button>');
    return;
  }
  const sorted = items.map(a => ({a, s: scoreSearchMatch(a, lastQuery)})).sort((x,y) => y.s - x.s).map(x => x.a);
  if (ri) ri.innerHTML = '<b style="color:var(--txt)">'+sorted.length+'</b> hasil untuk <b style="color:var(--acc2)">'+esc(lastQuery)+'</b><span class="src"> · '+srcTxt+'</span>';
  box.innerHTML = '<div class="grid wide">' + sorted.map((a,i) => '<div class="rv-s" style="--d:'+((i%8)*36)+'ms">'+cardHTML(a,{g:true})+'</div>').join('') + '</div>';
  initReveal(box); initLazy(box);
}

async function runSearch(query) {
  const seq = ++searchSeq;
  lastQuery = query;
  syncQueryUrl(query);
  const box = $('#results'); if (!box) return;
  box.innerHTML = '<div class="grid wide">'+skCards(12,true)+'</div>';
  const ri = $('#resInfo'); if (ri) ri.innerHTML = 'Mencari <b style="color:var(--acc2)">'+esc(query)+'</b>…';
  try {
    const res = await API.search(query);
    if (seq !== searchSeq) return;
    lastRes = res;
    paintSearch();
  } catch (e) {
    if (seq !== searchSeq) return;
    lastRes = null;
    if (ri) ri.innerHTML = 'Gagal mencari <b style="color:var(--acc2)">'+esc(query)+'</b>';
    box.innerHTML = stateHTML('err','Pencarian Gagal', e.message || 'Terjadi kesalahan saat menghubungi provider.', '<button class="btn primary" data-act="retry-search">'+svg('refresh','',2.1)+' Coba lagi</button>');
  }
}

async function ViewSearch(r) {
  const term = r.q.q || r.parts[1] || '';
  searchFilter = 'all'; lastRes = null; lastQuery = term;
  syncQueryUrl(term);
  view.innerHTML = '<div class="shell" style="padding-top:6px">' +
    '<div class="sbar-wrap">' +
    '<div class="searchbar" id="sbar">' +
    '<span class="sic">'+svg('search','',2)+'</span>' +
    '<input id="sinput" type="search" autocomplete="off" spellcheck="false" placeholder="Cari judul anime (English/Japanese)…" value="'+esc(term)+'" aria-label="Cari anime">' +
    '<button class="clr" data-act="s-clear" aria-label="Hapus">'+svg('x','',2.4)+'</button>' +
    '</div>' +
    '<div class="filters sfil" id="sfRow"></div>' +
    '</div>' +
    '<div id="resInfo" style="margin:14px 0 8px;font-size:12.6px;color:var(--dim)"></div>' +
    '<div id="qhist" class="qhist" style="margin-bottom:4px"></div>' +
    '<div id="results"></div>' +
    footerHTML() + '</div>';

  const inp = $('#sinput'), bar = $('#sbar');
  const sync = () => bar.classList.toggle('has', !!inp.value);
  sync();
  paintFilterRow(null);
  paintQHist();

  if (term) runSearch(term); else idleSearchState();

  inp.addEventListener('input', debounce(() => {
    sync();
    const v = inp.value.trim();
    if (v.length >= 2) runSearch(v);
    else {
      searchSeq++;
      syncQueryUrl(''); lastRes = null; lastQuery = '';
      idleSearchState(); paintQHist();
    }
  }, 350));

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const v = inp.value.trim();
      if (v.length >= 2) { Store.addQ(v); runSearch(v); }
    }
  });

  const clr = bar.querySelector('.clr');
  if (clr) clr.addEventListener('click', () => {
    inp.value = ''; sync(); searchSeq++;
    syncQueryUrl(''); lastRes = null; lastQuery = '';
    idleSearchState(); paintQHist();
    inp.focus();
  });

  if (!term) setTimeout(() => inp.focus(), 150);
}

const EX_COPY = {

  oploverz: { a:['Katalog Oploverz','Semua judul (A–Z) dari direktori Oploverz'], b:['Anime Selesai','Oploverz tidak menyediakan filter status'] },

function renderExploreList(hostId, res, opt) {
  const host = $('#'+hostId); if (!host) return;
  const list = res.list || [];
  if (!list.length) {
    host.innerHTML = stateHTML('empty','Tidak ada data','Daftar ini tidak tersedia untuk provider '+PROVIDERS[Store.getProvider()].name+' saat ini.','');
    dropRailArrows(opt.sec);
    return;
  }
  if (opt.catalog && list.length > 48) {
    const STEP = 48;
    let shown = 0;
    const grid = document.createElement('div'); grid.className = 'grid wide';
    const more = document.createElement('div'); more.style.cssText = 'display:flex;justify-content:center;margin-top:18px';
    const btn = document.createElement('button'); btn.className = 'btn ghost'; btn.type = 'button';
    host.innerHTML = ''; host.appendChild(grid); host.appendChild(more); more.appendChild(btn);
    dropRailArrows(opt.sec);
    const paint = () => {
      const part = list.slice(shown, shown + STEP);
      grid.insertAdjacentHTML('beforeend', part.map((a,i) => '<div class="rv-s" style="--d:'+((i%8)*30)+'ms">'+cardHTML(a,{g:true})+'</div>').join(''));
      shown += part.length;
      initReveal(grid); initLazy(grid);
      if (shown >= list.length) more.style.display = 'none';
      else btn.textContent = 'Muat lebih banyak (' + (list.length - shown) + ')';
    };
    btn.addEventListener('click', paint);
    paint();
    return;
  }
  host.innerHTML = '<div class="rail" data-railwrap="'+opt.wrap+'"><div class="rail-track" id="'+opt.rail+'">'+railItems(list)+'</div></div>';
  initRails(host);
}

/* ═══════ VIEW: WATCH ═══════ */
async function ViewWatch(r) {
  const param = r.parts[1] || '';
  const epNum = r.parts[2] || '1';
  const provider = r.q.provider || Store.getProvider();
  const eid = r.q.eid || '';
  const eslug = r.q.eslug || '';

  view.innerHTML = '<div class="shell" style="padding-top:16px"><div id="wHost"><div class="sk" style="aspect-ratio:16/9;border-radius:var(--r3);width:100%"></div></div><div id="wInfo" style="margin-top:16px"></div></div>';

  let anime;
  try {
    anime = await API.detail(provider, param, eslug);
  } catch(e) {
    const notFound = e && e.status === 404;
    view.innerHTML = '<div class="shell">'+stateHTML(notFound?'empty':'err', notFound?'Anime Tidak Ditemukan':'Gagal memuat anime', notFound?'Judul ini tidak tersedia pada provider ini.':(e.message||''), '<div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center"><button class="btn primary" data-act="reload">'+svg('refresh','',2.1)+' Coba lagi</button><a class="btn ghost" href="#/home">Beranda</a></div>')+'</div>';
    return;
  }
  DET = anime;

  const epList = anime.episodeList || [];
  const epIdx = epList.findIndex(e => String(e.num) === String(epNum));
  const ep = epIdx > -1 ? epList[epIdx] : null;
  const prevEp = epIdx > 0 ? epList[epIdx-1] : null;
  const nextEp = epIdx > -1 && epIdx < epList.length-1 ? epList[epIdx+1] : null;
  const eidUse = eid || (ep && ep.id ? String(ep.id) : '') || epNum;
  const eslugUse = eslug || (ep && ep.slug ? String(ep.slug) : '') || '';
  const favW = Store.isFav(anime.id);

  $('#wInfo').innerHTML =
    '<div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:240px">' +
    '<a href="#/anime/'+encodeURIComponent(anime.id)+'?provider='+encodeURIComponent(provider)+(anime.slug?'&slug='+encodeURIComponent(anime.slug):'')+'" class="link-more" style="margin-bottom:8px">'+svg('back','',2.4)+' '+esc(anime.title)+'</a>' +
    '<h1 style="font-size:clamp(19px,4vw,26px);font-weight:740;margin-top:6px">Episode '+esc(epNum)+'</h1>' +
    '<div class="stats" style="margin-top:10px"><span class="stat">'+svg('film','',1.9)+' <b>'+esc(epNum)+'</b></span>'+(anime.type?'<span class="stat">'+esc(anime.type)+'</span>':'')+'</div></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn'+(favW?' danger':' ghost')+' sm" data-fav="'+esc(anime.id)+'" data-provider="'+esc(anime.provider)+'" data-cover="'+esc(anime.poster)+'" data-title="'+esc(anime.title)+'" data-score="'+esc(anime.score||'')+'" data-type="'+esc(anime.type||'')+'" data-slug="'+esc(anime.slug||'')+'" aria-pressed="'+favW+'">'+svg('heart','',2.1)+(favW?' Tersimpan':' Favorit')+'</button>' +
    '<a class="btn ghost sm" href="#/anime/'+encodeURIComponent(anime.id)+'?provider='+encodeURIComponent(provider)+(anime.slug?'&slug='+encodeURIComponent(anime.slug):'')+'">'+svg('film','',2)+' Episode</a>' +
    '</div></div>' +
    '<div id="wEpNav" style="display:flex;gap:9px;margin-top:18px;flex-wrap:wrap">' +
    (prevEp ? '<a class="btn ghost" href="#/watch/'+encodeURIComponent(anime.id)+'/'+encodeURIComponent(prevEp.num)+'?provider='+encodeURIComponent(provider)+'&eid='+encodeURIComponent(prevEp.id)+'&eslug='+encodeURIComponent(prevEp.slug||'')+'">'+svg('left','',2.2)+' EP '+esc(prevEp.num)+'</a>' : '') +
    (nextEp ? '<a class="btn primary" href="#/watch/'+encodeURIComponent(anime.id)+'/'+encodeURIComponent(nextEp.num)+'?provider='+encodeURIComponent(provider)+'&eid='+encodeURIComponent(nextEp.id)+'&eslug='+encodeURIComponent(nextEp.slug||'')+'">EP '+esc(nextEp.num)+' '+svg('right','',2.2)+'</a>' : '') +
    '</div>';

  try {
    progress(true, 45);
    const stream = await API.episode(provider, {episodeId:eidUse, episodeSlug:eslugUse || epNum, episode:epNum, animeId:anime.id, animeSlug:anime.slug||''});
    progress(true, 100); setTimeout(() => progress(false), 240);

    let playerUrl = stream.playerUrl || '';
    const hasSrv = !!(stream.servers && stream.servers.length);

    let playerMarkup = '';
    if (playerUrl) {
      playerMarkup = '<iframe id="playerFrame" src="'+esc(playerUrl)+'" allowfullscreen loading="eager" referrerpolicy="no-referrer" style="width:100%;height:100%;border:0;background:#000"></iframe>';
    } else {
      playerMarkup = '<div class="empty"><div>'+svg('server','',1.7)+'<strong>Stream tidak tersedia</strong><p style="font-size:12.8px;max-width:44ch;line-height:1.62">'+(hasSrv ? 'Provider tidak memberikan URL player untuk episode ini. Coba pilih server alternatif di bawah.' : 'Provider tidak memberikan URL player untuk episode ini.')+'</p></div></div>';
    }

    $('#wHost').innerHTML = '<div class="pw">'+playerMarkup+'</div>';

    if (hasSrv) {
      const srvHTML = '<div style="margin-top:16px"><div style="font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:9px">Pilih Server Streaming</div><div class="srv" id="srvRow">' +
        stream.servers.map((s,i) => '<button class="srv-btn'+(i===0?' on':'')+'" data-server-id="'+esc(s.id)+'" data-quality="'+esc(s.quality||'')+'">' +
          svg('server','',2)+esc(s.name)+(s.quality?' <span style="font-size:10px;opacity:.7">('+esc(s.quality)+')</span>':'') +
        '</button>').join('') +
        '</div></div>';
      $('#wInfo').insertAdjacentHTML('beforeend', srvHTML);

      $$('.srv-btn').forEach(b => {
        b.addEventListener('click', async () => {
          const serverId = b.dataset.serverId;
          if(!serverId){toast('Server ID kosong.','err');return}
          if(provider!=='otakudesu'){toast('Resolver server hanya untuk Otakudesu.','err');return}

          const label = b.innerHTML;
          b.textContent = 'Memuat…'; b.disabled = true;
          try {
            const url = await API.resolveServer(serverId);
            if(!url) throw new Error('URL kosong.');
            const iframe = $('#playerFrame');
            if(iframe) iframe.src = url;
            $$('.srv-btn').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
            toast('Server aktif.','ok');
          } catch(e) { toast(e.message,'err') }
          finally { b.disabled = false; b.innerHTML = label; }
        });
      });
    } else if (!playerUrl) {
      const srvHTML = '<div style="margin-top:16px;padding:14px;border-radius:14px;background:rgba(255,159,10,.05);border:1px solid rgba(255,159,10,.18);color:var(--mut);font-size:12.8px;line-height:1.62"><b style="color:var(--warn)">Tidak ada stream untuk episode ini</b><br>Provider tidak memberikan URL player maupun server alternatif. Coba episode lain dari daftar di halaman detail.<br><a class="btn ghost sm" style="margin-top:10px" href="#/anime/'+encodeURIComponent(anime.id)+'?provider='+encodeURIComponent(provider)+(anime.slug?'&slug='+encodeURIComponent(anime.slug):'')+'">'+svg('film','',2)+' Lihat daftar episode</a></div>';
      $('#wInfo').insertAdjacentHTML('beforeend', srvHTML);
    }

    Store.addHist({id:anime.id, slug:anime.slug||anime.id, title:anime.title, cover:anime.poster, ep:epNum, provider, eid:eidUse, eslug:eslugUse, t:0, dur:0});

  } catch(e) {
    progress(false);
    $('#wHost').innerHTML = '<div class="pw"><div class="empty"><div>'+svg('alert','',1.7)+'<strong>Stream gagal dimuat</strong><p style="font-size:12.8px;max-width:44ch;line-height:1.62">'+esc(e.message||'Tidak ada sumber.')+'</p><div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:14px"><button class="btn primary" data-act="reload">'+svg('refresh','',2.1)+' Coba lagi</button><a class="btn ghost" href="#/anime/'+encodeURIComponent(anime.id)+'?provider='+encodeURIComponent(provider)+'">Kembali</a></div></div></div></div>';
  }
}

/* ═══════ GLOBAL EVENTS ═══════ */
document.addEventListener('click', async e => {
  const cardInSearch = e.target.closest('a.card');
  if (cardInSearch && curRoute === 'search' && lastQuery) Store.addQ(lastQuery);

  const fav = e.target.closest('[data-fav]');
  if(fav) {
    e.preventDefault(); e.stopPropagation();
    const id = fav.dataset.fav;
    const provider = fav.dataset.provider || Store.getProvider();
    const added = Store.toggleFav({
      id, title:fav.dataset.title, cover:fav.dataset.cover, provider,
      score:fav.dataset.score||'', epLabel:fav.dataset.epl||'', sub:fav.dataset.sub||'',
      type:fav.dataset.type||'', slug:fav.dataset.slug||''
    });
    $$('[data-fav="'+id+'"]').forEach(b => {
      const sm = b.classList.contains('sm');
      if (b.classList.contains('btn')) {
        b.className = 'btn' + (added ? ' danger' : ' ghost') + (sm ? ' sm' : '');
        b.innerHTML = added ? svg('heart','',2.1)+' Tersimpan' : svg('heart','',2.1)+' Favorit';
      } else {
        b.classList.toggle('on', added);
      }
      b.setAttribute('aria-pressed', String(added));
      b.classList.remove('beat'); void b.offsetWidth; b.classList.add('beat');
    });
    toast(added?'Ditambahkan ke favorit.':'Dihapus dari favorit.', added?'ok':'info');
    renderNav();
    if(curRoute==='favorite') ViewFavorite();
    return;
  }

  const act = e.target.closest('[data-act]');
  if(act) {
    const a = act.dataset.act;
    if(a==='open-settings'){e.preventDefault();openSettings();return}
    if(a==='close-sheet'){e.preventDefault();closeSheet();return}
    if(a==='reload'){location.reload();return}
    if(a==='back'){e.preventDefault();back();return}
    if(a==='goto'){e.preventDefault();go(act.dataset.to.replace(/^#/,''));return}
    if(a==='toggle-syn'){const s=$('#syn');const open=s.classList.toggle('clip')===false;act.classList.toggle('open',open);act.innerHTML=(open?'Tampilkan lebih sedikit ':'Baca selengkapnya ')+svg('down','',2.4);return}
    if(a==='watch-first'){
      if(!DET) return;
      const idx = +act.dataset.ep;
      const ep = EP[idx];
      if(ep) go('/watch/'+encodeURIComponent(DET.id)+'/'+encodeURIComponent(ep.num)+'?provider='+encodeURIComponent(DET.provider)+'&eid='+encodeURIComponent(ep.id)+'&eslug='+encodeURIComponent(ep.slug||''));
      return;
    }
    if(a==='clear-fav' || a==='clear-favs'){
      if(confirm('Kosongkan semua favorit?')){Store.favs=[];LS.set('favs',[]);renderNav();if(curRoute==='favorite')ViewFavorite();toast('Favorit dikosongkan.','ok')}
      return;
    }
    if(a==='clear-hist'){
      if(confirm('Hapus semua riwayat?')){Store.hist=[];LS.set('hist',[]);ViewHistory();toast('Riwayat dihapus.','ok')}
      return;
    }
    if(a==='set-provider'){
      Store.setCfg('provider', act.dataset.id);
      toast('Provider diubah ke '+PROVIDERS[act.dataset.id].name, 'ok');
      closeSheet();
      renderNav();
      render();
      return;
    }
    if(a==='toggle-autoNext'){Store.setCfg('autoNext',!Store.cfg.autoNext);act.classList.toggle('on',Store.cfg.autoNext);return}
    if(a==='rail'){railScroll(act.dataset.rail,+act.dataset.dir);return}
    if(a==='retry-search'){ if(lastQuery) runSearch(lastQuery); return }
    if(a==='clear-shist'){ Store.clearQ(); paintQHist(); toast('Riwayat pencarian dihapus.','ok'); return }
    if(a==='use-q'){
      const q = act.dataset.q || '';
      const inp = $('#sinput'), sbar = $('#sbar');
      if (inp) inp.value = q;
      if (sbar) sbar.classList.toggle('has', !!q);
      if (q.length >= 2) runSearch(q);
      return;
    }
    if(a==='sf'){
      const v = act.dataset.v || 'all';
      if (v !== searchFilter) { searchFilter = v; paintSearch(); }
      return;
    }
  }

  const railBtn = e.target.closest('[data-rail]');
  if(railBtn){e.preventDefault();railScroll(railBtn.dataset.rail,+railBtn.dataset.dir);return}
});

/* ═══════ BOOT ═══════ */
function boot() {
  renderNav();
  if(!location.hash) location.replace('#/home');
  render();
  window.addEventListener('storage', ev => {
    if(ev.key && ev.key.indexOf('nanime.v1.')===0){
      Store.favs = LS.get('favs',[]); Store.hist = LS.get('hist',[]);
      renderNav();
    }
  });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
</body>
</html>
