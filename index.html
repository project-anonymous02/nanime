function timeLeft(sec){
  if(sec==null)return '—';
  const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);
  if(d)return d+' hari';
  if(h)return h+' jam '+(m?m+' mnt':'');
  return m+' menit';
}
async function loadEpisodes(){
  EPTYPE=Store.cfg.type||'sub';
  const a=DET;
  const box=$('#epBox'); if(!box)return;
  const st=(a.raw&&a.raw.streamingEpisodes)||[];
  try{
    const res=await Backend.episodes(a.id,a.title,EPTYPE);
    if(res.adapter&&res.episodes&&res.episodes.length){
      EP=res.episodes;
      $('#epNote').innerHTML='<div class="note" style="background:rgba(49,208,170,.06);border-color:rgba(49,208,170,.2);color:var(--mut)"><b style="color:#b9ffe9">Sumber episode:</b> '+esc((AD(res.adapter)||{}).name||res.adapter)+' · '+res.episodes.length+' entri ('+res.episodes.filter(x=>x.cat==='sub').length+' sub / '+res.episodes.filter(x=>x.cat==='dub').length+' dub). Provider akan dipilih otomatis saat pemutaran.</div>';
    }else{
      EP=fallbackEps(a,st);
      $('#epNote').innerHTML='<div class="note"><b>Mode metadata.</b> Daftar episode disusun dari data AniList ('+(a.eps?a.eps+' episode':'jumlah episode belum diketahui')+') karena tidak ada backend stream yang merespons. Buka <b>Pengaturan Sumber</b> untuk menambahkan instance (Kuhi / Miruro-API / Consumet) agar episode dapat diputar.</div>'+
        ((res.errors&&res.errors.length)?'<div style="margin-top:8px;font-size:11px;color:var(--dim)">'+res.errors.slice(0,3).map(esc).join('<br>')+'</div>':'');
    }
  }catch(e){
    EP=fallbackEps(a,st);
    $('#epNote').innerHTML='<div class="note"><b>Mode metadata.</b> '+esc(e.message||'Sumber episode tidak tersedia.')+'</div>';
  }
  $('#epCount').textContent='· '+EP.length+' entri';
  $$('#epType button').forEach(b=>{
    b.classList.toggle('on',b.dataset.type===EPTYPE);
    b.onclick=()=>{EPTYPE=b.dataset.type;Store.setCfg('type',EPTYPE);$$('#epType button').forEach(x=>x.classList.toggle('on',x===b));EPPAGE=1;renderEps()};
  });
  const q=$('#epQ');
  if(q)q.addEventListener('input',debounce(()=>{EPQ=q.value.trim().toLowerCase();EPPAGE=1;renderEps()},140));
  EPPAGE=1;renderEps();
}
function fallbackEps(a,st){
  const out=[];
  const total=a.eps||(st&&st.length)||0;
  if(total>0){
    for(let i=1;i<=total;i++){
      const se=st&&st[i-1];
      out.push({provider:null,cat:'sub',id:null,num:i,title:(se&&se.title&&se.title!=='Episode '+i)?se.title.replace(/^Episode\s*\d+\s*[-–:]\s*/i,''):'',image:(se&&se.thumbnail)||'',derived:true});
    }
  }else if(st&&st.length){
    st.forEach((se,i)=>out.push({provider:null,cat:'sub',id:null,num:i+1,title:(se.title||'').replace(/^Episode\s*\d+\s*[-–:]\s*/i,''),image:se.thumbnail||'',derived:true}));
  }
  return out;
}
function filteredEps(){
  let list=EP.filter(e=>!EPTYPE||e.cat===EPTYPE||EP.filter(x=>x.cat===EPTYPE).length===0);
  if(EPQ){
    const isNum=/^\d+$/.test(EPQ);
    list=list.filter(e=>{
      if(isNum)return String(e.num).indexOf(EPQ)===0||String(e.num)===EPQ;
      return String(e.title||'').toLowerCase().indexOf(EPQ)>-1||String(e.num).indexOf(EPQ)>-1;
    });
  }
  return list;
}
const PER=60;
function renderEps(){
  const box=$('#epBox'),pg=$('#epPager'); if(!box)return;
  const list=filteredEps();
  if(!list.length){
    box.innerHTML=stateHTML('empty','Episode tidak ditemukan',EP.length?'Tidak ada episode yang cocok dengan filter “'+EPQ+'”.':'Sumber belum menyediakan daftar episode untuk judul ini.','');
    pg.innerHTML='';return;
  }
  const pages=Math.max(1,Math.ceil(list.length/PER));
  EPPAGE=clamp(EPPAGE,1,pages);
  const slice=list.slice((EPPAGE-1)*PER,EPPAGE*PER);
  const a=DET;
  box.innerHTML='<div class="ep-grid">'+slice.map((e,i)=>{
    const key=a.id+':'+e.num+':'+(e.cat||'sub');
    const watched=!!Store.watched[key];
    const catBadges=EP.some(x=>x.num===e.num&&x.cat==='dub')?'<span style="font-size:9.5px;padding:1px 5px;border-radius:5px;background:rgba(125,180,255,.14);color:#a9caff;margin-left:6px;font-weight:700">DUB</span>':'';
    return '<button class="ep rv-s'+(watched?' watched':'')+'" style="--d:'+((i%10)*26)+'ms" data-ep="'+esc(String(e.num))+'" data-cat="'+esc(e.cat||'sub')+'" data-eid="'+esc(e.id||'')+'" data-prov="'+esc(e.provider||'')+'" aria-label="Putar episode '+esc(e.num)+'">'+
      (e.image?'<span class="th"><img data-src="'+esc(e.image)+'" alt="" loading="lazy" decoding="async"/></span>':'<span class="no">'+e.num+'</span>')+
      '<span class="tx"><b>Episode '+e.num+catBadges+(e.filler?'<span style="font-size:9.5px;padding:1px 5px;border-radius:5px;background:rgba(245,165,36,.16);color:#f0c67a;margin-left:6px;font-weight:700">FILLER</span>':'')+'</b>'+
      '<span>'+esc(e.title||(e.derived?'Sumber: AniList (mode metadata)':(e.provider||'')))+'</span></span>'+
      '<span class="go">'+svg('play','',2.2)+'</span></button>';
  }).join('')+'</div>';
  let ph='';
  if(pages>1){
    ph+='<div class="pager">';
    ph+='<button data-page="'+(EPPAGE-1)+'"'+(EPPAGE===1?' disabled':'')+'>'+svg('left','',2.4)+'</button>';
    const win=[];const push=n=>win.indexOf(n)<0&&n>=1&&n<=pages&&win.push(n);
    push(1);for(let i=EPPAGE-1;i<=EPPAGE+1;i++)push(i);push(pages);
    win.sort((x,y)=>x-y);
    let last=0;
    win.forEach(n=>{if(n-last>1)ph+='<span class="gap">…</span>';ph+='<button class="'+(n===EPPAGE?'on':'')+'" data-page="'+n+'">'+n+'</button>';last=n});
    ph+='<button data-page="'+(EPPAGE+1)+'"'+(EPPAGE===pages?' disabled':'')+'>'+svg('right','',2.4)+'</button>';
    ph+='<span class="gap" style="margin-left:8px">'+((EPPAGE-1)*PER+1)+'–'+Math.min(list.length,EPPAGE*PER)+' dari '+list.length+'</span></div>';
  }
  pg.innerHTML=ph;
  $$('[data-page]',pg).forEach(b=>b.addEventListener('click',()=>{
    EPPAGE=+b.dataset.page;renderEps();
    const el=$('#epPanel');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  }));
  $$('[data-ep]',box).forEach(b=>b.addEventListener('click',()=>{
    const num=b.dataset.ep,cat=b.dataset.cat,eid=b.dataset.eid,prov=b.dataset.prov;
    const qs=['type='+encodeURIComponent(cat)];
    if(eid)qs.push('eid='+encodeURIComponent(eid));
    if(prov)qs.push('provider='+encodeURIComponent(prov));
    go('/watch/'+DET.slug+'/'+num+'?'+qs.join('&'));
  }));
  initReveal(box);initLazy(box);
}

  const v=$('#pv'), pw=$('#pw'), ovl=$('#ovl');
  const subs=res.subtitles||[];
  const P={
    hls:null, srcIdx:-1, hideT:null, menuOpen:null, ctx:ctx,
    load(i,manual){
      i=clamp(i||0,0,res.sources.length-1);
      this.srcIdx=i;
      const s=res.sources[i];
      this.destroy();
      pw.classList.add('loading');
      const url=s.proxied||s.url;
      const isHls=(s.isM3U8||s.type==='hls'||/\.m3u8(\?|$)/i.test(url));
      const keep=this.keepTime||0;
      if(isHls&&window.Hls&&Hls.isSupported()){
        const hls=new Hls({
          enableWorker:true, lowLatencyMode:false, backBufferLength:70, maxBufferLength:32,
          manifestLoadingTimeOut:16000, manifestLoadingMaxRetry:2, levelLoadingMaxRetry:4, fragLoadingMaxRetry:5,
          xhrSetup:function(xhr){ if(s.referer&&!s.proxied){ /* browser tak bisa set Referer; andalkan proxy backend */ } }
        });
        this.hls=hls;
        hls.on(Hls.Events.MANIFEST_PARSED,()=>{
          pw.classList.remove('loading');
          v.play().catch(()=>{});
          if(keep>3&&keep<(v.duration||1e9)-8){try{v.currentTime=keep}catch(e){}}
          this.buildQuality();
        });
        hls.on(Hls.Events.ERROR,(ev,d)=>{
          if(!d.fatal)return;
          if(d.type===Hls.ErrorTypes.MEDIA_ERROR){hls.recoverMediaError();return}
          /* coba sumber berikutnya */
          if(this.srcIdx<res.sources.length-1){
            toast('Sumber '+(this.srcIdx+1)+' gagal, mencoba sumber berikutnya…','warn','Beralih sumber');
            this.keepTime=v.currentTime||0;
            this.load(this.srcIdx+1);
          }else{
            pw.classList.remove('loading');
            this.fail('Semua sumber gagal dimuat ('+(d.details||'network error')+'). '+(s.referer?'Stream ini membutuhkan header Referer — gunakan backend dengan proxy M3U8 (mis. Kuhi).':''));
          }
        });
        hls.loadSource(url); hls.attachMedia(v);
      }else if(isHls&&v.canPlayType('application/vnd.apple.mpegurl')){
        v.src=url;
        v.addEventListener('loadedmetadata',()=>{pw.classList.remove('loading');v.play().catch(()=>{});if(keep>3)v.currentTime=keep},{once:true});
        v.addEventListener('error',()=>{
          if(this.srcIdx<res.sources.length-1)this.load(this.srcIdx+1);
          else this.fail('Safari gagal memuat playlist HLS ini.');
        },{once:true});
      }else{
        v.src=url;
        v.addEventListener('loadedmetadata',()=>{pw.classList.remove('loading');v.play().catch(()=>{});if(keep>3)v.currentTime=keep},{once:true});
        v.addEventListener('error',()=>this.fail('Format video tidak didukung browser ini.'),{once:true});
      }
      /* subtitle */
      $$('track',v).forEach(t=>t.remove());
      if(subs.length){
        $('#cSub').style.display='';
        subs.forEach((sb,i)=>{
          const t=document.createElement('track');
          t.kind='subtitles'; t.label=sb.label||('Subtitle '+(i+1)); t.srclang=(sb.lang||'en').slice(0,2); t.src=sb.url;
          if(i===0)t.default=false;
          t.addEventListener('error',()=>{t.disabled=true});
          v.appendChild(t);
        });
      }else{$('#cSub').style.display='none'}
    },
    fail(msg){
      pw.classList.remove('loading');
      const p=$('#psrc');
      p.classList.add('on');
      p.innerHTML='<div class="ic">'+svg('alert','',1.7)+'</div><h4>Video gagal dimuat</h4><p>'+esc(msg||'Sumber tidak dapat diputar.')+
        '</p><div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center">'+
        '<button class="btn primary" data-p="retry">'+svg('refresh','',2.1)+' Muat ulang</button>'+
        '<button class="btn ghost" data-act="open-settings">'+svg('gear','',2)+' Ganti sumber</button></div>';
    },
    buildQuality(){
      if(!this.hls)return;
      const lv=this.hls.levels||[];
      this.levels=lv;
    },
    destroy(){ if(this.hls){try{this.hls.destroy()}catch(e){} this.hls=null} v.pause(); v.removeAttribute('src'); try{v.load()}catch(e){} },
    show(){pw.classList.remove('hide');clearTimeout(this.hideT);
      if(!v.paused)this.hideT=setTimeout(()=>{if(!this.menuOpen)pw.classList.add('hide')},2800)},
    openMenu(which){
      const m=$('#pmenu');
      if(this.menuOpen===which){m.classList.remove('open');this.menuOpen=null;return}
      this.menuOpen=which;
      let h='';
      if(which==='q'){
        h+='<div class="hd">Kualitas</div>';
        h+='<button class="mi'+(this.hls&&this.hls.currentLevel===-1?' on':'')+'" data-q="-1">Auto'+svg('check','',2.6)+'</button>';
        if(this.hls&&this.hls.levels&&this.hls.levels.length){
          this.hls.levels.slice().map((l,i)=>({l:l,i:i})).sort((a,b)=>(b.l.height||0)-(a.l.height||0)).forEach(o=>{
            h+='<button class="mi'+(this.hls.currentLevel===o.i?' on':'')+'" data-q="'+o.i+'">'+(o.l.height?o.l.height+'p':(o.l.bitrate?Math.round(o.l.bitrate/1000)+'kbps':'Level '+o.i))+
              (o.l.attrs&&o.l.attrs.FRAME_RATE?' <span class="q">'+Math.round(+o.l.attrs.FRAME_RATE)+'fps</span>':'')+svg('check','',2.6)+'</button>';
          });
        }else{
          h+='<div class="mi" style="pointer-events:none;opacity:.6">Hanya 1 kualitas tersedia</div>';
        }
        h+='<div class="hd" style="margin-top:6px">Kecepatan</div>';
        [0.5,0.75,1,1.25,1.5,2].forEach(s=>{h+='<button class="mi'+(v.playbackRate===s?' on':'')+'" data-rate="'+s+'">'+s+'×'+svg('check','',2.6)+'</button>'});
      }else if(which==='s'){
        h+='<div class="hd">Subtitle</div>';
        h+='<button class="mi'+(v.textTracks.length&&v.textTracks[0].mode==='showing'?'':' on')+'" data-tr="-1">Mati'+svg('check','',2.6)+'</button>';
        Array.from(v.textTracks).forEach((t,i)=>{
          if(t.kind!=='subtitles'&&t.kind!=='captions')return;
          h+='<button class="mi'+(t.mode==='showing'?' on':'')+'" data-tr="'+i+'">'+esc(t.label||('Track '+(i+1)))+svg('check','',2.6)+'</button>';
        });
        if(!subs.length)h+='<div class="mi" style="pointer-events:none;opacity:.6">Sumber tidak menyediakan subtitle eksternal (mungkin sudah hard-sub)</div>';
      }else if(which==='e'){
        h+='<div class="hd">Episode</div>';
        const t=ctx.total, cur=ctx.ep;
        const from=Math.max(1,cur-4), to=t?Math.min(t,cur+6):cur+6;
        for(let i=from;i<=to;i++){
          h+='<a class="mi'+(i===cur?' on':'')+'" href="#/watch/'+esc(a.slug)+'/'+i+'?type='+ctx.type+'">Episode '+i+svg('check','',2.6)+'</a>';
        }
      }
      m.innerHTML=h; m.classList.add('open');
      $$('[data-q]',m).forEach(b=>b.addEventListener('click',()=>{
        const q=+b.dataset.q;
        if(this.hls)this.hls.currentLevel=q; else if(q>=0&&v.videoWidth){}
        this.openMenu('q');this.openMenu('q');this.show();
      }));
      $$('[data-rate]',m).forEach(b=>b.addEventListener('click',()=>{v.playbackRate=+b.dataset.rate;this.openMenu('r');this.openMenu('q');this.show()}));
      $$('[data-tr]',m).forEach(b=>b.addEventListener('click',()=>{
        const i=+b.dataset.tr;
        Array.from(v.textTracks).forEach((t,k)=>{t.mode=(k===i)?'showing':'disabled'});
        this.openMenu('s');this.openMenu('s');this.show();
      }));
    },
    closeMenu(){const m=$('#pmenu');if(m)m.classList.remove('open');this.menuOpen=null}
  };
  PLAYER=P;

  /* events */
  v.addEventListener('play',()=>{pw.classList.add('playing');$('#cPlay').innerHTML=svg('pause','',2);P.show()});
  v.addEventListener('pause',()=>{pw.classList.remove('playing');$('#cPlay').innerHTML=svg('play','',2);P.show();pw.classList.remove('hide')});
  v.addEventListener('waiting',()=>pw.classList.add('loading'));
  v.addEventListener('playing',()=>pw.classList.remove('loading'));
  v.addEventListener('canplay',()=>pw.classList.remove('loading'));
  v.addEventListener('volumechange',()=>{
    const mu=v.muted||v.volume===0;
    $('#cMute').innerHTML=svg(mu?'mute':'vol','',2);
    $('#cVol').value=mu?0:v.volume;
  });
  v.addEventListener('timeupdate',()=>{
    const d=v.duration||0, c=v.currentTime||0;
    const pct=d?clamp(c/d*100,0,100):0;
    $('#fill').style.width=pct+'%'; $('#knob').style.left=pct+'%';
    $('#cTime').textContent=fmtT(c)+' / '+fmtT(d);
    $('#seek').setAttribute('aria-valuenow',Math.round(pct));
    if(d>0)Store.setProg(ctx.key,c,d);
    checkSkip(c,d);
  });
  v.addEventListener('progress',()=>{
    if(v.buffered.length&&v.duration){
      $('#buf').style.width=clamp(v.buffered.end(v.buffered.length-1)/v.duration*100,0,100)+'%';
    }
  });
  v.addEventListener('ended',()=>onEnded());
  pw.addEventListener('mousemove',()=>P.show());
  pw.addEventListener('mouseleave',()=>{if(!v.paused)pw.classList.add('hide')});
  pw.addEventListener('touchstart',()=>P.show(),{passive:true});
  let tapT=null;
  v.addEventListener('click',()=>togglePlay());
  pw.addEventListener('dblclick',e=>{if(!e.target.closest('.pbtn'))toggleFull()});

  function togglePlay(){
    if(v.paused){v.play().catch(()=>{toast('Browser memblokir autoplay. Ketuk tombol putar.','warn','Autoplay diblokir')})}
    else v.pause();
  }
  function toggleFull(){
    if(!document.fullscreenElement){
      (pw.requestFullscreen?pw.requestFullscreen():v.webkitEnterFullscreen?v.webkitEnterFullscreen():null);
    }else document.exitFullscreen();
  }
  document.addEventListener('fullscreenchange',()=>{
    $('#cFull').innerHTML=svg(document.fullscreenElement?'exit':'full','',2);
  });

  /* seek */
  const seek=$('#seek');
  let dragging=false;
  const pos2time=ev=>{
    const r=seek.getBoundingClientRect();
    const x=clamp(((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width,0,1);
    return x*(v.duration||0);
  };
  const moveTip=ev=>{
    const r=seek.getBoundingClientRect();
    const x=clamp(((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width,0,1);
    $('#tip').style.left=(x*100)+'%'; $('#tip').textContent=fmtT(x*(v.duration||0));
  };
  seek.addEventListener('pointerdown',e=>{dragging=true;seek.classList.add('drag');seek.setPointerCapture(e.pointerId);moveTip(e)});
  seek.addEventListener('pointermove',e=>{moveTip(e);if(dragging){const t=pos2time(e);$('#fill').style.width=(v.duration?t/v.duration*100:0)+'%';$('#knob').style.left=(v.duration?t/v.duration*100:0)+'%'}});
  seek.addEventListener('pointerup',e=>{if(dragging){dragging=false;seek.classList.remove('drag');const t=pos2time(e);try{v.currentTime=t}catch(err){}}});
  seek.addEventListener('pointercancel',()=>{dragging=false;seek.classList.remove('drag')});
  seek.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'){v.currentTime=clamp(v.currentTime+5,0,v.duration||1e9);e.preventDefault()}
    if(e.key==='ArrowLeft'){v.currentTime=clamp(v.currentTime-5,0,v.duration||1e9);e.preventDefault()}
  });

  /* buttons */
  $$('[data-p]',pw).forEach(b=>{
    b.addEventListener('click',ev=>{
      ev.stopPropagation();
      const k=b.dataset.p;
      if(k==='toggle')togglePlay();
      else if(k==='mute'){v.muted=!v.muted}
      else if(k==='full')toggleFull();
      else if(k==='pip'){
        if(document.pictureInPictureElement)document.exitPictureInPicture();
        else if(v.requestPictureInPicture)v.requestPictureInPicture().catch(()=>toast('PiP tidak didukung pada konteks ini.','warn'));
      }
      else if(k==='menu')P.openMenu('q');
      else if(k==='sub')P.openMenu('s');
      else if(k==='back')go('/anime/'+a.slug);
      else if(k==='prev'&&ctx.ep>1)go('/watch/'+a.slug+'/'+(ctx.ep-1)+'?type='+ctx.type);
      else if(k==='next'&&(ctx.total==null||ctx.ep<ctx.total))go('/watch/'+a.slug+'/'+(ctx.ep+1)+'?type='+ctx.type);
      else if(k==='retry'){$('#psrc').classList.remove('on');P.load(P.srcIdx)}
      P.show();
    });
  });
  $('#cVol').addEventListener('input',e=>{v.volume=+e.target.value;v.muted=(+e.target.value===0)});
  document.addEventListener('click',e=>{if(!e.target.closest('#pmenu')&&!e.target.closest('[data-p="menu"]')&&!e.target.closest('[data-p="sub"]'))P.closeMenu()});

  /* keyboard */
  pw.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(k===' '||k==='k'){e.preventDefault();togglePlay()}
    else if(k==='arrowright'){v.currentTime=clamp(v.currentTime+10,0,v.duration||1e9)}
    else if(k==='arrowleft'){v.currentTime=clamp(v.currentTime-10,0,v.duration||1e9)}
    else if(k==='arrowup'){e.preventDefault();v.volume=clamp(v.volume+.1,0,1)}
    else if(k==='arrowdown'){e.preventDefault();v.volume=clamp(v.volume-.1,0,1)}
    else if(k==='f'){toggleFull()}
    else if(k==='m'){v.muted=!v.muted}
    P.show();
  });

  /* skip intro/outro */
  let skipEl=null;
  function checkSkip(c,d){
    const it=res.intro,ot=res.outro;
    let label=null;
    if(it&&c>=it.start-0.5&&c<it.end)label='Lewati Intro';
    else if(ot&&c>=ot.start-0.5&&c<Math.min(ot.end,d||1e9))label='Lewati Outro';
    if(label&&!skipEl){
      skipEl=document.createElement('button');
      skipEl.className='skipbtn'; skipEl.textContent=label;
      skipEl.addEventListener('click',()=>{v.currentTime=(label==='Lewati Intro'?it.end:ot.end);});
      pw.appendChild(skipEl);
    }else if(!label&&skipEl){skipEl.remove();skipEl=null}
  }
  function onEnded(){
    Store.markWatched(ctx.key);
    const hasNext=(ctx.total==null||ctx.ep<ctx.total);
    const ec=$('#endcard');
    if(hasNext&&Store.cfg.autoNext){
      let n=6;
      ec.innerHTML='<b>Episode berikutnya</b><p>Memulai Episode '+(ctx.ep+1)+' dalam <span id="cd">'+n+'</span> detik…</p>'+
        '<div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center">'+
        '<button class="btn primary" id="goNow">Putar Sekarang</button><button class="btn ghost" id="stopAuto">Batalkan</button></div>';
      ec.classList.add('on');
      const t=setInterval(()=>{
        n--;const s=$('#cd');if(s)s.textContent=n;
        if(n<=0){clearInterval(t);go('/watch/'+a.slug+'/'+(ctx.ep+1)+'?type='+ctx.type)}
      },1000);
      ec.querySelector('#goNow').addEventListener('click',()=>{clearInterval(t);go('/watch/'+a.slug+'/'+(ctx.ep+1)+'?type='+ctx.type)});
      ec.querySelector('#stopAuto').addEventListener('click',()=>{clearInterval(t);ec.classList.remove('on')});
    }else{
      Store.addHist(histEntry(a,ctx,0,v.duration||0));
      ec.innerHTML='<b>Selesai ditonton</b><p>Episode '+ctx.ep+' · '+esc(a.title)+'</p>'+
        '<div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center"><a class="btn primary" href="#/anime/'+esc(a.slug)+'">Ke Detail Anime</a></div>';
      ec.classList.add('on');
    }
  }
  function histEntry(an,cx,t,d){
    return {key:c.key,id:an.id,slug:an.slug,title:an.title,cover:an.cover,ep:c.ep,type:c.type,t:t,dur:d};
  }
  const saveHist=debounce(()=>{if(v.currentTime>4)Store.addHist(histEntry(a,ctx,v.currentTime,v.duration||0));renderResumeSoft()},4000);
  v.addEventListener('timeupdate',saveHist);
  window.addEventListener('beforeunload',()=>{if(v.currentTime>4)Store.addHist(histEntry(a,ctx,v.currentTime,v.duration||0))});

  /* resume position */
  const pg=Store.getProg(ctx.key);
  P.keepTime=pg&&pg.t>5&&pg.d&&pg.t<pg.d-15?pg.t:0;

  /* start */
  P.load(0);
  if(P.keepTime){toast('Melanjutkan dari '+fmtT(P.keepTime),'info','Riwayat dipulihkan')}
  setTimeout(()=>pw.focus({preventScroll:true}),80);
}

/* ═══════════ GLOBAL INTERACTION ═══════════ */
document.addEventListener('click',async e=>{
  const fav=e.target.closest('[data-fav]');
  if(fav){
    e.preventDefault();e.stopPropagation();
    const id=+fav.dataset.fav;
    const added=Store.toggleFav({id:id,slug:fav.dataset.slug,title:fav.dataset.title,cover:fav.dataset.cover,year:+fav.dataset.year||null,score:+fav.dataset.score||0});
    $$('[data-fav="'+id+'"]').forEach(b=>{
      b.classList.toggle('on',added);
      b.setAttribute('aria-pressed',String(added));
      b.classList.remove('beat');void b.offsetWidth;b.classList.add('beat');
      if(b.id==='bigFav')b.innerHTML=added?svg('heart','',2.1)+' Tersimpan':svg('heart','',2.1)+' Favorit';
    });
    toast(added?'“'+fav.dataset.title+'” ditambahkan ke Favorite.':'Dihapus dari Favorite.',added?'ok':'info',added?'Disimpan':'Dihapus');
    renderNav();
    if(curRoute==='favorite')ViewFavorite();
    return;
  }
  const act=e.target.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    ripple(act,e);
    if(a==='open-settings'){e.preventDefault();openSettings();return}
    if(a==='close-sheet'){e.preventDefault();closeSheet();return}
    if(a==='reload'){location.reload();return}
    if(a==='back'){e.preventDefault();back();return}
    if(a==='goto'){e.preventDefault();go(act.dataset.to.replace(/^#/,''));return}
    if(a==='load-more'){S.page++;runSearch();return}
    if(a==='retry-search'){runSearch();return}
    if(a==='reset-filters'){S.q='';S.genres=[];S.sort='TRENDING_DESC';S.year=0;S.format='';S.status='';
      const i=$('#sinput');if(i)i.value='';go('/search');return}
    if(a==='toggle-syn'){const s=$('#syn');const b=act;const open=s.classList.toggle('clip')===false;
      b.classList.toggle('open',open);b.setAttribute('aria-expanded',String(open));
      b.innerHTML=(open?'Tampilkan lebih sedikit ':'Baca selengkapnya ')+svg('down','',2.4);return}
    if(a==='watch-first'){
      const id=+act.dataset.id, sl=act.dataset.slug;
      go('/watch/'+sl+'/1?type='+(Store.cfg.type||'sub'));return}
    if(a==='open-eps'){openEpSheet();return}
    if(a==='retry-stream'){
      const id=+act.dataset.id,ep=+act.dataset.ep,tp=act.dataset.type;
      go('/watch/'+(DET?DET.slug:id+'/'+ep)+'/'+ep+'?type='+tp);return}
    if(a==='fav-here'){/* ditangani handler data-fav di atas bila ada */}
    if(a==='probe-all'){Backend.probeAll().then(()=>{toast('Pemeriksaan sumber selesai.','ok');const t=$('.sheet-bd2');if(t)t.innerHTML=settingsHTML()});return}
    if(a==='clear-data'){
      if(confirm('Hapus semua favorit, riwayat, dan progres tontonan dari perangkat ini?')){
        Store.favs=[];Store.hist=[];Store.progress={};Store.watched={};
        LS.set('favs',[]);LS.set('hist',[]);LS.set('prog',{});LS.set('watched',{});
        toast('Data lokal dihapus.','ok');renderNav();closeSheet();render();
      }return}
    if(a==='clear-fav'){
      if(confirm('Kosongkan semua favorit?')){Store.favs=[];LS.set('favs',[]);renderNav();ViewFavorite();toast('Favorit dikosongkan.','ok')}return}
    if(a==='export-fav'){
      const txt=Store.favs.map(f=>f.title+' — https://anilist.co/anime/'+f.id).join('\n');
      navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>toast(Store.favs.length+' judul disalin ke clipboard.','ok'),()=>toast('Gagal menyalin.','err'));
      return}
    if(a==='adp-toggle'){Backend.toggle(act.dataset.id);const t=$('.sheet-bd2');if(t)t.innerHTML=settingsHTML();renderNav();return}
    if(a==='adp-test'){
      const id=act.dataset.id;act.disabled=true;act.textContent='Menguji…';
      const b=await Backend.probe(id);
      act.disabled=false;act.innerHTML=svg('refresh','',2.1)+' Tes koneksi';
      const t=$('.sheet-bd2');if(t)t.innerHTML=settingsHTML();
      if(b)toast('Terhubung ke '+b,'ok',(AD(id)||{}).name);
      else toast('Tidak ada base URL yang merespons.','err',(AD(id)||{}).name);
      renderNav();return}
    if(a==='adp-up'||a==='adp-down'){Backend.move(act.dataset.id,a==='adp-up'?-1:1);const t=$('.sheet-bd2');if(t)t.innerHTML=settingsHTML();return}
    if(a==='cfg-auto'){Store.setCfg('autoNext',!Store.cfg.autoNext);act.classList.toggle('on',Store.cfg.autoNext);act.setAttribute('aria-checked',String(Store.cfg.autoNext));return}
    if(a==='cfg-theater'){Store.setCfg('theater',!Store.cfg.theater);act.classList.toggle('on',Store.cfg.theater);act.setAttribute('aria-checked',String(Store.cfg.theater));
      const pw=$('#pw');if(pw)pw.classList.toggle('theater',Store.cfg.theater);return}
    if(a==='cfg-type'){Store.setCfg('type',act.dataset.v);const n=$('#cfgTypeNow');if(n)n.textContent=act.dataset.v;
      $$('[data-act="cfg-type"]').forEach(b=>b.classList.toggle('primary',b.dataset.v===act.dataset.v));return}
    if(a==='rail'){railScroll(act.dataset.rail,+act.dataset.dir);return}
  }
  const railBtn=e.target.closest('[data-rail]');
  if(railBtn){e.preventDefault();railScroll(railBtn.dataset.rail,+railBtn.dataset.dir);return}
});
document.addEventListener('input',e=>{
  const inp=e.target.closest('[data-act="adp-url"]');
  if(inp){debSaveUrl(inp)}
});
const debSaveUrl=debounce(inp=>{Backend.setUrl(inp.dataset.id,inp.value);Store.setHealth(inp.dataset.id,'unknown',0,'');renderNav()},600);
function ripple(btn,e){
  if(!btn||!btn.getBoundingClientRect)return;
  const r=btn.getBoundingClientRect();
  const s=document.createElement('span');s.className='rip';
  const d=Math.max(r.width,r.height);
  s.style.width=s.style.height=d+'px';
  s.style.left=((e.clientX||r.left+r.width/2)-r.left-d/2)+'px';
  s.style.top=((e.clientY||r.top+r.height/2)-r.top-d/2)+'px';
  if(getComputedStyle(btn).position==='static')btn.style.position='relative';
  btn.appendChild(s);setTimeout(()=>s.remove(),620);
}
function openEpSheet(){
  if(!DET)return;
  const list=filteredEps().slice(0,400);
  openSheet('Episode · '+DET.title,
    '<div class="ep-search" style="margin-bottom:12px">'+svg('search','',2.2)+'<input id="shQ" type="search" placeholder="Cari nomor episode…" aria-label="Cari episode"/></div>'+
    '<div class="ep-grid" id="shGrid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">'+
    list.map(e=>'<button class="ep" data-ep="'+e.num+'" data-cat="'+esc(e.cat||'sub')+'" data-eid="'+esc(e.id||'')+'" data-prov="'+esc(e.provider||'')+'">'+
      '<span class="no">'+e.num+'</span><span class="tx"><b>Episode '+e.num+'</b><span>'+esc(e.title||'')+'</span></span><span class="go">'+svg('play','',2.2)+'</span></button>').join('')+
    '</div>'+(filteredEps().length>400?'<p style="font-size:11.6px;color:var(--dim);margin-top:10px">Menampilkan 400 pertama dari '+filteredEps().length+'. Gunakan pencarian untuk episode tertentu.</p>':''),
    root=>{
      const bind=()=>{
        $$('[data-ep]',root).forEach(b=>b.addEventListener('click',()=>{
          const qs=['type='+encodeURIComponent(b.dataset.cat)];
          if(b.dataset.eid)qs.push('eid='+encodeURIComponent(b.dataset.eid));
          if(b.dataset.prov)qs.push('provider='+encodeURIComponent(b.dataset.prov));
          closeSheet();
          go('/watch/'+DET.slug+'/'+b.dataset.ep+'?'+qs.join('&'));
        }));
      };
      bind();
      const q=$('#shQ',root);
      if(q)q.addEventListener('input',debounce(()=>{
        const v=q.value.trim().toLowerCase();
        const l=filteredEps().filter(e=>!v||String(e.num).indexOf(v)===0||String(e.title||'').toLowerCase().indexOf(v)>-1).slice(0,400);
        $('#shGrid',root).innerHTML=l.map(e=>'<button class="ep" data-ep="'+e.num+'" data-cat="'+esc(e.cat||'sub')+'" data-eid="'+esc(e.id||'')+'" data-prov="'+esc(e.provider||'')+'">'+
          '<span class="no">'+e.num+'</span><span class="tx"><b>Episode '+e.num+'</b><span>'+esc(e.title||'')+'</span></span><span class="go">'+svg('play','',2.2)+'</span></button>').join('')||
          '<p style="font-size:12.6px;color:var(--dim);padding:14px">Tidak ada episode yang cocok.</p>';
        bind();
      },140));
    });
}

/* keyboard global: "/" fokus search */
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/input|textarea|select/i.test(document.activeElement.tagName)&&!$('#sheet-root').classList.contains('open')){
    e.preventDefault();
    if(curRoute!=='search')go('/search');
    setTimeout(()=>{const i=$('#sinput');if(i)i.focus()},120);
  }
});

/* boot */
function boot(){
  renderNav();
  if(!location.hash)location.replace('#/home');
  render();
  /* probe backend sekali di latar belakang (hemat request) */
  setTimeout(()=>{
    const stale=Backend.active().some(id=>{const h=Store.health[id];return !h||Date.now()-h.ts>1000*60*30});
    if(stale)Backend.probeAll().then(renderNav);
  },1400);
  /* sinkronkan badge favorit lintas tab */
  window.addEventListener('storage',ev=>{
    if(ev.key&&ev.key.indexOf('nanime.v1.')===0){
      Store.favs=LS.get('favs',[]);Store.hist=LS.get('hist',[]);Store.progress=LS.get('prog',{});Store.watched=LS.get('watched',{});
      renderNav();
    }
  });
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
</body>
