<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<meta name="color-scheme" content="dark">
<title>Nanime - Anime Streaming</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0B0D12;--bg-2:#11141B;--bg-3:#161B24;
  --text:#E8ECF3;--text-2:#B4BCC9;--text-3:#7A8396;
  --primary:#6C8CFF;--primary-2:#8AA5FF;
  --primary-soft:rgba(108,140,255,.15);
  --accent:#FF6B9D;
  --border:rgba(255,255,255,.08);
  --border-2:rgba(255,255,255,.14);
  --success:#34D399;--warning:#FBBF24;--error:#F87171;
  --radius-lg:22px;--radius-md:16px;--radius-sm:12px;
  --shadow:0 10px 40px rgba(0,0,0,.4);
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  line-height:1.55;min-height:100vh;overflow-x:hidden
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{max-width:100%;display:block}
input{font:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:10px}

.sk{
  background:linear-gradient(
    90deg,
    var(--bg-2) 25%,
    var(--bg-3) 50%,
    var(--bg-2) 75%
  );
  background-size:200% 100%;
  animation:sh 1.4s infinite;
  border-radius:var(--radius-md)
}
@keyframes sh{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

#toast{
  position:fixed;left:50%;bottom:100px;
  transform:translateX(-50%) translateY(100px);
  background:var(--bg-3);
  border:1px solid var(--border-2);
  padding:12px 18px;border-radius:var(--radius-sm);
  z-index:9999;opacity:0;
  transition:all .3s var(--ease);
  box-shadow:var(--shadow);
  max-width:90vw;font-size:14px
}
#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0)
}
#toast.err{border-color:var(--error)}
#toast.ok{border-color:var(--success)}

#app{padding-bottom:80px;min-height:100vh}
.container{max-width:1400px;margin:0 auto;padding:16px}

.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(11,13,18,.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
  display:flex;align-items:center;gap:12px
}
.topbar .logo,
.sidebar .logo{
  display:flex;align-items:center;gap:10px;
  font-weight:900;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}
.topbar .logo{font-size:18px}
.sidebar .logo{
  font-size:21px;
  margin-bottom:20px
}
.topbar .back{
  width:40px;height:40px;
  border-radius:10px;
  display:grid;place-items:center;
  background:var(--bg-2);
  border:1px solid var(--border)
}
.spacer{flex:1}
.icon-btn{
  width:40px;height:40px;
  border-radius:10px;
  display:grid;place-items:center;
  background:var(--bg-2);
  border:1px solid var(--border);
  transition:.2s
}
.icon-btn:active{transform:scale(.94)}

.sidebar{
  display:none;
  position:fixed;left:0;top:0;bottom:0;
  width:260px;
  background:var(--bg-2);
  border-right:1px solid var(--border);
  padding:20px;
  z-index:90;
  flex-direction:column;gap:8px
}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  border-radius:var(--radius-sm);
  color:var(--text-2);
  font-weight:500;
  transition:.2s;
  border:1px solid transparent;
  cursor:pointer
}
.nav-item:hover{background:var(--bg-3);color:var(--text)}
.nav-item.active{
  background:var(--primary-soft);
  color:var(--primary-2);
  border-color:rgba(108,140,255,.3)
}
.sidebar .status{
  margin-top:auto;
  padding:12px;
  border-radius:var(--radius-sm);
  background:var(--bg-3);
  border:1px solid var(--border);
  font-size:12px;color:var(--text-3)
}
.status .dot{
  display:inline-block;
  width:8px;height:8px;
  border-radius:50%;
  background:var(--text-3);
  margin-right:6px
}
.status .dot.on{
  background:var(--success);
  box-shadow:0 0 10px rgba(52,211,153,.5)
}
.status .dot.off{background:var(--error)}

.tabbar{
  position:fixed;
  bottom:0;left:0;right:0;
  background:rgba(11,13,18,.9);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));
  z-index:99
}
.tab-item{
  flex:1;
  display:flex;flex-direction:column;
  align-items:center;gap:4px;
  font-size:11px;color:var(--text-3);
  padding:6px 0;transition:.2s
}
.tab-item.active{color:var(--primary-2)}
.tab-item svg{width:22px;height:22px}

.hero{
  position:relative;
  border-radius:var(--radius-lg);
  overflow:hidden;
  margin-bottom:24px;
  aspect-ratio:16/9;
  box-shadow:var(--shadow);
  border:1px solid var(--border)
}
.hero video{
  width:100%;height:100%;
  object-fit:cover;
  pointer-events:none;
  opacity:.55
}
.hero .overlay{
  position:absolute;inset:0;
  background:linear-gradient(
    180deg,
    transparent 30%,
    rgba(11,13,18,.96)
  );
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:20px
}
.hero h1{
  font-size:clamp(28px,6vw,52px);
  font-weight:900;
  letter-spacing:-.02em;
  background:linear-gradient(
    135deg,#fff,var(--primary-2),var(--accent)
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  margin-bottom:6px
}
.hero p{
  color:var(--text-2);
  font-size:clamp(12px,2.5vw,15px);
  max-width:650px
}

.searchbar{
  display:flex;align-items:center;gap:10px;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:12px 14px;
  margin-bottom:20px;
  transition:.2s
}
.searchbar:focus-within{
  border-color:var(--primary);
  box-shadow:0 0 0 4px var(--primary-soft)
}
.searchbar input{
  flex:1;background:none;border:0;
  outline:0;color:var(--text);
  font-size:15px
}
.searchbar input::placeholder{color:var(--text-3)}

.section-title{
  font-size:18px;font-weight:700;
  margin:24px 0 14px;
  display:flex;align-items:center;gap:10px
}
.section-title::before{
  content:"";
  width:4px;height:20px;
  background:var(--primary);
  border-radius:4px
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:14px
}
.card{
  background:var(--bg-2);
  border-radius:var(--radius-md);
  overflow:hidden;
  border:1px solid var(--border);
  transition:.25s var(--ease);
  cursor:pointer;
  position:relative
}
.card:hover{
  transform:translateY(-4px) scale(1.02);
  border-color:var(--border-2);
  box-shadow:var(--shadow)
}
.card .poster{
  aspect-ratio:2/3;
  overflow:hidden;
  background:var(--bg-3)
}
.card .poster img{
  width:100%;height:100%;
  object-fit:cover;
  transition:.4s;opacity:0
}
.card .poster img.loaded{opacity:1}
.card:hover .poster img{transform:scale(1.06)}
.card .info{padding:10px}
.card .title{
  font-size:13px;font-weight:600;
  line-height:1.3;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:34px
}
.card .meta{
  display:flex;
  justify-content:space-between;
  gap:6px;
  font-size:11px;
  color:var(--text-3);
  margin-top:6px
}
.card .score{
  color:var(--warning);
  font-weight:700
}
.card .provider{
  position:absolute;top:8px;left:8px;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(10px);
  padding:3px 8px;
  border-radius:6px;
  font-size:10px;
  font-weight:600;
  color:var(--primary-2);
  border:1px solid var(--border)
}
.card .fav{
  position:absolute;top:8px;right:8px;
  width:32px;height:32px;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  display:grid;place-items:center;
  border:1px solid var(--border);
  transition:.2s;
  font-size:14px
}
.card .fav.on{
  background:var(--accent);
  border-color:var(--accent)
}

.genre-wrap{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
  margin-bottom:8px
}
.genre-chip{
  flex:none;
  padding:8px 14px;
  border-radius:99px;
  background:var(--bg-2);
  border:1px solid var(--border);
  font-size:13px;
  color:var(--text-2);
  white-space:nowrap;
  transition:.2s
}
.genre-chip.active{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff
}

.detail-head{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:16px;
  margin-bottom:20px
}
.detail-head .poster{
  aspect-ratio:2/3;
  border-radius:var(--radius-md);
  overflow:hidden;
  background:var(--bg-3);
  border:1px solid var(--border)
}
.detail-head .poster img{
  width:100%;height:100%;object-fit:cover
}
.detail-head h1{
  font-size:clamp(18px,4vw,26px);
  font-weight:800;
  margin-bottom:6px;
  line-height:1.2
}
.detail-head .alt{
  font-size:12px;
  color:var(--text-3);
  margin-bottom:10px
}

.meta-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  font-size:12px;
  margin-bottom:12px
}
.meta-grid div{
  background:var(--bg-2);
  padding:8px 10px;
  border-radius:10px;
  border:1px solid var(--border)
}
.meta-grid b{
  display:block;
  color:var(--text-3);
  font-size:10px;
  text-transform:uppercase;
  margin-bottom:2px
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:44px;
  padding:0 18px;
  border-radius:var(--radius-sm);
  font-weight:600;
  font-size:14px;
  transition:.2s;
  border:1px solid transparent
}
.btn:active{transform:scale(.96)}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),#4A6CF7);
  color:#fff;
  box-shadow:0 8px 20px rgba(108,140,255,.3)
}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{
  background:var(--bg-2);
  border-color:var(--border);
  color:var(--text)
}
.btn-accent{
  background:var(--accent);
  color:#fff
}
.btn-wrap{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
.btn:disabled{
  opacity:.4;
  cursor:not-allowed
}

.panel{
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:16px;
  margin-bottom:16px
}
.panel h3{
  font-size:15px;
  font-weight:700;
  margin-bottom:12px
}
.synopsis{
  color:var(--text-2);
  font-size:14px;
  line-height:1.7;
  white-space:pre-line
}

.ep-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:8px;
  max-height:320px;
  overflow-y:auto;
  padding:4px
}
.ep-btn{
  aspect-ratio:16/10;
  background:var(--bg-3);
  border:1px solid var(--border);
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  transition:.2s;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px
}
.ep-btn:hover{
  border-color:var(--primary);
  color:var(--primary-2)
}
.ep-btn.active{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff
}
.ep-btn .date{
  font-size:9px;
  color:var(--text-3);
  font-weight:400
}
.ep-btn.active .date{
  color:rgba(255,255,255,.8)
}

.provider-select{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px
}
.prov-btn{
  flex:none;
  padding:10px 14px;
  border-radius:var(--radius-sm);
  background:var(--bg-2);
  border:1px solid var(--border);
  font-size:13px;
  font-weight:600;
  transition:.2s;
  color:var(--text-2)
}
.prov-btn.active{
  background:var(--primary-soft);
  border-color:var(--primary);
  color:var(--primary-2)
}
.prov-btn.off{
  opacity:.4;
  cursor:not-allowed
}

.player-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:var(--radius-md);
  overflow:hidden;
  margin-bottom:16px;
  border:1px solid var(--border)
}
.player-wrap iframe{
  width:100%;height:100%;border:0
}

.server-select{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:4px
}
.quality-row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap
}
.quality-label{
  font-size:12px;
  font-weight:700;
  color:var(--text-3);
  min-width:70px
}
.server-btn{
  padding:8px 12px;
  border-radius:8px;
  background:var(--bg-3);
  border:1px solid var(--border);
  font-size:12px;
  font-weight:500;
  transition:.2s
}
.server-btn:hover{
  border-color:var(--primary)
}
.server-btn.active{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff
}
.server-btn.loading{
  opacity:.5;
  pointer-events:none
}

.state{
  text-align:center;
  padding:60px 20px;
  color:var(--text-3)
}
.state .ic{
  font-size:48px;
  margin-bottom:12px;
  opacity:.5
}
.state h3{
  color:var(--text);
  margin-bottom:6px
}
.state button{margin-top:16px}

.api-note{
  font-size:11px;
  color:var(--text-3);
  margin-top:10px;
  word-break:break-all
}

@media(min-width:900px){
  .sidebar{display:flex}
  #app{
    padding-left:260px;
    padding-bottom:30px
  }
  .tabbar{display:none}
  .topbar{display:none}
  .container{padding:24px 30px}
  .grid{
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:18px
  }
  .detail-head{
    grid-template-columns:220px 1fr;
    gap:24px
  }
}

/*

  Quick Tunnel Cloudflare lu saat ini:

  CATATAN:

*/
const API_BASE_URL =
  "https://enables-steel-relates-temporarily.trycloudflare.com";


/* ==========================================================
   PROVIDER

const PROVIDERS = {

  },

  },

    searchable: false
  }
};


/* ==========================================================
   CONSTANTS
   ========================================================== */

const LS_FAV = "nanime_fav";
const LS_HIST = "nanime_hist";

const GENRES = [

   Dipakai supaya Home tidak menggunakan ID palsu.

const FEATURED = [

/* ==========================================================
   DOM
   ========================================================== */

const $ = selector => document.querySelector(selector);

const $$ = selector =>
  [...document.querySelectorAll(selector)];


/* ==========================================================
   UTILS
   ========================================================== */

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function safeJSON(value) {
  return JSON.stringify(value)
    .replaceAll("&", "\\u0026")
    .replaceAll("<", "\\u003c")
    .replaceAll(">", "\\u003e");
}

function toast(message, type = "info") {
  const el = $("#toast");

  el.textContent = message;
  el.className = `show ${type}`;

  clearTimeout(el._timer);

  el._timer = setTimeout(() => {
    el.className = "";
  }, 3200);
}

function cleanText(value) {
  return String(value ?? "")
    .replace(/\s+/g, " ")
    .trim();
}


/* ==========================================================
   FETCHER
   ========================================================== */

async function fetcher(endpoint, options = {}) {
  const url =
    `${API_BASE_URL}${endpoint}`;

  const controller =
    new AbortController();

  const timer =
    setTimeout(() => controller.abort(), 20000);

  try {
    const response =
      await fetch(url, {
        ...options,
        signal: controller.signal,
        headers: {
          Accept: "application/json",
          ...(options.headers || {})
        }
      });

    clearTimeout(timer);

    const text =
      await response.text();

    if (!response.ok) {
      if (response.status === 403) {
        throw new Error(
          "API ditolak (403)"
        );
      }

      if (response.status === 404) {
        throw new Error(
          "Endpoint tidak ditemukan (404)"
        );
      }

      throw new Error(
        `HTTP ${response.status}`
      );
    }

    try {
      return JSON.parse(text);
    } catch {
      throw new Error(
        "API mengirim response bukan JSON. Tunnel mungkin error atau stale."
      );
    }

  } catch (error) {
    clearTimeout(timer);

    if (error.name === "AbortError") {
      throw new Error(
        "Request terlalu lama. Cloudflare Quick Tunnel mungkin sedang tidak stabil."
      );
    }

    throw new Error(
      error.message ||
      "API tidak tersedia"
    );
  }
}


/* ==========================================================
   IMAGE
   ========================================================== */

function imgLoad(img) {
  const src = img.dataset.src;

  if (!src) return;

  img.src = src;

  img.onload = () => {
    img.classList.add("loaded");
  };

  img.onerror = () => {
    img.removeAttribute("src");
    img.style.opacity = "0";
  };
}

function lazyImg() {

  if (!("IntersectionObserver" in window)) {
    $$("img[data-src]").forEach(imgLoad);
    return;
  }

  const observer =
    new IntersectionObserver(
      entries => {
        entries.forEach(entry => {

          if (!entry.isIntersecting) return;

          imgLoad(entry.target);
          observer.unobserve(entry.target);

        });
      },
      {
        rootMargin: "250px"
      }
    );

/* ==========================================================
   LOCAL STORAGE
   ========================================================== */

function readStorage(key) {
  try {
    return JSON.parse(
      localStorage.getItem(key) || "[]"
    );
  } catch {
    return [];
  }
}

function isFav(id, provider) {
  return readStorage(LS_FAV)
    .some(
      item =>
        item.id === id &&
        item.provider === provider
    );
}

function favToggle(anime) {

  let favorites =
    readStorage(LS_FAV);

  const index =
    favorites.findIndex(
      item =>
        item.id === anime.id &&
        item.provider === anime.provider
    );

  if (index !== -1) {

    favorites.splice(index, 1);
    toast("Dihapus dari favorit");

  } else {

    favorites.unshift(anime);

    toast(
      "Ditambahkan ke favorit",
      "ok"
    );
  }

  localStorage.setItem(
    LS_FAV,
    JSON.stringify(favorites)
  );

  renderNav();
}

function addHistory(anime, episode) {

  let history =
    readStorage(LS_HIST);

  history =
    history.filter(
      item =>
        !(
          item.id === anime.id &&
          item.provider === anime.provider
        )
    );

  history.unshift({
    ...anime,
    episode,
    at: Date.now()
  });

  localStorage.setItem(
    LS_HIST,
    JSON.stringify(history.slice(0, 50))
  );

  renderNav();
}

/* ==========================================================
   API ADAPTER
   ========================================================== */

const API = {

  /*
    Search:
    Kuramanime sengaja tidak dipanggil karena router Wajik
    memang tidak mempunyai /kuramanime/search.
  */
  async searchAll(query) {

    const providers =
      Object.entries(PROVIDERS)
        .filter(
          ([, provider]) =>
            provider.active &&
            provider.searchable
        )
        .map(([name]) => name);

    const results =
      await Promise.all(
        providers.map(
          async provider => {

            try {

              let endpoint = "";

              if (provider === "otakudesu") {

                endpoint =
                  `/otakudesu/search?q=${encodeURIComponent(query)}`;

              } else if (provider === "oploverz") {

                endpoint =
                  `/oploverz/search?q=${encodeURIComponent(query)}`;

              }

              const response =
                await fetcher(endpoint);

              const list =
                response?.data?.animeList || [];

              if (
                provider === "otakudesu"
              ) {
                return list.map(
                  normalizeOtakudesuSearch
                );
              }

              if (
                provider === "oploverz"
              ) {
                return list.map(
                  normalizeOploverzSearch
                );
              }

              return [];

            } catch {

              return [];

            }
          }
        )
      );

    return results.flat();
  },


  /*
    Anime detail
  */
  async detail(provider, id, slug = "") {

    let endpoint = "";

    if (
      provider === "otakudesu"
    ) {

      endpoint =
        `/otakudesu/anime/${encodeURIComponent(id)}`;

    } else if (
      provider === "oploverz"
    ) {

      endpoint =
        `/oploverz/anime/${encodeURIComponent(id)}`;

    } else if (
      provider === "kuramanime"
    ) {

      endpoint =
        `/kuramanime/anime/${encodeURIComponent(id)}/${encodeURIComponent(slug || id)}`;

    } else {

      throw new Error(
        "Provider tidak didukung"
      );
    }

    const response =
      await fetcher(endpoint);

    const details =
      response?.data?.details;

    if (!details) {
      throw new Error(
        "Data anime tidak ditemukan"
      );
    }

    if (
      provider === "otakudesu"
    ) {

      return normalizeOtakudesuDetail(
        details,
        id
      );

    }

    if (
      provider === "oploverz"
    ) {

      return normalizeOploverzDetail(
        details,
        id
      );

    }

    return normalizeKuramanimeDetail(
      details,
      id,
      slug
    );
  },


  /*
    Episode detail
  */
  async episode(provider, params) {

    let endpoint = "";

    if (
      provider === "otakudesu"
    ) {

      /*
        Wajik:
        /otakudesu/episode/:episodeId
      */
      endpoint =
        `/otakudesu/episode/${encodeURIComponent(params.episodeId)}`;

    } else if (
      provider === "oploverz"
    ) {

      /*
        Wajik:
        /oploverz/episode/:episodeId

        Yang dipakai di data Oploverz:
        episode slug dari URL episode.
      */
      endpoint =
        `/oploverz/episode/${encodeURIComponent(
          params.episodeSlug || params.episodeId
        )}`;

    } else if (
      provider === "kuramanime"
    ) {

      /*
        Wajik:
        /kuramanime/episode/:animeId/:animeSlug/:episodeId
      */
      endpoint =
        `/kuramanime/episode/${encodeURIComponent(params.animeId)}/${encodeURIComponent(params.animeSlug)}/${encodeURIComponent(params.episodeId)}`;

    } else {

      throw new Error(
        "Provider tidak didukung"
      );
    }

    const response =
      await fetcher(endpoint);

    const details =
      response?.data?.details;

    if (!details) {
      throw new Error(
        "Data episode tidak ditemukan"
      );
    }

    /*
      OTakudesu:
      defaultStreamingUrl
      server.qualityList[]
    */
    if (
      provider === "otakudesu"
    ) {

      const qualities =
        Array.isArray(
          details.server?.qualityList
        )
          ? details.server.qualityList.map(
              quality => ({
                title:
                  cleanText(
                    quality.title
                  ),

                servers:
                  Array.isArray(
                    quality.serverList
                  )
                    ? quality.serverList.map(
                        server => ({
                          name:
                            server.title,

                          id:
                            server.serverId
                        })
                      )
                    : []
              })
            )
          : [];

      return {
        provider,

        title:
          details.title ||
          `Episode ${params.episode}`,

        playerUrl:
          details.defaultStreamingUrl ||
          "",

        qualities,

        hasPrevEpisode:
          !!details.hasPrevEpisode,

        hasNextEpisode:
          !!details.hasNextEpisode
      };
    }


    /*
      Oploverz:
      streamingUrl
    */
    if (
      provider === "oploverz"
    ) {

      return {
        provider,

        title:
          details.title ||
          `Episode ${params.episode}`,

        playerUrl:
          details.streamingUrl ||
          "",

        qualities: [],

        hasPrevEpisode:
          !!details.hasPrevEpisode,

        hasNextEpisode:
          !!details.hasNextEpisode
      };
    }


    /*
      Kuramanime:
      server.qualityList bisa kosong.
    */
    if (
      provider === "kuramanime"
    ) {

      return {
        provider,

        title:
          details.episodeTitle ||
          details.title ||
          `Episode ${params.episode}`,

        playerUrl:
          "",

        qualities:
          Array.isArray(
            details.server?.qualityList
          )
            ? details.server.qualityList
            : [],

        hasPrevEpisode:
          !!details.hasPrevEpisode,

        hasNextEpisode:
          !!details.hasNextEpisode
      };
    }

    throw new Error(
      "Episode parser tidak tersedia"
    );
  },


  /*
    Resolver Otakudesu server.

    Wajik:
    GET /otakudesu/server/:serverId

    Hasil:
    {
      data: {
        url: "..."
      }
    }
  */
  async resolveServer(serverId) {

    const response =
      await fetcher(
        `/otakudesu/server/${encodeURIComponent(serverId)}`
      );

    return response?.data?.url || "";
  }
};

function cardHTML(anime) {

  const providerName =
    PROVIDERS[anime.provider]?.name ||
    anime.provider;

  return `

    <article
      class="card"
      data-card='${escapeHTML(
        JSON.stringify(anime)
      )}'
    >

      <div class="poster">

        <img
          data-src="${escapeHTML(anime.poster)}"
          alt="${escapeHTML(anime.title)}"
        >

      </div>

      <div class="provider">
        ${escapeHTML(providerName)}
      </div>

      <button
        class="fav ${
          isFav(
            anime.id,
            anime.provider
          )
            ? "on"
            : ""
        }"
        data-fav
        aria-label="Favorit"
      >
        ${
          isFav(
            anime.id,
            anime.provider
          )
            ? "♥"
            : "♡"
        }
      </button>

      <div class="info">

        <div class="title">
          ${escapeHTML(anime.title)}
        </div>

        <div class="meta">

          <span>
            ${escapeHTML(
              anime.year !== "-"
                ? anime.year
                : anime.type || ""
            )}
          </span>

          <span class="score">
            ★ ${escapeHTML(
              anime.score || "-"
            )}
          </span>

        </div>

      </div>

    </article>
  `;
}


function bindCards() {

  $$(".card[data-card]")
    .forEach(card => {

      const anime =
        JSON.parse(
          card.dataset.card
        );

      card.addEventListener(
        "click",
        event => {

          if (
            event.target.closest("[data-fav]")
          ) {
            return;
          }

          router.navigate(
            "detail",
            {
              provider:
                anime.provider,

              id:
                anime.id,

              slug:
                anime.slug || ""
            }
          );
        }
      );

      const favorite =
        card.querySelector("[data-fav]");

      favorite?.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          favToggle(anime);

          favorite.classList.toggle(
            "on",
            isFav(
              anime.id,
              anime.provider
            )
          );

          favorite.textContent =
            isFav(
              anime.id,
              anime.provider
            )
              ? "♥"
              : "♡";
        }
      );
    });
}

  /* ---------------- PLAYER ---------------- */

  async player(params) {

    $("#view").innerHTML = `

      <div
        class="sk"
        style="
          aspect-ratio:16/9;
          margin-bottom:16px
        "
      ></div>

      <div
        class="sk"
        style="
          height:110px;
          margin-bottom:16px
        "
      ></div>

    `;


    try {

      addHistory(
        {
          id:
            params.id,

          slug:
            params.slug,

          provider:
            params.provider,

          title:
            params.title,

          poster:
            params.poster,

          score:
            params.score,

          year:
            params.year,

          type:
            params.type
        },
        params.episode
      );


      const stream =
        await API.episode(
          params.provider,
          params
        );


      let currentPlayerUrl =
        stream.playerUrl ||
        "";


      /*
        Cari prev / next dari episodeList
        karena Wajik memberi daftar episode.
      */
      const episodes =
        Array.isArray(
          params.episodeList
        )
          ? params.episodeList
          : [];


      const currentIndex =
        episodes.findIndex(
          item =>
            String(item.num) ===
            String(params.episode)
        );


      const prevEpisode =
        currentIndex > 0
          ? episodes[currentIndex - 1]
          : null;


      const nextEpisode =
        currentIndex !== -1 &&
        currentIndex <
          episodes.length - 1
          ? episodes[currentIndex + 1]
          : null;


      $("#view").innerHTML = `

        <h2
          style="
            font-size:18px;
            margin-bottom:12px;
            font-weight:800
          "
        >
          ${escapeHTML(
            params.title
          )}
          · Episode
          ${escapeHTML(
            params.episode
          )}
        </h2>


        <div class="player-wrap">

          ${
            currentPlayerUrl

              ? `
                <iframe
                  id="playerFrame"
                  src="${escapeHTML(
                    currentPlayerUrl
                  )}"
                  allowfullscreen
                  referrerpolicy="no-referrer"
                  loading="eager"
                ></iframe>
              `

              : `
                <div
                  class="state"
                  style="
                    height:100%;
                    padding:30px;
                    display:grid;
                    place-items:center
                  "
                >

                  <div>

                    <div class="ic">
                      🎬
                    </div>

                    <h3>
                      Player tidak tersedia
                    </h3>

                    <p>
                      Provider ini tidak
                      memberikan URL player
                      pada episode ini.
                    </p>

                  </div>

                </div>
              `
          }

        </div>


        <div
          class="btn-wrap"
          style="margin-bottom:16px"
        >

          ${
            prevEpisode

              ? `
                <button
                  class="btn btn-ghost"
                  id="prevBtn"
                >
                  ← Prev
                </button>
              `

              : `
                <button
                  class="btn btn-ghost"
                  disabled
                >
                  ← Prev
                </button>
              `
          }


          <button
            class="btn btn-ghost"
            id="episodesBtn"
          >
            📋 Episode
          </button>


          ${
            nextEpisode

              ? `
                <button
                  class="btn btn-primary"
                  id="nextBtn"
                >
                  Next →
                </button>
              `

              : `
                <button
                  class="btn btn-ghost"
                  disabled
                >
                  Next →
                </button>
              `
          }

        </div>


        ${
          stream.qualities.length

            ? `
              <div class="panel">

                <h3>
                  🎞️ Kualitas & Server
                </h3>

                <div class="server-select">

                  ${stream.qualities
                    .map(
                      quality => `

                        <div class="quality-row">

                          <span class="quality-label">
                            ${escapeHTML(
                              quality.title
                            )}
                          </span>

                          ${
                            quality.servers
                              .map(
                                (server, index) => `

                                  <button
                                    class="server-btn ${
                                      index === 0 &&
                                      quality ===
                                      stream.qualities[0]
                                        ? "active"
                                        : ""
                                    }"
                                    data-server-id="${escapeHTML(
                                      server.id
                                    )}"
                                  >
                                    ${escapeHTML(
                                      server.name
                                    )}
                                  </button>

                                `
                              )
                              .join("")
                          }

                        </div>

                      `
                    )
                    .join("")}

                </div>

              </div>
            `

            : `
              <div class="panel">

                <h3>
                  🎞️ Server
                </h3>

                <p
                  style="
                    color:var(--text-3);
                    font-size:13px
                  "
                >
                  ${
                    params.provider ===
                    "kuramanime"

                      ? "Episode ini tidak memiliki server streaming yang dikembalikan API."
                      : "Provider menggunakan URL player langsung."
                  }
                </p>

              </div>
            `
        }


        ${
          episodes.length

            ? `
              <div class="panel">

                <h3>
                  📺 Episode Lainnya
                </h3>

                <div class="ep-list">

                  ${episodes
                    .map(
                      episode => `

                        <button
                          class="ep-btn ${
                            String(
                              episode.num
                            ) ===
                            String(
                              params.episode
                            )
                              ? "active"
                              : ""
                          }"
                          data-player-episode='${escapeHTML(
                            JSON.stringify(
                              episode
                            )
                          )}'
                        >

                          ${escapeHTML(
                            episode.num
                          )}

                          ${
                            episode.date

                              ? `
                                <span class="date">
                                  ${escapeHTML(
                                    episode.date
                                  )}
                                </span>
                              `

                              : ""
                          }

                        </button>

                      `
                    )
                    .join("")}

                </div>

              </div>
            `

            : ""
        }


      `;


      /*
        PREV
      */
      $("#prevBtn")
        ?.addEventListener(
          "click",
          () => {

            router.navigate(
              "player",
              {
                ...params,

                episode:
                  prevEpisode.num,

                episodeId:
                  prevEpisode.id,

                episodeSlug:
                  prevEpisode.slug
              }
            );

          }
        );


      /*
        NEXT
      */
      $("#nextBtn")
        ?.addEventListener(
          "click",
          () => {

            router.navigate(
              "player",
              {
                ...params,

                episode:
                  nextEpisode.num,

                episodeId:
                  nextEpisode.id,

                episodeSlug:
                  nextEpisode.slug
              }
            );

          }
        );


      /*
        EPISODE LIST
      */
      $$("[data-player-episode]")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              const episode =
                JSON.parse(
                  button.dataset.playerEpisode
                );

              router.navigate(
                "player",
                {
                  ...params,

                  episode:
                    episode.num,

                  episodeId:
                    episode.id,

                  episodeSlug:
                    episode.slug
                }
              );

            }
          );

        });


      /*
        SERVER SWITCH

        Hanya Otakudesu yang memiliki
        endpoint /server/:serverId.
      */
      $$("[data-server-id]")
        .forEach(button => {

          button.addEventListener(
            "click",
            async () => {

              const serverId =
                button.dataset.serverId;

              if (!serverId) {
                toast(
                  "Server ID kosong.",
                  "err"
                );
                return;
              }


              $$(".server-btn")
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );

              button.classList.add(
                "loading"
              );


              try {

                if (
                  params.provider !==
                  "otakudesu"
                ) {

                  toast(
                    "Resolver server hanya tersedia untuk Otakudesu.",
                    "err"
                  );

                  return;
                }


                const url =
                  await API.resolveServer(
                    serverId
                  );


                if (!url) {

                  throw new Error(
                    "Resolver tidak mengembalikan URL player."
                  );

                }


                currentPlayerUrl =
                  url;


                const iframe =
                  $("#playerFrame");

                if (!iframe) {
                  throw new Error(
                    "Player iframe tidak ditemukan."
                  );
                }


                iframe.src =
                  currentPlayerUrl;


                button.classList.remove(
                  "loading"
                );

                button.classList.add(
                  "active"
                );


              } catch (error) {

                button.classList.remove(
                  "loading"
                );

                toast(
                  error.message,
                  "err"
                );

              }

            }
          );

        });


    } catch (error) {

      $("#view").innerHTML = `

        <div class="state">

          <div class="ic">
            ⚠️
          </div>

          <h3>
            Stream gagal dimuat
          </h3>

          <p>
            ${escapeHTML(
              error.message
            )}
          </p>


          <div
            class="btn-wrap"
            style="
              justify-content:center;
              margin-top:16px
            "
          >

            <button
              class="btn btn-primary"
              id="retryPlayer"
            >
              🔄 Coba Lagi
            </button>

            <button
              class="btn btn-ghost"
              id="backDetail"
            >
              ← Kembali
            </button>

          </div>

        </div>

      `;


      $("#retryPlayer")
        .onclick = () =>
          pages.player(params);


      $("#backDetail")
        .onclick = () =>
          router.navigate(
            "detail",
            {
              provider:
                params.provider,

              id:
                params.animeId ||
                params.id,

              slug:
                params.animeSlug ||
                params.slug ||
                ""
            }
          );

    }

  }

};


/* ==========================================================
   ROUTER
   ========================================================== */

const router = {

  stack: [],

  current: null,


  async navigate(
    page,
    params = {}
  ) {

    if (this.current) {
      this.stack.push(
        this.current
      );
    }

    await this.render(
      page,
      params
    );

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  },


  async back() {

    const previous =
      this.stack.pop();

    if (!previous) {

      await this.render(
        "home"
      );

    } else {

      await this.render(
        previous.page,
        previous.params
      );

    }

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  },


  async render(
    page,
    params = {}
  ) {

    this.current = {
      page,
      params
    };

    renderNav();

    const renderFunction =
      pages[page];

    if (!renderFunction) {

      return pages.home();

    }

    try {

      await renderFunction(
        params
      );

    } catch (error) {

      $("#view").innerHTML = `

        <div class="state">

          <div class="ic">
            ❌
          </div>

          <h3>
            Terjadi kesalahan
          </h3>

          <p>
            ${escapeHTML(
              error.message
            )}
          </p>

          <button
            class="btn btn-primary"
            id="goHome"
          >
            ← Ke Home
          </button>

        </div>

      `;

      $("#goHome").onclick =
        () =>
          this.navigate("home");
    }
  }
};


/* ==========================================================
   GLOBAL EVENTS
   ========================================================== */

$("#backBtn")
  .addEventListener(
    "click",
    () => router.back()
  );

$("#topSearchBtn")
  .addEventListener(
    "click",
    () => router.navigate("search")
  );


/* ==========================================================
   START
   ========================================================== */

renderNav();

router.render(
  "home"
);
