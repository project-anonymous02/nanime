<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<meta name="color-scheme" content="dark">
<title>Nanime — Premium Anime Streaming</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/sora/index.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#05060A;--bg2:#0A0C12;--panel:#0E1018;--panel2:#141720;--panel3:#1A1E2A;
--txt:#F0F3FA;--mut:#8E98AC;--dim:#5C6578;
--acc:#4C8DFF;--acc2:#7DB4FF;--acc-soft:rgba(76,141,255,.12);
--love:#FF3B5C;--ok:#30D158;--warn:#FF9F0A;--err:#FF453A;
--grad:linear-gradient(130deg,#fff 0%,#D8E7FF 38%,#4C8DFF 78%,#2E6BE6 100%);
--grad2:linear-gradient(135deg,#4C8DFF,#8AB6FF);
--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
--glass:linear-gradient(168deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
--sh1:0 2px 10px rgba(0,0,0,.4);
--sh2:0 20px 48px -20px rgba(0,0,0,.9);
--sh3:0 34px 80px -28px rgba(0,0,0,.95);
--r1:12px;--r2:16px;--r3:20px;--r4:26px;--r5:32px;
--ease:cubic-bezier(.22,.61,.36,1);--spring:cubic-bezier(.34,1.42,.5,1);
--side-w:250px;--top-h:58px;--nav-h:64px;
--maxw:1440px;
}
html{scroll-behavior:smooth;background:var(--bg)}
body{
min-height:100dvh;overflow-x:hidden;color:var(--txt);background:var(--bg);
font-family:'Inter Variable',Inter,-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
font-size:15px;line-height:1.5;letter-spacing:-.01em;
-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{font-family:'Sora Variable',Sora,'Inter Variable',sans-serif;letter-spacing:-.03em;margin:0}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16);background-clip:content-box}
:focus-visible{outline:2px solid var(--acc2);outline-offset:3px;border-radius:10px}

#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg::before{content:"";position:absolute;inset:0;background:
radial-gradient(120% 80% at 12% -10%,rgba(46,107,230,.12),transparent 58%),
radial-gradient(90% 70% at 92% 4%,rgba(120,90,255,.07),transparent 60%),
radial-gradient(120% 90% at 50% 110%,rgba(20,60,140,.08),transparent 62%),
linear-gradient(180deg,#05060A,#07080C 45%,#05060A)}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 26s var(--ease) infinite alternate}
.orb.a{width:520px;height:520px;left:-160px;top:-120px;background:radial-gradient(circle,rgba(62,123,250,.25),transparent 70%)}
.orb.b{width:460px;height:460px;right:-140px;top:18%;background:radial-gradient(circle,rgba(140,90,255,.14),transparent 70%);animation-delay:-8s}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(40px,60px,0) scale(1.12)}}

.topgrad{height:3px;position:fixed;left:0;top:0;z-index:400;width:0;background:var(--grad2);box-shadow:0 0 14px rgba(76,141,255,.9);transition:width .3s var(--ease),opacity .3s;opacity:0}
.topgrad.on{opacity:1}

#app{position:relative;z-index:1;min-height:100dvh}
.shell{max-width:var(--maxw);margin:0 auto;padding:0 18px}

#topbar{
position:sticky;top:0;z-index:60;height:var(--top-h);display:flex;align-items:center;gap:12px;
padding:0 14px;background:rgba(8,9,12,.72);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
border-bottom:1px solid var(--line);
}
.tb-logo{display:flex;align-items:center;gap:9px;font-family:'Sora Variable',sans-serif;font-weight:700;letter-spacing:-.03em}
.tb-logo img{width:30px;height:30px;border-radius:9px;object-fit:cover;border:1px solid var(--line2)}
.tb-logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:16px}
.spacer{flex:1}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--mut);transition:.24s var(--ease);position:relative;overflow:hidden}
.ibtn:hover{color:#fff;background:rgba(255,255,255,.06)}
.ibtn:active{transform:scale(.88);background:rgba(255,255,255,.1)}
.ibtn svg{width:19px;height:19px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px rgba(48,209,88,.6)}
.dot.off{background:var(--err)}
.dot.idle{background:var(--warn)}

#sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--side-w);z-index:70;display:none;flex-direction:column;padding:22px 16px 16px;background:linear-gradient(180deg,rgba(13,15,18,.88),rgba(8,9,12,.92));backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border-right:1px solid var(--line)}
.sb-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 24px}
.sb-brand .lbox{width:42px;height:42px;border-radius:13px;overflow:hidden;flex:none;border:1px solid var(--line2);box-shadow:var(--sh1),inset 0 1px 0 rgba(255,255,255,.12)}
.sb-brand .lbox img{width:100%;height:100%;object-fit:cover}
.sb-brand .wm{font-family:'Sora Variable',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sb-brand .sub{font-size:10px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:-2px}
.sb-nav{display:flex;flex-direction:column;gap:4px}
.sb-link{position:relative;display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:14px;color:var(--mut);font-weight:550;font-size:14.5px;transition:.28s var(--ease);overflow:hidden}
.sb-link svg{width:20px;height:20px;flex:none;transition:.28s var(--spring)}
.sb-link:hover{color:#fff}
.sb-link.active{color:#fff}
.sb-link.active::before{content:"";position:absolute;inset:0;border-radius:14px;background:linear-gradient(100deg,rgba(76,141,255,.18),rgba(76,141,255,.04));box-shadow:inset 0 0 0 1px rgba(125,180,255,.18)}
.sb-link.active svg{color:var(--acc2)}
.sb-foot{margin-top:auto}
.sb-status{padding:12px 13px;border-radius:15px;background:var(--glass);border:1px solid var(--line);font-size:12px;margin-bottom:10px}
.sb-status .row{display:flex;align-items:center;gap:8px;color:var(--mut)}
.sb-status b{color:var(--txt);font-weight:600}

#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:80;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:stretch;background:rgba(8,9,12,.78);backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);border-top:1px solid var(--line)}
#tabbar::before{content:"";position:absolute;top:-24px;left:0;right:0;height:24px;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(5,6,10,.5))}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);transition:color .3s var(--ease)}
.tab svg{width:22px;height:22px;transition:.42s var(--spring)}
.tab span{font-size:10.5px;font-weight:600;letter-spacing:.01em}
.tab .ind{position:absolute;top:6px;width:34px;height:34px;border-radius:12px;background:var(--acc-soft);opacity:0;transform:scale(.5);transition:.42s var(--spring);z-index:-1}
.tab.active{color:#fff}
.tab.active .ind{opacity:1;transform:scale(1)}
.tab.active svg{color:var(--acc2);transform:translateY(-1px) scale(1.06)}
.tab:active svg{transform:scale(.82)}
.tab .badge{position:absolute;top:5px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--love);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 3px 10px -3px rgba(255,59,92,.8)}

#view{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 26px);min-height:60dvh}
main.anim-in{animation:viewIn .42s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(12px) scale(.995);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}

.rv{opacity:0;transform:translateY(16px);transition:opacity .55s var(--ease),transform .55s var(--ease);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.rv-s{opacity:0;transform:scale(.94);transition:opacity .45s var(--ease),transform .55s var(--spring);transition-delay:var(--d,0ms)}
.rv-s.in{opacity:1;transform:none}

.hero{position:relative;margin:18px 0 8px;border-radius:var(--r5);overflow:hidden;background:var(--glass);border:1px solid var(--line);box-shadow:var(--sh3);padding:30px 20px 26px;animation:heroIn .8s var(--ease) both}
@keyframes heroIn{from{opacity:0;transform:translateY(22px) scale(.985);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 100% at 50% -20%,rgba(76,141,255,.16),transparent 62%),radial-gradient(50% 60% at 10% 110%,rgba(140,90,255,.08),transparent 70%);pointer-events:none}
.hero-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:0}
.logo-wrap{position:relative;width:96px;height:96px;border-radius:26px;padding:4px;background:linear-gradient(150deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 40%,rgba(125,180,255,.16));box-shadow:0 18px 44px -18px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.2);animation:logoIn .9s var(--spring) .12s both;transition:.5s var(--spring)}
@keyframes logoIn{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
.logo-wrap::after{content:"";position:absolute;inset:-14px;border-radius:38px;z-index:-1;background:radial-gradient(circle,rgba(76,141,255,.3),transparent 68%);filter:blur(16px);opacity:.7;animation:breathe 5.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45;transform:scale(.95)}50%{opacity:.8;transform:scale(1.06)}}
.logo-inner{width:100%;height:100%;border-radius:22px;overflow:hidden;background:#0A0C11;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.logo-inner img{width:100%;height:100%;object-fit:cover;transition:.6s var(--spring)}
.logo-wrap:hover{transform:translateY(-4px) scale(1.045) rotate(1.5deg)}
.logo-wrap:hover .logo-inner img{transform:scale(1.09)}
.hero-title{margin-top:16px;font-family:'Sora Variable',sans-serif;font-weight:800;line-height:1;font-size:clamp(36px,9vw,62px);letter-spacing:-.05em;text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;animation:titleIn .9s var(--ease) .2s both}
@keyframes titleIn{from{opacity:0;transform:translateY(14px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.hero-tag{margin:10px auto 0;max-width:440px;text-align:center;color:var(--mut);font-size:13.5px;animation:titleIn .9s var(--ease) .32s both}
.hero-tag b{color:#cfe0ff;font-weight:600}
.hero-cta{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center;animation:titleIn .9s var(--ease) .4s both}

.dash{position:relative;width:100%;max-width:980px;margin:24px auto 0;aspect-ratio:16/9;border-radius:var(--r2);overflow:hidden;background:#07080C;border:1px solid rgba(255,255,255,.11);box-shadow:0 30px 80px -30px rgba(0,0,0,.95),0 0 0 1px rgba(76,141,255,.10),0 0 70px -28px rgba(76,141,255,.42);animation:dashIn 1s var(--ease) .46s both}
@keyframes dashIn{from{opacity:0;transform:translateY(28px) scale(.965);filter:blur(16px)}to{opacity:1;transform:none;filter:blur(0)}}
.dash video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none;-webkit-user-select:none}
.dash .shine{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.dash .shine::before{content:"";position:absolute;top:-60%;left:-70%;width:52%;height:220%;transform:rotate(16deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.055),transparent);animation:shine 7.5s var(--ease) infinite 1.6s}
@keyframes shine{0%{left:-70%}55%,100%{left:130%}}
.dash-badge{position:absolute;left:14px;top:14px;z-index:2;display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;font-size:11px;font-weight:650;letter-spacing:.04em;color:#dce7ff;background:rgba(8,10,16,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);pointer-events:none}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:14px;font-size:13.5px;font-weight:620;letter-spacing:-.01em;border:1px solid var(--line2);color:var(--txt);background:var(--glass);overflow:hidden;transition:transform .2s var(--spring),background .25s var(--ease),border-color .25s var(--ease),box-shadow .3s var(--ease);white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22);box-shadow:var(--sh2)}
.btn:active{transform:scale(.94);transition:transform .1s}
.btn.primary{background:linear-gradient(135deg,#4C8DFF,#2E6BE6);border-color:transparent;color:#fff;box-shadow:0 12px 30px -12px rgba(76,141,255,.7),inset 0 1px 0 rgba(255,255,255,.24)}
.btn.primary:hover{box-shadow:0 18px 42px -14px rgba(76,141,255,.85),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.ghost{background:rgba(255,255,255,.03)}
.btn.sm{height:34px;padding:0 13px;border-radius:11px;font-size:12.5px}
.btn.danger{border-color:rgba(255,59,92,.3);color:#ffb4ba;background:rgba(255,59,92,.08)}
.btn[disabled]{opacity:.4;pointer-events:none}

.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:99px;font-size:12.8px;font-weight:560;color:var(--mut);background:rgba(255,255,255,.035);border:1px solid var(--line);transition:.28s var(--ease);white-space:nowrap}
.chip:hover{color:#fff;border-color:var(--line2);background:rgba(255,255,255,.07);transform:translateY(-1px)}
.chip:active{transform:scale(.94)}
.chip.on{color:#fff;background:linear-gradient(120deg,rgba(76,141,255,.26),rgba(76,141,255,.1));border-color:rgba(125,180,255,.38);box-shadow:0 6px 22px -10px rgba(76,141,255,.8)}

.sec{margin:32px 0 0}
.sec-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.sec-head .t{flex:1;min-width:0}
.sec-head h2{font-size:clamp(17px,2.5vw,21px);font-weight:700;display:flex;align-items:center;gap:9px}
.sec-head h2 .bar{width:3px;height:17px;border-radius:2px;background:var(--grad2);box-shadow:0 0 12px rgba(76,141,255,.7)}
.sec-head p{margin:3px 0 0;font-size:12.4px;color:var(--dim)}
.link-more{font-size:12.5px;color:var(--acc2);font-weight:600;display:inline-flex;align-items:center;gap:4px;transition:.24s}
.link-more:hover{gap:8px;color:#fff}
.link-more svg{width:14px;height:14px}

.rail{position:relative;margin:0 -18px;padding:4px 18px 8px}
.rail-track{display:flex;gap:13px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:6px 2px 12px}
.rail-track::-webkit-scrollbar{display:none}
.rail-track>*{scroll-snap-align:start;flex:none}
.rail::before,.rail::after{content:"";position:absolute;top:0;bottom:8px;width:26px;z-index:3;pointer-events:none;transition:.3s}
.rail::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.rail::after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
.rail.s-start::before,.rail.e-end::after{opacity:0}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}

.card{position:relative;display:block;border-radius:var(--r3);overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:.42s var(--ease);will-change:transform}
.card.g{width:100%}
.card:hover{transform:translateY(-6px) scale(1.018);border-color:var(--line2);box-shadow:var(--sh3),0 0 0 1px rgba(125,180,255,.12)}
.card:active{transform:translateY(-2px) scale(.985);transition:transform .1s}
.card .poster{position:relative;aspect-ratio:2/3;overflow:hidden;background:linear-gradient(150deg,#141922,#0A0C11)}
.card .poster img{width:100%;height:100%;object-fit:cover;transition:.7s var(--ease);opacity:0;transform:scale(1.05)}
.card .poster img.ld{opacity:1;transform:scale(1)}
.card:hover .poster img{transform:scale(1.06)}
.card .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,10,.04) 32%,rgba(5,6,10,.58) 68%,rgba(5,6,10,.92));opacity:.86;transition:.4s var(--ease)}
.card:hover .veil{opacity:1}
.card .body{position:absolute;left:0;right:0;bottom:0;padding:11px 12px 12px;transform:translateY(5px);transition:.4s var(--ease)}
.card:hover .body{transform:none}
.card .nm{font-size:13px;font-weight:640;line-height:1.32;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.card .meta{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:10.6px;color:#a7b3c6;opacity:0;transform:translateY(5px);transition:.4s var(--ease) .04s}
.card:hover .meta{opacity:1;transform:none}
.card .meta i{width:3px;height:3px;border-radius:50%;background:#5d6a7d;font-style:normal}

.badge{position:absolute;left:9px;top:9px;z-index:2;padding:4px 8px;border-radius:8px;font-size:10px;font-weight:700;letter-spacing:.04em;background:rgba(8,10,16,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);color:#e6edf9}
.badge.score{left:auto;right:9px;color:#ffe9a8;border-color:rgba(255,159,10,.3);background:rgba(40,28,6,.55)}
.badge.live{color:#b9ffe9;border-color:rgba(48,209,88,.35);background:rgba(6,32,26,.55)}
.badge.live::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ok);margin-right:5px;box-shadow:0 0 8px var(--ok);animation:pulse 1.6s infinite;vertical-align:1px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.play-ov{position:absolute;inset:0;z-index:2;display:grid;place-items:center;opacity:0;transition:.36s var(--ease)}
.card:hover .play-ov{opacity:1}
.play-ov .cir{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(76,141,255,.82);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.3);box-shadow:0 12px 34px -10px rgba(76,141,255,.85);transform:scale(.72);transition:.42s var(--spring)}
.card:hover .play-ov .cir{transform:scale(1)}
.play-ov svg{width:18px;height:18px;margin-left:2px}

.fav-btn{position:absolute;right:8px;bottom:8px;z-index:4;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(8,10,16,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);color:#c3ccd9;opacity:0;transform:translateY(6px) scale(.85);transition:.34s var(--spring)}
.card:hover .fav-btn,.card .fav-btn.on{opacity:1;transform:none}
.fav-btn svg{width:16px;height:16px;transition:.3s var(--spring)}
.fav-btn:hover{color:#fff;border-color:rgba(255,59,92,.45);background:rgba(255,59,92,.16)}
.fav-btn.on{color:var(--love);opacity:1;transform:none;border-color:rgba(255,59,92,.35);background:rgba(255,59,92,.12)}
.fav-btn.on svg{fill:var(--love);stroke:var(--love)}
.fav-btn.beat svg{animation:heartBeat .5s var(--spring)}
@keyframes heartBeat{0%{transform:scale(1)}25%{transform:scale(1.35)}50%{transform:scale(.85)}75%{transform:scale(1.1)}100%{transform:scale(1)}}

.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);z-index:3}
.prog i{display:block;height:100%;background:var(--grad2);box-shadow:0 0 10px rgba(76,141,255,.8)}

<script>
(function(){
'use strict';

/* ═══════ CONFIG ═══════ */
const API_BASE = "https://enables-steel-relates-temporarily.trycloudflare.com";

const PROVIDERS = {
  oploverz:{name:"Oploverz",active:true,search:true,priority:1},
  otakudesu:{name:"Otakudesu",active:true,search:true,priority:2},
  kuramanime:{name:"Kuramanime",active:true,search:false,priority:3}
};

/* ═══════ ICONS ═══════ */
const I = {
home:'<path d="M3 10.4 12 3l9 7.4"/><path d="M5 9.6V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.6"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/>',
heart:'<path d="M12 20.5s-7.5-4.6-7.5-9.8A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7.5 2.7c0 5.2-7.5 9.8-7.5 9.8z"/>',
play:'<path d="M7 4.8v14.4a.7.7 0 0 0 1.07.6l11.4-7.2a.7.7 0 0 0 0-1.2L8.07 4.2A.7.7 0 0 0 7 4.8z" fill="currentColor" stroke="none"/>',
back:'<path d="M15 18l-6-6 6-6"/>',
right:'<path d="m9 6 6 6-6 6"/>',
left:'<path d="m15 6-6 6 6 6"/>',
star:'<path d="m12 3.6 2.6 5.3 5.9.85-4.25 4.15 1 5.85L12 17l-5.25 2.75 1-5.85L3.5 9.75l5.9-.85z"/>',
cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.6"/><path d="M3.5 10h17M8 3.2v3.4M16 3.2v3.4"/>',
clock:'<circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.2 2"/>',
film:'<rect x="3" y="4" width="18" height="16" rx="2.4"/><path d="M7 4v16M17 4v16M3 12h18"/>',
alert:'<path d="M12 8.6v4.6M12 16.6h.01"/><path d="M10.3 3.9 2.6 17.4A2 2 0 0 0 4.3 20.4h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
check:'<path d="m5 12.6 4.6 4.6L19 7.6"/>',
info:'<circle cx="12" cy="12" r="8.8"/><path d="M12 11v5.4M12 7.8h.01"/>',
refresh:'<path d="M20.4 11a8.4 8.4 0 1 0-.7 4.6"/><path d="M20.8 5.6v5.6h-5.6"/>',
down:'<path d="m6 9 6 6 6-6"/>',
globe:'<circle cx="12" cy="12" r="8.8"/><path d="M3.4 9.6h17.2M3.4 14.4h17.2"/>',
trash:'<path d="M4 7h16M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7M6.5 7l.8 12.1A1.6 1.6 0 0 0 8.9 20.6h6.2a1.6 1.6 0 0 0 1.6-1.5L17.5 7"/>',
server:'<rect x="3" y="4" width="18" height="7" rx="2.2"/><rect x="3" y="13" width="18" height="7" rx="2.2"/>',
compass:'<circle cx="12" cy="12" r="8.8"/><path d="m15.4 8.6-2 4.8-4.8 2 2-4.8z"/>',
explore:'<path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/><circle cx="8" cy="5" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="10" cy="19" r="2"/>'
};
const svg = (n,cls,sw) => '<svg class="'+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||1.9)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(I[n]||'')+'</svg>';

/* ═══════ UTIL ═══════ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const debounce = (fn,ms) => {let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),ms)}};

/* ═══════════════════════════════════════════════════════════════
   NORMALIZATION LAYER
   Semua data dari API dinormalisasi ke struktur unified ini
   supaya Home, Search, Explore, Favorite, History, Detail
   menggunakan format yang konsisten.
═══════════════════════════════════════════════════════════════ */
function normalizeAnime(item, provider) {
  if (!item) return null;
  
  // Extract poster - handle various field names from different APIs
  let poster = item.poster || item.image || item.cover || item.coverImage || item.thumbnail || '';
  if (typeof poster === 'object' && poster !== null) {
    poster = poster.extraLarge || poster.large || poster.medium || '';
  }
  
  // Extract title
  let title = item.title || item.name || 'Unknown';
  if (typeof title === 'object' && title !== null) {
    title = title.romaji || title.english || title.native || title.userPreferred || 'Unknown';
  }
  
  // Extract alternative titles for search matching
  let altTitles = [];
  if (item.title && typeof item.title === 'object') {
    if (item.title.romaji) altTitles.push(item.title.romaji);
    if (item.title.english) altTitles.push(item.title.english);
    if (item.title.native) altTitles.push(item.title.native);
  }
  if (item.alt) altTitles.push(item.alt);
  if (item.japanese) altTitles.push(item.japanese);
  if (item.englishTitle) altTitles.push(item.englishTitle);
  if (item.japaneseTitle) altTitles.push(item.japaneseTitle);
  if (Array.isArray(item.synonyms)) altTitles.push(...item.synonyms);
  else if (item.synonyms) altTitles.push(item.synonyms);
  
  // Extract ID
  let id = item.id || item.animeId || item.slug || item.mal_id || '';
  
  // Extract slug
  let slug = item.slug || '';
  
  // Extract score
  let score = item.score || item.rating || item.averageScore || '-';
  if (typeof score === 'number') {
    score = score > 10 ? (score / 10).toFixed(1) : score.toString();
  }
  
  // Extract episodes
  let episodes = item.episodes || item.episodeCount || item.totalEpisodes || '';
  
  // Extract year
  let year = item.year || item.seasonYear || item.releaseYear || '';
  if (item.startDate && item.startDate.year) year = item.startDate.year;
  
  // Extract type
  let type = item.type || item.format || '';
  
  // Extract status
  let status = item.status || '';
  
  return {
    id: String(id),
    slug: String(slug),
    provider: provider || 'unknown',
    title: String(title),
    altTitles: altTitles.map(String).filter(Boolean),
    poster: String(poster),
    score: String(score),
    type: String(type),
    status: String(status),
    episodes: episodes ? String(episodes) : '',
    year: year ? String(year) : '',
    meta: item.meta || item.latestReleaseDate || item.lastReleaseDate || item.releaseDay || ''
  };
}

/* Normalize search response - handles different response structures */
function normalizeSearchResults(data, provider) {
  if (!data) return [];
  
  // Try different possible structures
  let list = [];
  if (Array.isArray(data)) list = data;
  else if (Array.isArray(data.animeList)) list = data.animeList;
  else if (data.data && Array.isArray(data.data.animeList)) list = data.data.animeList;
  else if (data.data && Array.isArray(data.data)) list = data.data;
  else if (Array.isArray(data.results)) list = data.results;
  
  return list.map(item => normalizeAnime(item, provider)).filter(Boolean);
}

/* ═══════ STORE ═══════ */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('nanime.v1.' + k); return v == null ? d : JSON.parse(v) } catch { return d } },
  set(k, v) { try { localStorage.setItem('nanime.v1.' + k, JSON.stringify(v)) } catch {} }
};

const Store = {
  favs: LS.get('favs', []),
  hist: LS.get('hist', []),
  progress: LS.get('prog', {}),
  
  isFav(id) { return this.favs.some(f => f.id === id) },
  
  toggleFav(anime) {
    const i = this.favs.findIndex(f => f.id === anime.id);
    if (i > -1) {
      this.favs.splice(i, 1);
      LS.set('favs', this.favs);
      return false;
    }
    this.favs.unshift(anime);
    if (this.favs.length > 220) this.favs.length = 220;
    LS.set('favs', this.favs);
    return true;
  },
  
  addHist(o) {
    this.hist = this.hist.filter(h => h.id !== o.id);
    this.hist.unshift(o);
    if (this.hist.length > 24) this.hist.length = 24;
    LS.set('hist', this.hist);
  },
  
  setProg(key, t, d) {
    this.progress[key] = { t, d, ts: Date.now() };
    LS.set('prog', this.progress);
  },
  
  getProg(key) {
    const p = this.progress[key];
    if (!p) return null;
    if (Date.now() - p.ts > 1000 * 60 * 60 * 24 * 60) return null;
    return p;
  }
};

/* ═══════ TOAST ═══════ */
function toast(msg, kind = 'info', title) {
  const ic = { ok: 'check', err: 'alert', warn: 'alert', info: 'info' }[kind] || 'info';
  const n = document.createElement('div');
  n.className = 'toast ' + kind;
  n.innerHTML = '<span class="ti">' + svg(ic) + '</span><span style="min-width:0"><b style="display:block;font-weight:650">' + esc(title || ({ ok: 'Berhasil', err: 'Gagal', warn: 'Perhatian', info: 'Info' }[kind])) + '</b><span style="display:block;color:var(--mut);font-size:12.2px;font-weight:460;line-height:1.45">' + esc(msg) + '</span></span>';
  $('#toasts').appendChild(n);
  const kill = () => { n.classList.add('out'); setTimeout(() => n.remove(), 340) };
  n.addEventListener('click', kill);
  setTimeout(kill, kind === 'err' ? 6200 : 3200);
}

/* ═══════ HTTP ═══════ */
async function fetchAPI(endpoint, timeout = 20000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try {
    const response = await fetch(`${API_BASE}${endpoint}`, {
      method: 'GET',
      headers: { Accept: 'application/json' },
      signal: controller.signal
    });
    const raw = await response.text();
    clearTimeout(timer);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    try { return JSON.parse(raw) } catch { throw new Error('Tunnel mengirim response non-JSON.') }
  } catch (error) {
    clearTimeout(timer);
    if (error.name === 'AbortError') throw new Error('Request timeout.');
    throw error;
  }
}

function progress(onOff, pct) {
  const g = $('#topgrad');
  g.classList.toggle('on', !!onOff);
  if (pct != null) g.style.width = pct + '%';
  if (!onOff) setTimeout(() => { g.style.width = '0' }, 340);
}

/* ═══════════════════════════════════════════════════════════════
   API LAYER
   - Oploverz = PRIMARY SOURCE
   - Otakudesu = FALLBACK (hanya jika Oploverz gagal/kosong)
   - Semua request via Cloudflare Tunnel (API_BASE)
═══════════════════════════════════════════════════════════════ */
const API = {
  /* HOME - Oploverz primary, Otakudesu fallback */
  async home() {
    let ongoing = [], completed = [];
    
    // Try Oploverz first (PRIMARY)
    try {
      const r = await fetchAPI('/oploverz/home');
      const d = r?.data;
      if (d) {
        ongoing = normalizeSearchResults(d.ongoing || d.trending, 'oploverz');
        completed = normalizeSearchResults(d.completed, 'oploverz');
      }
    } catch (e) {
      console.warn('Oploverz home failed:', e);
    }
    
    // Fallback to Otakudesu if Oploverz empty
    if (!ongoing.length || !completed.length) {
      try {
        const r = await fetchAPI('/otakudesu/home');
        const d = r?.data;
        if (d) {
          if (!ongoing.length) ongoing = normalizeSearchResults(d.ongoing, 'otakudesu');
          if (!completed.length) completed = normalizeSearchResults(d.completed, 'otakudesu');
        }
      } catch (e) {
        console.warn('Otakudesu home failed:', e);
      }
    }
    
    return { ongoing, completed };
  },
  
  async genres() {
    try {
      const r = await fetchAPI('/otakudesu/genre');
      return r?.data?.genreList || [];
    } catch { return [] }
  },
  
  async ongoing(page = 1) {
    let result;
    try {
      result = await fetchAPI(`/oploverz/ongoing?page=${page}`);
      const list = normalizeSearchResults(result?.data, 'oploverz');
      if (list.length) return { list, pagination: result?.pagination || null };
    } catch {}
    try {
      result = await fetchAPI(`/otakudesu/ongoing?page=${page}`);
      return { list: normalizeSearchResults(result?.data, 'otakudesu'), pagination: result?.pagination || null };
    } catch { return { list: [], pagination: null } }
  },
  
  async completed(page = 1) {
    let result;
    try {
      result = await fetchAPI(`/oploverz/completed?page=${page}`);
      const list = normalizeSearchResults(result?.data, 'oploverz');
      if (list.length) return { list, pagination: result?.pagination || null };
    } catch {}
    try {
      result = await fetchAPI(`/otakudesu/completed?page=${page}`);
      return { list: normalizeSearchResults(result?.data, 'otakudesu'), pagination: result?.pagination || null };
    } catch { return { list: [], pagination: null } }
  },
  
  async genre(genreId, page = 1) {
    const r = await fetchAPI(`/otakudesu/genre/${encodeURIComponent(genreId)}?page=${page}`);
    return { list: normalizeSearchResults(r?.data, 'otakudesu'), pagination: r?.pagination || null };
  },
  
  /* SEARCH - Oploverz primary, Otakudesu fallback */
  async search(query) {
    let results = [];
    
    // Try Oploverz first (PRIMARY)
    try {
      const r = await fetchAPI(`/oploverz/search?q=${encodeURIComponent(query)}`);
      results = normalizeSearchResults(r?.data, 'oploverz');
      if (results.length) return results;
    } catch (e) {
      console.warn('Oploverz search failed:', e);
    }
    
    // Fallback to Otakudesu
    try {
      const r = await fetchAPI(`/otakudesu/search?q=${encodeURIComponent(query)}`);
      results = normalizeSearchResults(r?.data, 'otakudesu');
      if (results.length) return results;
    } catch (e) {
      console.warn('Otakudesu search failed:', e);
    }
    
    return [];
  },
  
  async detail(provider, id, slug = '') {
    let endpoint;
    if (provider === 'oploverz') endpoint = `/oploverz/anime/${encodeURIComponent(id)}`;
    else if (provider === 'otakudesu') endpoint = `/otakudesu/anime/${encodeURIComponent(id)}`;
    else if (provider === 'kuramanime') endpoint = `/kuramanime/anime/${encodeURIComponent(id)}/${encodeURIComponent(slug || id)}`;
    else throw new Error('Provider tidak tersedia.');
    
    const r = await fetchAPI(endpoint);
    const data = r?.data?.details;
    if (!data) throw new Error('Detail anime tidak ditemukan.');
    
    if (provider === 'oploverz') {
      return {
        id, slug: data.title ? id : id, provider,
        title: data.title || 'Unknown',
        alt: '',
        poster: data.poster || '',
        score: data.rating || '-',
        type: data.type || '-',
        status: data.status || '-',
        year: data.releasedOn || '-',
        episodes: (data.episodeList || []).length,
        duration: data.duration || '-',
        studio: data.studio || '-',
        genres: Array.isArray(data.genres) ? data.genres : [],
        synopsis: (data.synopsis?.paragraphList || []).join('\n\n') || 'Sinopsis tidak tersedia.',
        episodeList: (data.episodeList || []).map(i => {
          const href = i.href || '';
          const s = href.split('/').filter(Boolean).pop() || '';
          return { num: i.episode, id: href, slug: s, date: i.date || '' };
        })
      };
    }
    
    if (provider === 'otakudesu') {
      return {
        id, slug: '', provider,
        title: data.title || 'Unknown',
        alt: data.japanese || '',
        poster: data.poster || '',
        score: data.score || '-',
        type: data.type || '-',
        status: data.status || '-',
        year: data.aired || '-',
        episodes: data.episodes || '-',
        duration: data.duration || '-',
        studio: data.studios || '-',
        genres: (data.genreList || []).map(i => i.title),
        synopsis: (data.synopsis?.paragraphList || []).join('\n\n') || 'Sinopsis tidak tersedia.',
        episodeList: (data.episodeList || []).map(i => ({ num: i.title, id: i.episodeId, slug: '', date: '' }))
      };
    }
    
    return {
      id: data.animeId || id, slug: data.animeSlug || slug, provider,
      title: data.title || 'Unknown',
      alt: data.alternativeTitle || '',
      poster: data.poster || '',
      score: data.score || '-',
      type: data.type?.title || '-',
      status: data.status?.title || '-',
      year: data.aired || '-',
      episodes: data.episodes || '-',
      duration: data.duration || '-',
      studio: Array.isArray(data.studioList) ? data.studioList.map(x => x.title).join(', ') : '-',
      genres: (data.genreList || []).map(x => String(x.title || '').replace(/\s+/g, ' ').trim()),
      synopsis: (data.synopsis?.paragraphList || []).join('\n\n') || 'Sinopsis tidak tersedia.',
      episodeList: []
    };
  },
  
  async episode(provider, params) {
    let endpoint;
    if (provider === 'oploverz') endpoint = `/oploverz/episode/${encodeURIComponent(params.episodeSlug || params.episodeId)}`;
    else if (provider === 'otakudesu') endpoint = `/otakudesu/episode/${encodeURIComponent(params.episodeId)}`;
    else if (provider === 'kuramanime') endpoint = `/kuramanime/episode/${encodeURIComponent(params.animeId)}/${encodeURIComponent(params.animeSlug)}/${encodeURIComponent(params.episodeId)}`;
    else throw new Error('Provider tidak tersedia.');
    
    const r = await fetchAPI(endpoint);
    const details = r?.data?.details;
    if (!details) throw new Error('Data episode tidak ditemukan.');
    
    if (provider === 'oploverz') {
      return {
        provider,
        title: details.title || `Episode ${params.episode}`,
        playerUrl: details.streamingUrl || '',
        qualities: [],
        servers: []
      };
    }
    
    if (provider === 'otakudesu') {
      const qualities = (details.server?.qualityList || []).map(q => ({
        title: String(q.title || '').replace(/\s+/g, ' ').trim(),
        servers: (q.serverList || []).map(s => ({ name: s.title, id: s.serverId }))
      }));
      
      const allServers = [];
      qualities.forEach(q => {
        q.servers.forEach(s => {
          allServers.push({ ...s, quality: q.title });
        });
      });
      
      return {
        provider,
        title: details.title || `Episode ${params.episode}`,
        playerUrl: details.defaultStreamingUrl || '',
        qualities,
        servers: allServers
      };
    }
    
    return {
      provider,
      title: details.episodeTitle || details.title || `Episode ${params.episode}`,
      playerUrl: '',
      qualities: Array.isArray(details.server?.qualityList) ? details.server.qualityList : [],
      servers: []
    };
  },
  
  async resolveServer(serverId) {
    const r = await fetchAPI(`/otakudesu/server/${encodeURIComponent(serverId)}`);
    return r?.data?.details?.url || '';
  }
};

/* ═══════ REVEAL + LAZY ═══════ */
let IO = null;
function initReveal(root) {
  if (!IO) {
    IO = new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); IO.unobserve(e.target) } });
    }, { rootMargin: '0px 0px -8% 0px', threshold: .05 });
  }
  $$('.rv:not(.in),.rv-s:not(.in)', root || document).forEach(n => IO.observe(n));
}

let IMG_IO = null;
function initLazy(root) {
  if (!IMG_IO) {
    IMG_IO = new IntersectionObserver(es => {
      es.forEach(e => {
        if (e.isIntersecting) {
          const im = e.target;
          if (im.dataset.src) {
            im.src = im.dataset.src;
            delete im.dataset.src;
          }
          IMG_IO.unobserve(im);
        }
      });
    }, { rootMargin: '400px 0px' });
  }
  $$('img[data-src]', root || document).forEach(n => IMG_IO.observe(n));
}

function initRails(root) {
  $$('[data-railwrap]', root || document).forEach(w => {
    const tr = $('.rail-track', w); if (!tr || tr._ok) return; tr._ok = 1;
    const upd = () => {
      w.classList.toggle('s-start', tr.scrollLeft < 8);
      w.classList.toggle('e-end', tr.scrollLeft + tr.clientWidth >= tr.scrollWidth - 8);
    };
    tr.addEventListener('scroll', () => { upd() }, { passive: true }); upd();
    let down = false, sx = 0, sl = 0, moved = 0;
    tr.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; down = true; moved = 0; sx = e.clientX; sl = tr.scrollLeft });
    window.addEventListener('pointermove', e => { if (!down) return; const d = e.clientX - sx; moved = Math.abs(d); if (moved > 6) { tr.scrollLeft = sl - d; e.preventDefault() } }, { passive: false });
    window.addEventListener('pointerup', () => { down = false });
    tr.addEventListener('click', e => { if (moved > 10) { e.preventDefault(); e.stopPropagation() } }, true);
  });
}

function railScroll(id, dir) { const tr = $('#' + id); if (!tr) return; tr.scrollBy({ left: tr.clientWidth * .82 * dir, behavior: 'smooth' }) }

  const qi = h.indexOf('?'); if (qi > -1) { qs = h.slice(qi + 1); h = h.slice(0, qi) }
  const parts = h.split('/').filter(Boolean).map(decodeURIComponent);
  const query = {};
  qs.split('&').filter(Boolean).forEach(kv => { const i = kv.indexOf('='); query[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1) || '') });
  return { parts, q: query, path: h || '/home' };
}
function go(path, replace) { const target = '#' + path; if (location.hash === target) { render(); return } if (replace) location.replace(target); else location.hash = target }

/* Dashboard video - ensure it plays properly */
function initDashVideo() {
  const v = $('#dashVideo');
  if (!v) return;
  
  v.removeAttribute('controls');
  v.setAttribute('controlslist', 'nodownload noplaybackrate noremoteplayback');
  v.muted = true;
  v.defaultMuted = true;
  v.loop = true;
  v.playsInline = true;
  v.autoplay = true;
  v.setAttribute('tabindex', '-1');
  v.setAttribute('disablepictureinpicture', '');
  v.style.pointerEvents = 'none';
  v.style.userSelect = 'none';
  
  const force = () => {
    try {
      v.muted = true;
      v.loop = true;
      v.removeAttribute('controls');
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  };
  
  v.addEventListener('pause', force);
  v.addEventListener('ended', force);
  v.addEventListener('contextmenu', e => e.preventDefault());
  v.addEventListener('dragstart', e => e.preventDefault());
  
  document.addEventListener('visibilitychange', () => { if (!document.hidden) force() });
  window.addEventListener('pageshow', force);
  
  // Initial play attempt
  force();
  
  // Retry after short delay if autoplay was blocked
  setTimeout(force, 500);
}

      const idx = +b.dataset.epIdx;
      const ep = EP[idx];
      go('/watch/' + encodeURIComponent(anime.slug || anime.id) + '/' + encodeURIComponent(ep.num) + '?provider=' + encodeURIComponent(anime.provider) + '&eid=' + encodeURIComponent(ep.id) + '&eslug=' + encodeURIComponent(ep.slug || ''));
    });
  });
}

/* ═══════ VIEW: WATCH ═══════ */
async function ViewWatch(r) {
  const param = r.parts[1] || '';
  const epNum = r.parts[2] || '1';
  const provider = r.q.provider || 'oploverz';
  const eid = r.q.eid || '';
  const eslug = r.q.eslug || '';

  view.innerHTML = '<div class="shell" style="padding-top:16px"><div id="wHost"><div class="sk" style="aspect-ratio:16/9;border-radius:var(--r3);width:100%"></div></div><div id="wInfo" style="margin-top:16px"></div></div>';

  let anime;
  try {
    anime = await API.detail(provider, param, eslug);
  } catch (e) {
    view.innerHTML = '<div class="shell">' + stateHTML('err', 'Gagal memuat anime', e.message || '', '<button class="btn primary" data-act="reload">' + svg('refresh', '', 2.1) + ' Coba lagi</button>') + '</div>';
    return;
  }
  DET = anime;

  const ep = (anime.episodeList || []).find(e => String(e.num) === String(epNum));
  const epIdx = (anime.episodeList || []).findIndex(e => String(e.num) === String(epNum));
  const prevEp = epIdx > 0 ? anime.episodeList[epIdx - 1] : null;
  const nextEp = epIdx >= 0 && epIdx < anime.episodeList.length - 1 ? anime.episodeList[epIdx + 1] : null;

  $('#wInfo').innerHTML =
    '<div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:240px">' +
    '<a href="#/anime/' + esc(anime.slug || anime.id) + '?provider=' + encodeURIComponent(provider) + '" class="link-more" style="margin-bottom:8px">' + svg('back', '', 2.4) + ' ' + esc(anime.title) + '</a>' +
    '<h1 style="font-size:clamp(19px,4vw,26px);font-weight:740;margin-top:6px">Episode ' + esc(epNum) + '</h1>' +
    '<div class="stats" style="margin-top:10px"><span class="stat">' + svg('film', '', 1.9) + ' <b>' + esc(epNum) + '</b></span>' + (anime.type && anime.type !== '-' ? '<span class="stat">' + esc(anime.type) + '</span>' : '') + '</div></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn ghost sm" data-fav="' + esc(anime.id) + '" data-provider="' + esc(anime.provider) + '" data-cover="' + esc(anime.poster) + '" data-slug="' + esc(anime.slug || '') + '" data-title="' + esc(anime.title) + '" data-year="' + (anime.year || '') + '" data-score="' + (anime.score || 0) + '">' + svg('heart', '', 2.1) + ' Favorit</button>' +
    '<a class="btn ghost sm" href="#/anime/' + esc(anime.slug || anime.id) + '?provider=' + encodeURIComponent(provider) + '">' + svg('film', '', 2) + ' Episode</a>' +
    '</div></div>' +
    '<div id="wEpNav" style="display:flex;gap:9px;margin-top:18px;flex-wrap:wrap">' +
    (prevEp ? '<a class="btn ghost" href="#/watch/' + encodeURIComponent(anime.slug || anime.id) + '/' + encodeURIComponent(prevEp.num) + '?provider=' + encodeURIComponent(provider) + '&eid=' + encodeURIComponent(prevEp.id) + '&eslug=' + encodeURIComponent(prevEp.slug || '') + '">' + svg('left', '', 2.2) + ' EP ' + esc(prevEp.num) + '</a>' : '') +
    (nextEp ? '<a class="btn primary" href="#/watch/' + encodeURIComponent(anime.slug || anime.id) + '/' + encodeURIComponent(nextEp.num) + '?provider=' + encodeURIComponent(provider) + '&eid=' + encodeURIComponent(nextEp.id) + '&eslug=' + encodeURIComponent(nextEp.slug || '') + '">EP ' + esc(nextEp.num) + ' ' + svg('right', '', 2.2) + '</a>' : '') +
    '</div>';

  try {
    progress(true, 45);
    const stream = await API.episode(provider, { episodeId: eid || epNum, episodeSlug: eslug || epNum, episode: epNum, animeId: anime.id, animeSlug: anime.slug || '' });
    progress(true, 100); setTimeout(() => progress(false), 240);

    let playerUrl = stream.playerUrl || '';
    
    /* Build player markup */
    let playerMarkup = '';
    if (playerUrl) {
      playerMarkup = '<iframe id="playerFrame" src="' + esc(playerUrl) + '" allowfullscreen loading="eager" referrerpolicy="no-referrer" style="width:100%;height:100%;border:0;background:#000"></iframe>';
    } else {
      playerMarkup = '<div style="width:100%;height:100%;display:grid;place-items:center;padding:30px;text-align:center;color:var(--mut);background:#000"><div><div style="width:66px;height:66px;border-radius:22px;display:grid;place-items:center;margin:0 auto 15px;color:var(--warn);background:rgba(255,159,10,.08);border:1px solid rgba(255,159,10,.22)">' + svg('server', '', 1.7) + '</div><strong style="color:var(--txt);font-size:16px;display:block;margin-bottom:8px">Stream tidak tersedia</strong><p style="font-size:12.8px;max-width:44ch;line-height:1.62">Provider tidak memberikan URL player untuk episode ini. Coba pilih server alternatif di bawah.</p></div></div>';
    }
    
    $('#wHost').innerHTML = '<div class="pw">' + playerMarkup + '</div>';

    /* Stream selector UI - show if multiple servers available */
    if (stream.servers && stream.servers.length > 0) {
      const srvHTML = '<div style="margin-top:16px"><div style="font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:9px">Pilih Server Streaming</div><div class="srv" id="srvRow">' + 
        stream.servers.map((s, i) => '<button class="srv-btn' + (i === 0 ? ' on' : '') + '" data-server-id="' + esc(s.id) + '" data-quality="' + esc(s.quality || '') + '">' + 
          svg('server', '', 2) + esc(s.name) + (s.quality ? ' <span style="font-size:10px;opacity:.7">(' + esc(s.quality) + ')</span>' : '') + 
        '</button>').join('') + 
        '</div></div>';
      $('#wInfo').insertAdjacentHTML('beforeend', srvHTML);

      $$('.srv-btn').forEach(b => {
        b.addEventListener('click', async () => {
          const serverId = b.dataset.serverId;
          if (!serverId) { toast('Server ID kosong.', 'err'); return; }
          if (provider !== 'otakudesu') { toast('Resolver server hanya untuk Otakudesu.', 'err'); return; }
          
          b.textContent = 'Memuat…'; b.disabled = true;
          try {
            const url = await API.resolveServer(serverId);
            if (!url) throw new Error('URL kosong.');
            const iframe = $('#playerFrame');
            if (iframe) iframe.src = url;
            $$('.srv-btn').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
            b.innerHTML = svg('server', '', 2) + esc(b.dataset.quality ? b.textContent : 'Server aktif');
            toast('Server aktif.', 'ok');
          } catch (e) { toast(e.message, 'err') }
          finally { b.disabled = false; }
        });
      });
    } else if (!playerUrl) {
      const srvHTML = '<div style="margin-top:16px;padding:14px;border-radius:14px;background:rgba(255,159,10,.05);border:1px solid rgba(255,159,10,.18);color:var(--mut);font-size:12.8px;line-height:1.62"><b style="color:var(--warn)">⚠ Tidak ada stream tersedia</b><br>Provider tidak memberikan URL player atau server alternatif untuk episode ini.</div>';
      $('#wInfo').insertAdjacentHTML('beforeend', srvHTML);
    }

    /* Save history */
    Store.addHist({ id: anime.id, slug: anime.slug || anime.id, title: anime.title, cover: anime.poster, ep: epNum, provider, t: 0, dur: 0 });

  } catch (e) {
    progress(false);
    $('#wHost').innerHTML = '<div class="pw"><div style="width:100%;height:100%;display:grid;place-items:center;padding:30px;text-align:center;color:var(--mut);background:#000"><div><div style="width:66px;height:66px;border-radius:22px;display:grid;place-items:center;margin:0 auto 15px;color:var(--err);background:rgba(255,69,58,.08);border:1px solid rgba(255,69,58,.22)">' + svg('alert', '', 1.7) + '</div><strong style="color:var(--txt);font-size:16px;display:block;margin-bottom:8px">Stream gagal dimuat</strong><p style="font-size:12.8px;max-width:44ch;line-height:1.62">' + esc(e.message || 'Tidak ada sumber.') + '</p><div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:14px"><button class="btn primary" data-act="reload">' + svg('refresh', '', 2.1) + ' Coba lagi</button><a class="btn ghost" href="#/anime/' + esc(anime.slug || anime.id) + '?provider=' + encodeURIComponent(provider) + '">Kembali</a></div></div></div></div>';
  }
}

/* ═══════ GLOBAL EVENTS ═══════ */
document.addEventListener('click', async e => {
  /* Favorite toggle */
  const fav = e.target.closest('[data-fav]');
  if (fav) {
    e.preventDefault(); e.stopPropagation();
    const id = fav.dataset.fav;
    const provider = fav.dataset.provider || 'oploverz';
    const added = Store.toggleFav({ id, slug: fav.dataset.slug, title: fav.dataset.title, cover: fav.dataset.cover, year: +fav.dataset.year || null, score: +fav.dataset.score || 0, provider });
    $$('[data-fav="' + id + '"]').forEach(b => {
      b.classList.toggle('on', added);
      b.setAttribute('aria-pressed', String(added));
      b.classList.remove('beat'); void b.offsetWidth; b.classList.add('beat');
      if (b.id === 'bigFav') { b.className = 'btn' + (added ? ' danger' : ' ghost'); b.innerHTML = added ? svg('heart', '', 2.1) + ' Tersimpan' : svg('heart', '', 2.1) + ' Favorit' }
    });
    toast(added ? 'Ditambahkan ke favorit.' : 'Dihapus dari favorit.', added ? 'ok' : 'info');
    renderNav();
    if (curRoute === 'favorite') ViewFavorite();
    return;
  }

  /* Actions */
  const act = e.target.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'reload') { location.reload(); return }
    if (a === 'back') { e.preventDefault(); back(); return }
    if (a === 'toggle-syn') { const s = $('#syn'); const open = s.classList.toggle('clip') === false; act.classList.toggle('open', open); act.innerHTML = (open ? 'Tampilkan lebih sedikit ' : 'Baca selengkapnya ') + svg('down', '', 2.4); return }
    if (a === 'watch-first') {
      if (!DET) return;
      const idx = +act.dataset.ep;
      const ep = EP[idx];
      if (ep) go('/watch/' + encodeURIComponent(DET.slug || DET.id) + '/' + encodeURIComponent(ep.num) + '?provider=' + encodeURIComponent(DET.provider) + '&eid=' + encodeURIComponent(ep.id) + '&eslug=' + encodeURIComponent(ep.slug || ''));
      return;
    }
    if (a === 'clear-fav') {
      if (confirm('Kosongkan semua favorit?')) { Store.favs = []; LS.set('favs', []); renderNav(); ViewFavorite(); toast('Favorit dikosongkan.', 'ok') }
      return;
    }
    if (a === 'clear-hist') {
      if (confirm('Hapus semua riwayat?')) { Store.hist = []; LS.set('hist', []); ViewHistory(); toast('Riwayat dihapus.', 'ok') }
      return;
    }
    if (a === 'rail') { railScroll(act.dataset.rail, +act.dataset.dir); return }
  }

  const railBtn = e.target.closest('[data-rail]');
  if (railBtn) { e.preventDefault(); railScroll(railBtn.dataset.rail, +railBtn.dataset.dir); return }
  
  /* Nav buttons */
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) { e.preventDefault(); go('/' + navBtn.dataset.nav); return }
});

/* ═══════ BOOT ═══════ */
function boot() {
  renderNav();
  if (!location.hash) location.replace('#/home');
  render();
  window.addEventListener('storage', ev => {
    if (ev.key && ev.key.indexOf('nanime.v1.') === 0) {
      Store.favs = LS.get('favs', []); Store.hist = LS.get('hist', []); Store.progress = LS.get('prog', {});
      renderNav();
    }
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
</body>
</html>
