<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<meta name="color-scheme" content="dark">
<title>Nanime — Premium Anime Streaming</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/sora/index.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#05060A;--bg2:#0A0C12;--panel:#0E1018;--panel2:#141720;--panel3:#1A1E2A;
--txt:#F0F3FA;--mut:#8E98AC;--dim:#5C6578;
--acc:#4C8DFF;--acc2:#7DB4FF;--acc-soft:rgba(76,141,255,.12);
--love:#FF3B5C;--ok:#30D158;--warn:#FF9F0A;--err:#FF453A;
--grad:linear-gradient(130deg,#fff 0%,#D8E7FF 38%,#4C8DFF 78%,#2E6BE6 100%);
--grad2:linear-gradient(135deg,#4C8DFF,#8AB6FF);
--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
--glass:linear-gradient(168deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
--sh1:0 2px 10px rgba(0,0,0,.4);
--sh2:0 20px 48px -20px rgba(0,0,0,.9);
--sh3:0 34px 80px -28px rgba(0,0,0,.95);
--r1:12px;--r2:16px;--r3:20px;--r4:26px;--r5:32px;
--ease:cubic-bezier(.22,.61,.36,1);--spring:cubic-bezier(.34,1.42,.5,1);--ios:cubic-bezier(.25,.1,.25,1);
--side-w:250px;--top-h:58px;--nav-h:64px;
--maxw:1440px;
}
html{scroll-behavior:smooth;background:var(--bg)}
body{
min-height:100dvh;overflow-x:hidden;color:var(--txt);
background:var(--bg);
font-family:'Inter Variable',Inter,-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
font-size:15px;line-height:1.5;letter-spacing:-.01em;
-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{font-family:'Sora Variable',Sora,'Inter Variable',sans-serif;letter-spacing:-.03em;margin:0}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16);background-clip:content-box}
:focus-visible{outline:2px solid var(--acc2);outline-offset:3px;border-radius:10px}

/* BG */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg::before{content:"";position:absolute;inset:0;background:
radial-gradient(120% 80% at 12% -10%,rgba(46,107,230,.12),transparent 58%),
radial-gradient(90% 70% at 92% 4%,rgba(120,90,255,.07),transparent 60%),
radial-gradient(120% 90% at 50% 110%,rgba(20,60,140,.08),transparent 62%),
linear-gradient(180deg,#05060A,#07080C 45%,#05060A)}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 26s var(--ease) infinite alternate}
.orb.a{width:520px;height:520px;left:-160px;top:-120px;background:radial-gradient(circle,rgba(62,123,250,.25),transparent 70%)}
.orb.b{width:460px;height:460px;right:-140px;top:18%;background:radial-gradient(circle,rgba(140,90,255,.14),transparent 70%);animation-delay:-8s}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(40px,60px,0) scale(1.12)}}

/* TOP PROGRESS */
.topgrad{height:3px;position:fixed;left:0;top:0;z-index:400;width:0;background:var(--grad2);box-shadow:0 0 14px rgba(76,141,255,.9);transition:width .3s var(--ease),opacity .3s;opacity:0}
.topgrad.on{opacity:1}

/* APP */
#app{position:relative;z-index:1;min-height:100dvh}
.shell{max-width:var(--maxw);margin:0 auto;padding:0 18px}

/* TOPBAR */
#topbar{
position:sticky;top:0;z-index:60;height:var(--top-h);display:flex;align-items:center;gap:12px;
padding:0 14px;
background:rgba(8,9,12,.72);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
border-bottom:1px solid var(--line);
}
.tb-logo{display:flex;align-items:center;gap:9px;font-family:'Sora Variable',sans-serif;font-weight:700;letter-spacing:-.03em}
.tb-logo img{width:30px;height:30px;border-radius:9px;object-fit:cover;border:1px solid var(--line2)}
.tb-logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:16px}
.spacer{flex:1}
.ibtn{
width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--mut);
transition:.24s var(--ease);position:relative;overflow:hidden;
}
.ibtn:hover{color:#fff;background:rgba(255,255,255,.06)}
.ibtn:active{transform:scale(.88);background:rgba(255,255,255,.1)}
.ibtn svg{width:19px;height:19px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px rgba(48,209,88,.6)}
.dot.off{background:var(--err)}
.dot.idle{background:var(--warn)}

/* SIDEBAR */
#sidebar{
position:fixed;left:0;top:0;bottom:0;width:var(--side-w);z-index:70;display:none;flex-direction:column;
padding:22px 16px 16px;
background:linear-gradient(180deg,rgba(13,15,18,.88),rgba(8,9,12,.92));
backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);
border-right:1px solid var(--line);
}
.sb-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 24px}
.sb-brand .lbox{width:42px;height:42px;border-radius:13px;overflow:hidden;flex:none;border:1px solid var(--line2);box-shadow:var(--sh1),inset 0 1px 0 rgba(255,255,255,.12)}
.sb-brand .lbox img{width:100%;height:100%;object-fit:cover}
.sb-brand .wm{font-family:'Sora Variable',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sb-brand .sub{font-size:10px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:-2px}
.sb-nav{display:flex;flex-direction:column;gap:4px}
.sb-link{
position:relative;display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:14px;
color:var(--mut);font-weight:550;font-size:14.5px;transition:.28s var(--ease);overflow:hidden;
}
.sb-link svg{width:20px;height:20px;flex:none;transition:.28s var(--spring)}
.sb-link:hover{color:#fff}
.sb-link.active{color:#fff}
.sb-link.active::before{content:"";position:absolute;inset:0;border-radius:14px;background:linear-gradient(100deg,rgba(76,141,255,.18),rgba(76,141,255,.04));box-shadow:inset 0 0 0 1px rgba(125,180,255,.18)}
.sb-link.active svg{color:var(--acc2)}
.sb-foot{margin-top:auto}
.sb-status{padding:12px 13px;border-radius:15px;background:var(--glass);border:1px solid var(--line);font-size:12px;margin-bottom:10px}
.sb-status .row{display:flex;align-items:center;gap:8px;color:var(--mut)}
.sb-status b{color:var(--txt);font-weight:600}

/* TABBAR */
#tabbar{
position:fixed;left:0;right:0;bottom:0;z-index:80;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:stretch;
background:rgba(8,9,12,.78);backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);
border-top:1px solid var(--line);
}
#tabbar::before{content:"";position:absolute;top:-24px;left:0;right:0;height:24px;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(5,6,10,.5))}
.tab{
position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
color:var(--dim);transition:color .3s var(--ease);
}
.tab svg{width:22px;height:22px;transition:.42s var(--spring)}
.tab span{font-size:10.5px;font-weight:600;letter-spacing:.01em}
.tab .ind{position:absolute;top:6px;width:34px;height:34px;border-radius:12px;background:var(--acc-soft);opacity:0;transform:scale(.5);transition:.42s var(--spring);z-index:-1}
.tab.active{color:#fff}
.tab.active .ind{opacity:1;transform:scale(1)}
.tab.active svg{color:var(--acc2);transform:translateY(-1px) scale(1.06)}
.tab:active svg{transform:scale(.82)}
.tab .badge{position:absolute;top:5px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--love);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 3px 10px -3px rgba(255,59,92,.8)}

/* MAIN */
#view{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 26px);min-height:60dvh}
main.anim-in{animation:viewIn .42s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(12px) scale(.995);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}

/* REVEAL */
.rv{opacity:0;transform:translateY(16px);transition:opacity .55s var(--ease),transform .55s var(--ease);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.rv-s{opacity:0;transform:scale(.94);transition:opacity .45s var(--ease),transform .55s var(--spring);transition-delay:var(--d,0ms)}
.rv-s.in{opacity:1;transform:none}

/* HERO */
.hero{
position:relative;margin:18px 0 8px;border-radius:var(--r5);overflow:hidden;
background:var(--glass);border:1px solid var(--line);box-shadow:var(--sh3);
padding:30px 20px 26px;animation:heroIn .8s var(--ease) both;
}
@keyframes heroIn{from{opacity:0;transform:translateY(22px) scale(.985);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.hero::before{content:"";position:absolute;inset:0;background:
radial-gradient(70% 100% at 50% -20%,rgba(76,141,255,.16),transparent 62%),
radial-gradient(50% 60% at 10% 110%,rgba(140,90,255,.08),transparent 70%);pointer-events:none}
.hero-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:0}
.logo-wrap{
position:relative;width:96px;height:96px;border-radius:26px;padding:4px;
background:linear-gradient(150deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 40%,rgba(125,180,255,.16));
box-shadow:0 18px 44px -18px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.2);
animation:logoIn .9s var(--spring) .12s both;transition:.5s var(--spring);
}
@keyframes logoIn{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
.logo-wrap::after{content:"";position:absolute;inset:-14px;border-radius:38px;z-index:-1;background:radial-gradient(circle,rgba(76,141,255,.3),transparent 68%);filter:blur(16px);opacity:.7;animation:breathe 5.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45;transform:scale(.95)}50%{opacity:.8;transform:scale(1.06)}}
.logo-inner{width:100%;height:100%;border-radius:22px;overflow:hidden;background:#0A0C11;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.logo-inner img{width:100%;height:100%;object-fit:cover;transition:.6s var(--spring)}
.logo-wrap:hover{transform:translateY(-4px) scale(1.045) rotate(1.5deg)}
.logo-wrap:hover .logo-inner img{transform:scale(1.09)}
.hero-title{
margin-top:16px;font-family:'Sora Variable',sans-serif;font-weight:800;line-height:1;
font-size:clamp(36px,9vw,62px);letter-spacing:-.05em;text-align:center;
background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
animation:titleIn .9s var(--ease) .2s both;
}
@keyframes titleIn{from{opacity:0;transform:translateY(14px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.hero-tag{margin:10px auto 0;max-width:440px;text-align:center;color:var(--mut);font-size:13.5px;animation:titleIn .9s var(--ease) .32s both}
.hero-tag b{color:#cfe0ff;font-weight:600}
.hero-cta{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center;animation:titleIn .9s var(--ease) .4s both}

/* BUTTONS */
.btn{
position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
height:42px;padding:0 18px;border-radius:14px;font-size:13.5px;font-weight:620;letter-spacing:-.01em;
border:1px solid var(--line2);color:var(--txt);background:var(--glass);overflow:hidden;
transition:transform .2s var(--spring),background .25s var(--ease),border-color .25s var(--ease),box-shadow .3s var(--ease);
white-space:nowrap;
}
.btn svg{width:17px;height:17px}
.btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22);box-shadow:var(--sh2)}
.btn:active{transform:scale(.94);transition:transform .1s}
.btn.primary{background:linear-gradient(135deg,#4C8DFF,#2E6BE6);border-color:transparent;color:#fff;box-shadow:0 12px 30px -12px rgba(76,141,255,.7),inset 0 1px 0 rgba(255,255,255,.24)}
.btn.primary:hover{box-shadow:0 18px 42px -14px rgba(76,141,255,.85),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.ghost{background:rgba(255,255,255,.03)}
.btn.sm{height:34px;padding:0 13px;border-radius:11px;font-size:12.5px}
.btn.danger{border-color:rgba(255,59,92,.3);color:#ffb4ba;background:rgba(255,59,92,.08)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* CHIPS */
.chip{
display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:99px;font-size:12.8px;font-weight:560;
color:var(--mut);background:rgba(255,255,255,.035);border:1px solid var(--line);transition:.28s var(--ease);white-space:nowrap;
}
.chip:hover{color:#fff;border-color:var(--line2);background:rgba(255,255,255,.07);transform:translateY(-1px)}
.chip:active{transform:scale(.94)}
.chip.on{color:#fff;background:linear-gradient(120deg,rgba(76,141,255,.26),rgba(76,141,255,.1));border-color:rgba(125,180,255,.38);box-shadow:0 6px 22px -10px rgba(76,141,255,.8)}
.chip svg{width:15px;height:15px}

/* SECTION */
.sec{margin:32px 0 0}
.sec-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.sec-head .t{flex:1;min-width:0}
.sec-head h2{font-size:clamp(17px,2.5vw,21px);font-weight:700;display:flex;align-items:center;gap:9px}
.sec-head h2 .bar{width:3px;height:17px;border-radius:2px;background:var(--grad2);box-shadow:0 0 12px rgba(76,141,255,.7)}
.sec-head p{margin:3px 0 0;font-size:12.4px;color:var(--dim)}
.link-more{font-size:12.5px;color:var(--acc2);font-weight:600;display:inline-flex;align-items:center;gap:4px;transition:.24s}
.link-more:hover{gap:8px;color:#fff}
.link-more svg{width:14px;height:14px}

/* RAIL */
.rail{position:relative;margin:0 -18px;padding:4px 18px 8px}
.rail-track{display:flex;gap:13px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:6px 2px 12px}
.rail-track::-webkit-scrollbar{display:none}
.rail-track>*{scroll-snap-align:start;flex:none}
.rail::before,.rail::after{content:"";position:absolute;top:0;bottom:8px;width:26px;z-index:3;pointer-events:none;transition:.3s}
.rail::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.rail::after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
.rail.s-start::before,.rail.e-end::after{opacity:0}

/* GRID */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}

/* CARD */
.card{
position:relative;display:block;border-radius:var(--r3);overflow:hidden;background:var(--panel);
border:1px solid var(--line);transition:.42s var(--ease);will-change:transform;
}
.card.g{width:100%}
.card:hover{transform:translateY(-6px) scale(1.018);border-color:var(--line2);box-shadow:var(--sh3),0 0 0 1px rgba(125,180,255,.12)}
.card:active{transform:translateY(-2px) scale(.985);transition:transform .1s}
.card .poster{position:relative;aspect-ratio:2/3;overflow:hidden;background:linear-gradient(150deg,#141922,#0A0C11)}
.card .poster img{width:100%;height:100%;object-fit:cover;transition:.7s var(--ease);opacity:0;transform:scale(1.05)}
.card .poster img.ld{opacity:1;transform:scale(1)}
.card:hover .poster img{transform:scale(1.06)}
.card .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,10,.04) 32%,rgba(5,6,10,.58) 68%,rgba(5,6,10,.92));opacity:.86;transition:.4s var(--ease)}
.card:hover .veil{opacity:1}
.card .body{position:absolute;left:0;right:0;bottom:0;padding:11px 12px 12px;transform:translateY(5px);transition:.4s var(--ease)}
.card:hover .body{transform:none}
.card .nm{font-size:13px;font-weight:640;line-height:1.32;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.card .meta{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:10.6px;color:#a7b3c6;opacity:0;transform:translateY(5px);transition:.4s var(--ease) .04s}
.card:hover .meta{opacity:1;transform:none}
.card .meta i{width:3px;height:3px;border-radius:50%;background:#5d6a7d;font-style:normal}

/* BADGES */
.badge{position:absolute;left:9px;top:9px;z-index:2;padding:4px 8px;border-radius:8px;font-size:10px;font-weight:700;letter-spacing:.04em;background:rgba(8,10,16,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);color:#e6edf9}
.badge.score{left:auto;right:9px;color:#ffe9a8;border-color:rgba(255,159,10,.3);background:rgba(40,28,6,.55)}
.badge.live{color:#b9ffe9;border-color:rgba(48,209,88,.35);background:rgba(6,32,26,.55)}
.badge.live::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ok);margin-right:5px;box-shadow:0 0 8px var(--ok);animation:pulse 1.6s infinite;vertical-align:1px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* PLAY OVERLAY */
.play-ov{position:absolute;inset:0;z-index:2;display:grid;place-items:center;opacity:0;transition:.36s var(--ease)}
.card:hover .play-ov{opacity:1}
.play-ov .cir{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(76,141,255,.82);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.3);box-shadow:0 12px 34px -10px rgba(76,141,255,.85);transform:scale(.72);transition:.42s var(--spring)}
.card:hover .play-ov .cir{transform:scale(1)}
.play-ov svg{width:18px;height:18px;margin-left:2px}

/* FAV BTN - iOS style heart */
.fav-btn{
position:absolute;right:8px;bottom:8px;z-index:4;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
background:rgba(8,10,16,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);
color:#c3ccd9;opacity:0;transform:translateY(6px) scale(.85);transition:.34s var(--spring);
}
.card:hover .fav-btn,.card .fav-btn.on{opacity:1;transform:none}
.fav-btn svg{width:16px;height:16px;transition:.3s var(--spring)}
.fav-btn:hover{color:#fff;border-color:rgba(255,59,92,.45);background:rgba(255,59,92,.16)}
.fav-btn.on{color:var(--love);opacity:1;transform:none;border-color:rgba(255,59,92,.35);background:rgba(255,59,92,.12)}
.fav-btn.on svg{fill:var(--love);stroke:var(--love)}
.fav-btn.beat svg{animation:heartBeat .5s var(--spring)}
@keyframes heartBeat{0%{transform:scale(1)}25%{transform:scale(1.35)}50%{transform:scale(.85)}75%{transform:scale(1.1)}100%{transform:scale(1)}}

/* PROGRESS */
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);z-index:3}
.prog i{display:block;height:100%;background:var(--grad2);box-shadow:0 0 10px rgba(76,141,255,.8)}

/* SEARCH */
.searchbar{
position:relative;display:flex;align-items:center;gap:11px;height:54px;padding:0 15px;border-radius:18px;
background:rgba(255,255,255,.035);border:1px solid var(--line);transition:.36s var(--ease);
}
.searchbar::before{content:"";position:absolute;inset:-1px;border-radius:19px;padding:1px;opacity:0;transition:.4s var(--ease);background:linear-gradient(120deg,rgba(125,180,255,.6),rgba(125,180,255,.04) 40%,rgba(140,90,255,.4));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.searchbar:focus-within{background:rgba(255,255,255,.06);border-color:transparent;box-shadow:0 14px 44px -18px rgba(76,141,255,.5);transform:translateY(-1px)}
.searchbar:focus-within::before{opacity:1}
.searchbar .sic{color:var(--dim);display:grid;place-items:center;transition:.4s var(--spring)}
.searchbar .sic svg{width:19px;height:19px}
.searchbar:focus-within .sic{color:var(--acc2);transform:scale(1.1) rotate(-8deg)}
.searchbar input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:15px;font-weight:500;letter-spacing:-.01em}
.searchbar input::placeholder{color:var(--dim)}
.searchbar .clr{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--dim);opacity:0;transform:scale(.7);transition:.3s var(--spring);pointer-events:none}
.searchbar .clr svg{width:15px;height:15px}
.searchbar.has .clr{opacity:1;transform:none;pointer-events:auto}
.searchbar .clr:hover{background:rgba(255,255,255,.08);color:#fff}

/* SUGGESTIONS */
.sugg{position:absolute;left:0;right:0;top:calc(100% + 9px);z-index:40;border-radius:var(--r3);overflow:hidden;background:rgba(13,15,19,.94);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--line2);box-shadow:var(--sh3);display:none;max-height:340px;overflow-y:auto}
.sugg.open{display:block;animation:sheetIn .3s var(--ease)}
.sugg .it{display:flex;gap:11px;align-items:center;padding:10px 12px;cursor:pointer;transition:.2s var(--ease)}
.sugg .it:hover,.sugg .it.sel{background:rgba(255,255,255,.06)}
.sugg .it img{width:34px;height:48px;border-radius:7px;object-fit:cover;flex:none;background:#12151c}
.sugg .it .tx{min-width:0;flex:1}
.sugg .it .tx b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg .it .tx span{font-size:11.2px;color:var(--dim)}

/* FILTERS */
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}

/* SEG */
.seg{display:flex;padding:3px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);gap:2px}
.seg button{padding:6px 13px;border-radius:9px;font-size:12.3px;font-weight:620;color:var(--dim);transition:.3s var(--ease)}
.seg button.on{background:linear-gradient(135deg,rgba(76,141,255,.85),rgba(46,107,230,.85));color:#fff;box-shadow:0 6px 18px -8px rgba(76,141,255,.8)}

/* DETAIL */
.detail-hero{position:relative;margin:0 -18px;padding:0 18px;overflow:hidden}
.detail-hero .bd{position:absolute;inset:-20px -18px auto;height:420px;background-size:cover;background-position:center 22%;filter:blur(2px) saturate(125%);transform:scale(1.08);opacity:.38;animation:bdIn 1.1s var(--ease) both}
@keyframes bdIn{from{opacity:0;transform:scale(1.2)}to{opacity:.38;transform:scale(1.08)}}
.detail-hero .bd::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,10,.5),rgba(5,6,10,.84) 58%,var(--bg))}
.detail-in{position:relative;z-index:2;padding:26px 0 8px;display:grid;grid-template-columns:1fr;gap:20px;justify-items:center;text-align:center}
.cover-box{
position:relative;width:min(220px,52vw);aspect-ratio:2/3;border-radius:var(--r3);overflow:hidden;padding:5px;
background:linear-gradient(155deg,rgba(255,255,255,.22),rgba(255,255,255,.03) 45%,rgba(125,180,255,.16));
box-shadow:var(--sh3),0 0 70px -30px rgba(76,141,255,.5);animation:coverIn .95s var(--spring) both;
}
@keyframes coverIn{from{opacity:0;transform:translateY(26px) scale(.9) rotateX(8deg)}to{opacity:1;transform:none}}
.cover-box .in{width:100%;height:100%;border-radius:calc(var(--r3) - 5px);overflow:hidden;background:#0B0D12;position:relative}
.cover-box img{width:100%;height:100%;object-fit:cover;transition:.7s var(--ease)}
.cover-box:hover img{transform:scale(1.05)}
.detail-meta{max-width:760px}
.detail-meta h1{font-size:clamp(24px,5.4vw,38px);font-weight:760;line-height:1.1}
.detail-meta .alt{margin-top:7px;font-size:12.8px;color:var(--dim);line-height:1.5}
.detail-meta .stats{justify-content:center;margin-top:16px}
.detail-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:18px}

/* PANEL */
.panel{border-radius:var(--r3);background:var(--glass);border:1px solid var(--line);padding:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.panel h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.syn{font-size:13.6px;color:#b9c3d2;line-height:1.72;white-space:pre-line}
.syn.clip{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;position:relative}
.syn.clip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52px;background:linear-gradient(180deg,transparent,var(--panel))}
.readmore{margin-top:9px;font-size:12.6px;font-weight:640;color:var(--acc2);display:inline-flex;align-items:center;gap:5px;transition:.26s}
.readmore:hover{gap:9px;color:#fff}
.readmore svg{width:14px;height:14px;transition:.3s var(--ease)}
.readmore.open svg{transform:rotate(180deg)}

/* STATS */
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:11px;font-size:12.2px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--mut)}
.stat b{color:var(--txt);font-weight:650}
.stat svg{width:14px;height:14px;color:var(--acc2)}

/* EPISODES */
.ep-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ep-search{position:relative;flex:1;min-width:190px;display:flex;align-items:center;gap:9px;height:42px;padding:0 13px;border-radius:13px;background:rgba(255,255,255,.035);border:1px solid var(--line);transition:.3s var(--ease)}
.ep-search:focus-within{border-color:rgba(125,180,255,.4);background:rgba(255,255,255,.06);box-shadow:0 0 0 4px rgba(76,141,255,.08)}
.ep-search svg{width:16px;height:16px;color:var(--dim);flex:none}
.ep-search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:13.5px}
.ep-grid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.ep{
position:relative;display:flex;gap:11px;align-items:center;padding:9px;border-radius:14px;text-align:left;
background:rgba(255,255,255,.028);border:1px solid var(--line);transition:.3s var(--ease);overflow:hidden;
}
.ep:hover{background:rgba(255,255,255,.06);border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--sh2)}
.ep:active{transform:scale(.98);transition:transform .1s}
.ep.watched{opacity:.58}
.ep.watched:hover{opacity:1}
.ep .no{width:44px;height:44px;flex:none;border-radius:11px;display:grid;place-items:center;font-family:'Sora Variable',sans-serif;font-size:14px;font-weight:750;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#cdd8e8;transition:.3s var(--ease)}
.ep:hover .no{background:linear-gradient(135deg,rgba(76,141,255,.24),rgba(76,141,255,.08));border-color:rgba(125,180,255,.35);color:#fff}
.ep .th{width:74px;height:44px;flex:none;border-radius:9px;overflow:hidden;background:#12151c}
.ep .th img{width:100%;height:100%;object-fit:cover}
.ep .tx{min-width:0;flex:1}
.ep .tx b{display:block;font-size:12.8px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .tx span{font-size:11px;color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .go{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;color:var(--dim);transition:.3s var(--spring)}
.ep:hover .go{color:var(--acc2);transform:translateX(3px)}
.ep .go svg{width:14px;height:14px}
.ep.active{background:linear-gradient(120deg,rgba(76,141,255,.16),rgba(76,141,255,.04));border-color:rgba(125,180,255,.4)}
.ep.active .no{background:linear-gradient(135deg,#4C8DFF,#2E6BE6);color:#fff;border-color:transparent}

/* PLAYER */
.pw{
position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r3);overflow:hidden;background:#000;
border:1px solid var(--line2);box-shadow:var(--sh3),0 0 90px -40px rgba(76,141,255,.6);
animation:coverIn .8s var(--ease) both;user-select:none;
}
.pw.theater{border-radius:0;margin:0 -18px;width:calc(100% + 36px)}
.pw video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.pw .ovl{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .34s var(--ease);background:linear-gradient(180deg,rgba(0,0,0,.58) 0%,transparent 22%,transparent 58%,rgba(0,0,0,.72) 100%);opacity:1}
.pw.hide .ovl{opacity:0;pointer-events:none}
.pw.hide{cursor:none}
.pw .ptop{display:flex;align-items:center;gap:10px;padding:12px 14px}
.pw .ptop .ttl{min-width:0;flex:1}
.pw .ptop .ttl b{display:block;font-size:13.4px;font-weight:640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.pw .ptop .ttl span{font-size:11.2px;color:#b6c2d4;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.pw .pbtn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);transition:.26s var(--ease)}
.pw .pbtn:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.pw .pbtn:active{transform:scale(.88)}
.pw .pbtn[disabled]{opacity:.28;pointer-events:none}
.pw .pbtn svg{width:17px;height:17px}
.pw .pmid{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.pw .big{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;color:#fff;pointer-events:auto;background:rgba(76,141,255,.78);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.26);box-shadow:0 18px 50px -14px rgba(76,141,255,.9);transition:.36s var(--spring)}
.pw .big:hover{transform:scale(1.08)}
.pw .big:active{transform:scale(.9)}
.pw .big svg{width:28px;height:28px;margin-left:3px}
.pw.playing .big{opacity:0;transform:scale(.5);pointer-events:none}
.pw .spin{width:50px;height:50px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:#fff;animation:sp .8s linear infinite;display:none}
.pw.loading .spin{display:block}
.pw.loading .big{opacity:0;pointer-events:none}
@keyframes sp{to{transform:rotate(360deg)}}
.pw .pbot{padding:0 14px 12px}
.seek{position:relative;height:16px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.seek .rail-bg{position:relative;width:100%;height:4px;border-radius:99px;background:rgba(255,255,255,.18);transition:height .2s var(--ease)}
.seek:hover .rail-bg{height:6px}
.seek .buf{position:absolute;inset:0;width:0;border-radius:99px;background:rgba(255,255,255,.2)}
.seek .fill{position:absolute;inset:0;width:0;border-radius:99px;background:linear-gradient(90deg,#4C8DFF,#8AB6FF);box-shadow:0 0 14px rgba(76,141,255,.8)}
.seek .knob{position:absolute;top:50%;left:0;width:13px;height:13px;border-radius:50%;background:#fff;transform:translate(-50%,-50%) scale(0);box-shadow:0 2px 10px rgba(0,0,0,.7);transition:transform .2s var(--spring)}
.seek:hover .knob,.seek.drag .knob{transform:translate(-50%,-50%) scale(1)}
.seek .tip{position:absolute;bottom:20px;transform:translateX(-50%);padding:3px 8px;border-radius:7px;font-size:11px;font-weight:600;background:rgba(10,12,18,.9);border:1px solid rgba(255,255,255,.12);opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.seek:hover .tip{opacity:1}
.pctrl{display:flex;align-items:center;gap:6px;margin-top:4px}
.pctrl .grow{flex:1}
.pctrl .tm{font-size:11.6px;color:#d3dcea;font-variant-numeric:tabular-nums;font-weight:560;padding:0 4px}
.vol{display:flex;align-items:center;gap:2px}
.vol input[type=range]{-webkit-appearance:none;appearance:none;width:0;height:4px;border-radius:99px;background:rgba(255,255,255,.24);outline:0;transition:width .3s var(--ease),opacity .3s;opacity:0;cursor:pointer}
.vol:hover input[type=range],.vol.open input[type=range]{width:74px;opacity:1}
.vol input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 0 0 3px rgba(76,141,255,.35)}
.pmenu{position:absolute;right:12px;bottom:64px;z-index:8;min-width:198px;max-height:280px;overflow:auto;border-radius:15px;background:rgba(11,13,18,.94);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);border:1px solid var(--line2);box-shadow:var(--sh3);display:none;padding:6px}
.pmenu.open{display:block;animation:sheetIn .26s var(--ease)}
.pmenu .hd{padding:7px 10px 5px;font-size:10.6px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
.pmenu .mi{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:10px;font-size:13px;color:#c8d2e0;text-align:left;transition:.2s var(--ease)}
.pmenu .mi:hover{background:rgba(255,255,255,.08);color:#fff}
.pmenu .mi.on{color:var(--acc2);background:rgba(76,141,255,.1)}
.pmenu .mi svg{width:15px;height:15px;margin-left:auto;opacity:0}
.pmenu .mi.on svg{opacity:1}
.pmenu .mi .q{font-size:10.5px;color:var(--dim);margin-left:auto;font-weight:600}
.skipbtn{position:absolute;z-index:7;right:14px;bottom:76px;padding:9px 16px;border-radius:12px;font-size:12.8px;font-weight:680;background:rgba(255,255,255,.92);color:#0a0c11;box-shadow:0 12px 32px -12px rgba(0,0,0,.9);animation:sheetIn .3s var(--spring);transition:.24s var(--ease)}
.skipbtn:hover{transform:translateY(-2px) scale(1.03)}
.endcard{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(5,6,10,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);text-align:center;padding:20px}
.endcard.on{display:flex;animation:viewIn .4s var(--ease)}
.endcard b{font-family:'Sora Variable',sans-serif;font-size:19px}
.endcard p{margin:0;color:var(--mut);font-size:13px}
.psrc{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px;text-align:center;background:linear-gradient(160deg,#0B0D13,#07080C)}
.psrc.on{display:flex}
.psrc .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:var(--warn);background:rgba(255,159,10,.08);border:1px solid rgba(255,159,10,.22)}
.psrc .ic svg{width:26px;height:26px}
.psrc h4{font-size:16.5px;font-weight:700}
.psrc p{margin:0;color:var(--mut);font-size:12.8px;max-width:44ch;line-height:1.62}

/* SKELETON */
.sk{position:relative;overflow:hidden;background:rgba(255,255,255,.04);border-radius:var(--r2)}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:shim 1.5s infinite}
@keyframes shim{100%{transform:translateX(100%)}}
.sk-card{width:148px;aspect-ratio:2/3;border-radius:var(--r2)}
.sk-card.g{width:100%}

/* STATE */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:52px 22px;border-radius:var(--r4);background:var(--glass);border:1px solid var(--line)}
.state .ic{width:66px;height:66px;border-radius:22px;display:grid;place-items:center;color:var(--acc2);background:linear-gradient(150deg,rgba(76,141,255,.14),rgba(76,141,255,.03));border:1px solid rgba(125,180,255,.18);box-shadow:0 18px 44px -20px rgba(76,141,255,.6);animation:floaty 4.6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.state .ic svg{width:28px;height:28px}
.state h3{font-size:17px;font-weight:700}
.state p{margin:0;color:var(--mut);font-size:13.2px;max-width:44ch;line-height:1.65}

/* TOAST */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 22px);z-index:200;display:flex;flex-direction:column-reverse;gap:9px;pointer-events:none;width:min(420px,calc(100vw - 28px))}
.toast{display:flex;align-items:center;gap:11px;padding:12px 15px;border-radius:15px;pointer-events:auto;background:rgba(16,19,25,.92);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--line2);box-shadow:var(--sh3);animation:tIn .46s var(--spring);font-size:13.2px;font-weight:540}
.toast.out{animation:tOut .34s var(--ease) forwards}
@keyframes tIn{from{opacity:0;transform:translateY(22px) scale(.92);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes tOut{to{opacity:0;transform:translateY(14px) scale(.95);filter:blur(4px)}}
.toast .ti{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.toast .ti svg{width:15px;height:15px}
.toast.ok .ti{background:rgba(48,209,88,.12);color:var(--ok)}
.toast.err .ti{background:rgba(255,69,58,.12);color:var(--err)}
.toast.info .ti{background:rgba(76,141,255,.12);color:var(--acc2)}
.toast.warn .ti{background:rgba(255,159,10,.12);color:var(--warn)}

/* SHEET/MODAL */
#sheet-root{position:fixed;inset:0;z-index:300;display:none}
#sheet-root.open{display:block}
.sheet-bd{position:absolute;inset:0;background:rgba(3,4,7,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#12151B,#0A0C11);border-top:1px solid var(--line2);border-radius:var(--r4) var(--r4) 0 0;box-shadow:0 -30px 80px -20px rgba(0,0,0,.95);animation:sheetIn .44s var(--spring);overflow:hidden}
@keyframes sheetIn{from{transform:translateY(102%);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:rgba(255,255,255,.16);margin:9px auto 0;flex:none}
.sheet-hd{display:flex;align-items:center;gap:12px;padding:14px 18px 12px;flex:none;border-bottom:1px solid var(--line)}
.sheet-hd h3{font-size:16px;font-weight:700;flex:1}
.sheet-bd2{padding:16px 18px calc(22px + env(safe-area-inset-bottom));overflow-y:auto;flex:1}

/* SETTINGS */
.set-grp{margin-bottom:20px}
.set-grp>h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:0 0 10px}
.adp{border-radius:var(--r2);border:1px solid var(--line);background:rgba(255,255,255,.025);padding:13px;margin-bottom:10px;transition:.3s var(--ease)}
.adp.live{border-color:rgba(48,209,88,.25);background:rgba(48,209,88,.04)}
.adp.dead{border-color:rgba(255,69,58,.18)}
.adp .top{display:flex;align-items:center;gap:10px}
.adp .top b{font-size:13.4px;font-weight:650;flex:1;min-width:0}
.adp .desc{margin:7px 0 0;font-size:11.8px;color:var(--dim);line-height:1.58}
.adp .row2{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.inp{flex:1;min-width:0;height:38px;padding:0 12px;border-radius:11px;background:rgba(0,0,0,.28);border:1px solid var(--line);outline:0;font-size:12.8px;transition:.26s var(--ease)}
.inp:focus{border-color:rgba(125,180,255,.45);box-shadow:0 0 0 3px rgba(76,141,255,.1);background:rgba(0,0,0,.4)}
.inp::placeholder{color:var(--dim)}
.sw{width:44px;height:26px;border-radius:99px;background:rgba(255,255,255,.11);position:relative;flex:none;transition:.32s var(--ease);border:1px solid var(--line)}
.sw i{position:absolute;left:3px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:#8d97a8;transition:.34s var(--spring)}
.sw.on{background:linear-gradient(135deg,#4C8DFF,#2E6BE6);border-color:transparent}
.sw.on i{left:21px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.note{padding:12px 13px;border-radius:var(--r1);font-size:11.9px;line-height:1.66;color:var(--mut);background:rgba(255,159,10,.05);border:1px solid rgba(255,159,10,.14)}
.note a{color:var(--acc2);text-decoration:underline;text-underline-offset:2px}
.note b{color:#e8eefb}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12.4px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.06)}

    if(this.favs.length>220)this.favs.length=220;
    LS.set('favs',this.favs);emit('favs');return true;
  },
  addHist(o){this.hist=this.hist.filter(h=>h.key!==o.key);this.hist.unshift(o);if(this.hist.length>24)this.hist.length=24;LS.set('hist',this.hist)},
  setProg(key,t,d){this.progress[key]={t,d,ts:Date.now()};LS.set('prog',this.progress)},
  markWatched(key){this.watched[key]=Date.now();LS.set('watched',this.watched)},
  getProg(key){const p=this.progress[key];if(!p)return null;if(Date.now()-p.ts>1000*60*60*24*60)return null;return p},
  setCfg(k,v){this.cfg[k]=v;LS.set('cfg',this.cfg);emit('cfg')},
  setHealth(id,st,ms,url){this.health[id]={status:st,ms:ms||0,url:url||'',ts:Date.now()};LS.set('health',this.health);emit('health')}
};

/* ═══════ HTTP ═══════ */
const CACHE = new Map(), INFLIGHT = new Map();
const TTL_LIST = 1000*60*12, TTL_DETAIL = 1000*60*40;

class ApiError extends Error{
  constructor(msg,code,kind){super(msg);this.code=code;this.kind=kind||'api'}
}

async function fetchJSON(url,opt,key,ttl){
  if(key&&CACHE.has(key)){const c=CACHE.get(key);if(Date.now()-c.ts<ttl)return c.data}
  if(key&&INFLIGHT.has(key))return INFLIGHT.get(key);
  const p = (async()=>{
    const ctl = new AbortController();
    const to = setTimeout(()=>ctl.abort(),(opt&&opt.timeout)||18000);
    let res;
    try{res=await fetch(url,Object.assign({signal:ctl.signal,headers:{'Accept':'application/json'}},opt||{}))}
    catch(e){clearTimeout(to);if(e.name==='AbortError')throw new ApiError('Waktu permintaan habis.','TIMEOUT','network');throw new ApiError('Tidak dapat menghubungi server.','NETWORK','network')}
    clearTimeout(to);
    if(res.status===429)throw new ApiError('Batas permintaan API tercapai.','RATE_LIMIT','rate');
    if(res.status===404)throw new ApiError('Data tidak ditemukan.','NOT_FOUND','api');
    if(!res.ok)throw new ApiError('Server mengembalikan status '+res.status+'.','HTTP_'+res.status,'api');
    let data;
    try{data=await res.json()}catch{throw new ApiError('Respons server bukan JSON valid.','BAD_JSON','api')}
    if(key)CACHE.set(key,{data,ts:Date.now()});
    return data;
  })();
  if(key)INFLIGHT.set(key,p.finally(()=>INFLIGHT.delete(key)));
  return p;
}

function progress(onOff,pct){const g=$('#topgrad');g.classList.toggle('on',!!onOff);if(pct!=null)g.style.width=pct+'%';if(!onOff)setTimeout(()=>{g.style.width='0'},340)}

/* ═══════ API — Oploverz Primary, Fallback Chain ═══════ */
async function fetchAPI(endpoint,timeout=20000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(),timeout);
  try{
    const response = await fetch(`${API_BASE}${endpoint}`,{method:'GET',headers:{Accept:'application/json'},signal:controller.signal});
    const raw = await response.text();
    clearTimeout(timer);
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    try{return JSON.parse(raw)}catch{throw new Error('Tunnel mengirim response non-JSON.')}
  }catch(error){
    clearTimeout(timer);
    if(error.name==='AbortError') throw new Error('Request timeout.');
    throw error;
  }
}

/* Normalizers */
function normalizeOploverzCard(item){
  return {id:item.slug||item.animeId,slug:item.slug||'',provider:'oploverz',title:item.title||'Unknown',poster:item.poster||'',score:item.score||'-',type:item.type||'',status:item.status||'',episodes:item.episodes||'',meta:item.type||''};
}
function normalizeOtakudesuCard(item){
  return {id:item.animeId,slug:'',provider:'otakudesu',title:item.title||'Unknown',poster:item.poster||'',score:item.score||'-',type:item.type||'',status:item.status||'',episodes:item.episodes||'',meta:item.latestReleaseDate||item.lastReleaseDate||item.releaseDay||''};
}
function normalizeGenreCard(item){
  return {id:item.animeId,slug:'',provider:'otakudesu',title:item.title||'Unknown',poster:item.poster||'',score:item.score||'-',type:'',status:'',episodes:item.episodes||'',meta:item.season||item.studios||''};
}

const API = {
  /* HOME — Oploverz primary, fallback Otakudesu */
  async home(){
    let ongoing=[], completed=[];
    /* Try Oploverz first */
    try{
      const r = await fetchAPI('/oploverz/home');
      const d = r?.data;
      if(d){
        ongoing = (d.ongoing?.animeList||d.trending?.animeList||[]).map(normalizeOploverzCard);
        completed = (d.completed?.animeList||[]).map(normalizeOploverzCard);
      }
    }catch{}
    /* Fallback to Otakudesu if Oploverz empty */
    if(!ongoing.length||!completed.length){
      try{
        const r = await fetchAPI('/otakudesu/home');
        const d = r?.data;
        if(d){
          if(!ongoing.length) ongoing = (d.ongoing?.animeList||[]).map(normalizeOtakudesuCard);
          if(!completed.length) completed = (d.completed?.animeList||[]).map(normalizeOtakudesuCard);
        }
      }catch{}
    }
    return {ongoing,completed};
  },

  /* GENRES — from Otakudesu (Oploverz doesn't have genre endpoint in this API) */
  async genres(){
    try{const r=await fetchAPI('/otakudesu/genre');return r?.data?.genreList||[]}catch{return[]}
  },

  /* ONGOING */
  async ongoing(page=1){
    let result;
    try{
      result = await fetchAPI(`/oploverz/ongoing?page=${page}`);
      const list = (result?.data?.animeList||[]).map(normalizeOploverzCard);
      if(list.length) return {list,pagination:result?.pagination||null};
    }catch{}
    try{
      result = await fetchAPI(`/otakudesu/ongoing?page=${page}`);
      return {list:(result?.data?.animeList||[]).map(normalizeOtakudesuCard),pagination:result?.pagination||null};
    }catch{return{list:[],pagination:null}}
  },

  /* COMPLETED */
  async completed(page=1){
    let result;
    try{
      result = await fetchAPI(`/oploverz/completed?page=${page}`);
      const list = (result?.data?.animeList||[]).map(normalizeOploverzCard);
      if(list.length) return {list,pagination:result?.pagination||null};
    }catch{}
    try{
      result = await fetchAPI(`/otakudesu/completed?page=${page}`);
      return {list:(result?.data?.animeList||[]).map(normalizeOtakudesuCard),pagination:result?.pagination||null};
    }catch{return{list:[],pagination:null}}
  },

  /* GENRE */
  async genre(genreId,page=1){
    const r = await fetchAPI(`/otakudesu/genre/${encodeURIComponent(genreId)}?page=${page}`);
    return {list:(r?.data?.animeList||[]).map(normalizeGenreCard),pagination:r?.pagination||null};
  },

  /* SEARCH — Oploverz primary, fallback Otakudesu */
  async search(query){
    let results = [];
    try{
      const r = await fetchAPI(`/oploverz/search?q=${encodeURIComponent(query)}`);
      results = (r?.data?.animeList||[]).map(normalizeOploverzCard);
      if(results.length) return results;
    }catch{}
    try{
      const r = await fetchAPI(`/otakudesu/search?q=${encodeURIComponent(query)}`);
      results = (r?.data?.animeList||[]).map(normalizeOtakudesuCard);
      if(results.length) return results;
    }catch{}
    return [];
  },

  /* DETAIL */
  async detail(provider,id,slug=''){
    let endpoint;
    if(provider==='oploverz') endpoint=`/oploverz/anime/${encodeURIComponent(id)}`;
    else if(provider==='otakudesu') endpoint=`/otakudesu/anime/${encodeURIComponent(id)}`;
    else if(provider==='kuramanime') endpoint=`/kuramanime/anime/${encodeURIComponent(id)}/${encodeURIComponent(slug||id)}`;
    else throw new Error('Provider tidak tersedia.');
    const r = await fetchAPI(endpoint);
    const data = r?.data?.details;
    if(!data) throw new Error('Detail anime tidak ditemukan.');

    if(provider==='oploverz'){
      return {id,slug:data.title?id:id,provider,title:data.title||'Unknown',alt:'',poster:data.poster||'',score:data.rating||'-',type:data.type||'-',status:data.status||'-',year:data.releasedOn||'-',episodes:(data.episodeList||[]).length,duration:data.duration||'-',studio:data.studio||'-',genres:Array.isArray(data.genres)?data.genres:[],synopsis:(data.synopsis?.paragraphList||[]).join('\n\n')||'Sinopsis tidak tersedia.',episodeList:(data.episodeList||[]).map(i=>{const href=i.href||'';const s=href.split('/').filter(Boolean).pop()||'';return{num:i.episode,id:href,slug:s,date:i.date||''}})};
    }
    if(provider==='otakudesu'){
      return {id,slug:'',provider,title:data.title||'Unknown',alt:data.japanese||'',poster:data.poster||'',score:data.score||'-',type:data.type||'-',status:data.status||'-',year:data.aired||'-',episodes:data.episodes||'-',duration:data.duration||'-',studio:data.studios||'-',genres:(data.genreList||[]).map(i=>i.title),synopsis:(data.synopsis?.paragraphList||[]).join('\n\n')||'Sinopsis tidak tersedia.',episodeList:(data.episodeList||[]).map(i=>({num:i.title,id:i.episodeId,slug:'',date:''}))};
    }
    return {id:data.animeId||id,slug:data.animeSlug||slug,provider,title:data.title||'Unknown',alt:data.alternativeTitle||'',poster:data.poster||'',score:data.score||'-',type:data.type?.title||'-',status:data.status?.title||'-',year:data.aired||'-',episodes:data.episodes||'-',duration:data.duration||'-',studio:Array.isArray(data.studioList)?data.studioList.map(x=>x.title).join(', '):'-',genres:(data.genreList||[]).map(x=>String(x.title||'').replace(/\s+/g,' ').trim()),synopsis:(data.synopsis?.paragraphList||[]).join('\n\n')||'Sinopsis tidak tersedia.',episodeList:[]};
  },

  /* EPISODE */
  async episode(provider,params){
    let endpoint;
    if(provider==='oploverz') endpoint=`/oploverz/episode/${encodeURIComponent(params.episodeSlug||params.episodeId)}`;
    else if(provider==='otakudesu') endpoint=`/otakudesu/episode/${encodeURIComponent(params.episodeId)}`;
    else if(provider==='kuramanime') endpoint=`/kuramanime/episode/${encodeURIComponent(params.animeId)}/${encodeURIComponent(params.animeSlug)}/${encodeURIComponent(params.episodeId)}`;
    else throw new Error('Provider tidak tersedia.');
    const r = await fetchAPI(endpoint);
    const details = r?.data?.details;
    if(!details) throw new Error('Data episode tidak ditemukan.');
    if(provider==='oploverz') return {provider,title:details.title||`Episode ${params.episode}`,playerUrl:details.streamingUrl||'',qualities:[]};
    if(provider==='otakudesu') return {provider,title:details.title||`Episode ${params.episode}`,playerUrl:details.defaultStreamingUrl||'',qualities:(details.server?.qualityList||[]).map(q=>({title:String(q.title||'').replace(/\s+/g,' ').trim(),servers:(q.serverList||[]).map(s=>({name:s.title,id:s.serverId}))}))};
    return {provider,title:details.episodeTitle||details.title||`Episode ${params.episode}`,playerUrl:'',qualities:Array.isArray(details.server?.qualityList)?details.server.qualityList:[]};
  },

  /* RESOLVE SERVER */
  async resolveServer(serverId){const r=await fetchAPI(`/otakudesu/server/${encodeURIComponent(serverId)}`);return r?.data?.details?.url||''}
};

/* ═══════ REVEAL + LAZY ═══════ */
let IO=null;
function initReveal(root){
  if(!IO){IO=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');IO.unobserve(e.target)}})},{rootMargin:'0px 0px -8% 0px',threshold:.05})}
  $$('.rv:not(.in),.rv-s:not(.in)',root||document).forEach(n=>IO.observe(n));
}

let IMG_IO=null;
function initLazy(root){
  if(!IMG_IO){IMG_IO=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const im=e.target;if(im.dataset.src){im.src=im.dataset.src;delete im.dataset.src}IMG_IO.unobserve(im)}})},{rootMargin:'400px 0px'})}
  $$('img[data-src]',root||document).forEach(n=>IMG_IO.observe(n));
}

function initRails(root){
  $$('[data-railwrap]',root||document).forEach(w=>{
    const tr=$('.rail-track',w);if(!tr||tr._ok)return;tr._ok=1;
    const upd=()=>{w.classList.toggle('s-start',tr.scrollLeft<8);w.classList.toggle('e-end',tr.scrollLeft+tr.clientWidth>=tr.scrollWidth-8)};
    tr.addEventListener('scroll',()=>{upd()},{passive:true});upd();
    let down=false,sx=0,sl=0,moved=0;
    tr.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;down=true;moved=0;sx=e.clientX;sl=tr.scrollLeft});
    window.addEventListener('pointermove',e=>{if(!down)return;const d=e.clientX-sx;moved=Math.abs(d);if(moved>6){tr.scrollLeft=sl-d;e.preventDefault()}},{passive:false});
    window.addEventListener('pointerup',()=>{down=false});
    tr.addEventListener('click',e=>{if(moved>10){e.preventDefault();e.stopPropagation()}},true);
  });
}

/* ═══════ ROUTER ═══════ */
const view=$('#view');
function parseHash(){
  let h=(location.hash||'#/home').replace(/^#/,'');
  let qs='';
  const qi=h.indexOf('?');if(qi>-1){qs=h.slice(qi+1);h=h.slice(0,qi)}
  const parts=h.split('/').filter(Boolean).map(decodeURIComponent);
  const query={};
  qs.split('&').filter(Boolean).forEach(kv=>{const i=kv.indexOf('=');query[decodeURIComponent(kv.slice(0,i))]=decodeURIComponent(kv.slice(i+1)||'')});
  return {parts,q:query,path:h||'/home'};
}
function go(path,replace){const target='#'+path;if(location.hash===target){render();return}if(replace)location.replace(target);else location.hash=target}
function back(){if(history.length>1)history.back();else go('/home')}

let curRoute='';
async function render(){
  const r=parseHash();
  const route=r.parts[0]||'home';
  view.classList.remove('anim-in');void view.offsetWidth;view.classList.add('anim-in');
  const showBack=['anime','watch','schedule','genre','explore'].indexOf(route)>-1;
  $('#tbBack').style.display=showBack?'grid':'none';
  $('#tbBrand').style.display=showBack?'none':'flex';
  renderNav();
  window.scrollTo({top:0,behavior:'auto'});
  curRoute=route;
  try{
    if(route==='home')await ViewHome(r);
    else if(route==='search')await ViewSearch(r);
    else if(route==='explore')await ViewExplore(r);
    else if(route==='favorite')await ViewFavorite(r);
    else if(route==='history')await ViewHistory(r);
    else if(route==='anime')await ViewDetail(r);
    else if(route==='watch')await ViewWatch(r);
    else if(route==='schedule')await ViewSchedule(r);
    else if(route==='genre')await ViewGenre(r);
    else await ViewHome(r);
  }catch(e){
    console.error(e);
    view.innerHTML='<div class="shell">'+stateHTML('err','Terjadi kesalahan',e.message||'Tidak dapat memuat halaman.','<button class="btn primary" data-act="reload">'+svg('refresh','',2.1)+' Muat ulang</button>')+'</div>';
  }
  initReveal(view);initLazy(view);initRails(view);
  document.title='Nanime'+(r.parts.length>1?' · '+r.parts.map(decodeURIComponent).slice(-1)[0]:'');
}
window.addEventListener('hashchange',render);

  const param=r.parts[1]||'';
  const provider=r.q.provider||'oploverz';

  view.innerHTML='<div class="shell"><div style="height:280px;border-radius:var(--r3);margin-top:18px" class="sk"></div></div>';

  try{
    progress(true,30);
    const anime = await API.detail(provider,param,r.q.slug||'');
    progress(true,100);setTimeout(()=>progress(false),260);
    DET=anime;
    renderDetail(anime);
  }catch(e){
    progress(false);
    view.innerHTML='<div class="shell" style="padding-top:40px">'+stateHTML('err','Gagal memuat detail',e.message||'Terjadi kesalahan.','<div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px"><button class="btn primary" data-act="reload">'+svg('refresh','',2.1)+' Coba lagi</button><a class="btn ghost" href="#/home">Beranda</a></div>')+'</div>';
  }
}

function renderDetail(anime){
  const fav=Store.isFav(anime.id);
  EP=anime.episodeList||[];
  EPTYPE=Store.cfg.type||'sub';

  view.innerHTML=
    '<div class="detail-hero">'+
    (anime.poster?'<div class="bd" style="background-image:url(\''+esc(anime.poster)+'\')"></div>':'')+
    '<div class="shell"><div class="detail-in">'+
    '<div class="cover-box"><div class="in"><img src="'+esc(anime.poster)+'" alt="Poster '+esc(anime.title)+'" loading="eager"></div></div>'+
    '<div class="detail-meta">'+
    '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px">'+
    '<span class="badge" style="position:static">'+esc(PROVIDERS[anime.provider]?.name||anime.provider)+'</span>'+
    (anime.status&&anime.status!=='-'?'<span class="badge" style="position:static">'+esc(anime.status)+'</span>':'')+
    '</div>'+
    '<h1>'+esc(anime.title)+'</h1>'+
    (anime.alt?'<div class="alt">'+esc(anime.alt)+'</div>':'')+
    '<div class="stats">'+
    (anime.score&&anime.score!=='-'?'<span class="stat">'+svg('star','',1.8)+' <b>'+esc(anime.score)+'</b></span>':'')+
    (anime.type&&anime.type!=='-'?'<span class="stat">'+svg('film','',1.9)+' <b>'+esc(anime.type)+'</b></span>':'')+
    (anime.episodes&&anime.episodes!=='-'?'<span class="stat">'+svg('list','',1.9)+' <b>'+esc(String(anime.episodes))+'</b> Eps</span>':'')+
    (anime.duration&&anime.duration!=='-'?'<span class="stat">'+svg('clock','',1.9)+' <b>'+esc(anime.duration)+'</b></span>':'')+
    (anime.studio&&anime.studio!=='-'?'<span class="stat">'+svg('compass','',1.9)+' <b>'+esc(anime.studio)+'</b></span>':'')+
    '</div>'+
    '<div class="detail-actions">'+
    (EP.length?'<button class="btn primary" data-act="watch-first" data-ep="0">'+svg('play','',2.2)+' Tonton EP '+esc(EP[0].num)+'</button>':'')+
    '<button class="btn'+(fav?' danger':' ghost')+'" data-fav="'+esc(anime.id)+'" data-provider="'+esc(anime.provider)+'" data-cover="'+esc(anime.poster)+'" data-slug="'+esc(anime.slug||'')+'" data-title="'+esc(anime.title)+'" data-year="'+(anime.year||'')+'" data-score="'+(anime.score||0)+'" id="bigFav" aria-pressed="'+fav+'">'+(fav?svg('heart','',2.1)+' Tersimpan':svg('heart','',2.1)+' Favorit')+'</button>'+
    '</div></div></div></div></div>'+
    '<div class="shell" style="padding-top:22px;display:grid;gap:16px">'+
    '<section class="panel rv"><h3>'+svg('list','',2)+' Sinopsis</h3><div class="syn clip" id="syn">'+esc(anime.synopsis||'Sinopsis tidak tersedia.')+'</div>'+((anime.synopsis||'').length>340?'<button class="readmore" data-act="toggle-syn">Baca selengkapnya '+svg('down','',2.4)+'</button>':'')+'</section>'+
    (anime.genres&&anime.genres.length?'<section class="panel rv"><h3>'+svg('spark','',2)+' Genre</h3><div style="display:flex;gap:8px;flex-wrap:wrap">'+anime.genres.map(g=>'<span class="chip">'+esc(g)+'</span>').join('')+'</div></section>':'')+
    '<section class="panel rv" id="epPanel"><h3>'+svg('film','',2)+' Daftar Episode <span style="font-size:11.5px;color:var(--dim);font-weight:500">· '+EP.length+' entri</span></h3>'+
    (EP.length?'<div class="ep-grid" style="max-height:380px;overflow:auto">'+EP.map((e,i)=>'<button class="ep rv-s" style="--d:'+((i%10)*26)+'ms" data-ep-idx="'+i+'" aria-label="Putar episode '+esc(e.num)+'"><span class="no">'+e.num+'</span><span class="tx"><b>Episode '+esc(e.num)+'</b><span>'+esc(e.date||'')+'</span></span><span class="go">'+svg('play','',2.2)+'</span></button>').join('')+'</div>':'<div class="state" style="padding:30px">Episode belum tersedia.</div>')+
    '</section>'+
    footerHTML()+'</div>';

  initReveal(view);initLazy(view);

  $$('[data-ep-idx]').forEach(b=>{
    b.addEventListener('click',()=>{
      const idx=+b.dataset.epIdx;
      const ep=EP[idx];
      go('/watch/'+encodeURIComponent(anime.slug||anime.id)+'/'+encodeURIComponent(ep.num)+'?provider='+encodeURIComponent(anime.provider)+'&eid='+encodeURIComponent(ep.id)+'&eslug='+encodeURIComponent(ep.slug||''));
    });
  });
}

/* ═══════ VIEW: WATCH ═══════ */
let PLAYER=null;

async function ViewWatch(r){
  const param=r.parts[1]||'';
  const epNum=r.parts[2]||'1';
  const provider=r.q.provider||'oploverz';
  const eid=r.q.eid||'';
  const eslug=r.q.eslug||'';

  view.innerHTML='<div class="shell" style="padding-top:16px"><div id="wHost"><div class="sk" style="aspect-ratio:16/9;border-radius:var(--r3);width:100%"></div></div><div id="wInfo" style="margin-top:16px"></div></div>';

  let anime;
  try{
    anime = await API.detail(provider,param,eslug);
  }catch(e){
    view.innerHTML='<div class="shell">'+stateHTML('err','Gagal memuat anime',e.message||'','<button class="btn primary" data-act="reload">'+svg('refresh','',2.1)+' Coba lagi</button>')+'</div>';
    return;
  }
  DET=anime;

  const ep = (anime.episodeList||[]).find(e=>String(e.num)===String(epNum));
  const epIdx = (anime.episodeList||[]).findIndex(e=>String(e.num)===String(epNum));
  const prevEp = epIdx>0?anime.episodeList[epIdx-1]:null;
  const nextEp = epIdx>=0&&epIdx<anime.episodeList.length-1?anime.episodeList[epIdx+1]:null;

  $('#wInfo').innerHTML=
    '<div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:240px">'+
    '<a href="#/anime/'+esc(anime.slug||anime.id)+'?provider='+encodeURIComponent(provider)+'" class="link-more" style="margin-bottom:8px">'+svg('back','',2.4)+' '+esc(anime.title)+'</a>'+
    '<h1 style="font-size:clamp(19px,4vw,26px);font-weight:740;margin-top:6px">Episode '+esc(epNum)+'</h1>'+
    '<div class="stats" style="margin-top:10px"><span class="stat">'+svg('film','',1.9)+' <b>'+esc(epNum)+'</b></span>'+(anime.type&&anime.type!=='-'?'<span class="stat">'+esc(anime.type)+'</span>':'')+'</div></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn ghost sm" data-fav="'+esc(anime.id)+'" data-provider="'+esc(anime.provider)+'" data-cover="'+esc(anime.poster)+'" data-slug="'+esc(anime.slug||'')+'" data-title="'+esc(anime.title)+'" data-year="'+(anime.year||'')+'" data-score="'+(anime.score||0)+'">'+svg('heart','',2.1)+' Favorit</button>'+
    '<a class="btn ghost sm" href="#/anime/'+esc(anime.slug||anime.id)+'?provider='+encodeURIComponent(provider)+'">'+svg('list','',2)+' Episode</a>'+
    '</div></div>'+
    '<div id="wEpNav" style="display:flex;gap:9px;margin-top:18px;flex-wrap:wrap">'+
    (prevEp?'<a class="btn ghost" href="#/watch/'+encodeURIComponent(anime.slug||anime.id)+'/'+encodeURIComponent(prevEp.num)+'?provider='+encodeURIComponent(provider)+'&eid='+encodeURIComponent(prevEp.id)+'&eslug='+encodeURIComponent(prevEp.slug||'')+'">'+svg('prev','',2.2)+' EP '+esc(prevEp.num)+'</a>':'')+
    (nextEp?'<a class="btn primary" href="#/watch/'+encodeURIComponent(anime.slug||anime.id)+'/'+encodeURIComponent(nextEp.num)+'?provider='+encodeURIComponent(provider)+'&eid='+encodeURIComponent(nextEp.id)+'&eslug='+encodeURIComponent(nextEp.slug||'')+'">EP '+esc(nextEp.num)+' '+svg('next','',2.2)+'</a>':'')+
    '</div>';

  try{
    progress(true,45);
    const stream = await API.episode(provider,{episodeId:eid||epNum,episodeSlug:eslug||epNum,episode:epNum,animeId:anime.id,animeSlug:anime.slug||''});
    progress(true,100);setTimeout(()=>progress(false),240);

    let playerUrl = stream.playerUrl||'';

    const playerMarkup = playerUrl?
      '<iframe id="playerFrame" src="'+esc(playerUrl)+'" allowfullscreen loading="eager" referrerpolicy="no-referrer" style="width:100%;height:100%;border:0;background:#000"></iframe>':
      '<div class="psrc on"><div class="ic">'+svg('server','',1.7)+'</div><h4>Player tidak tersedia</h4><p>Provider tidak memberikan URL player untuk episode ini.</p></div>';

    $('#wHost').innerHTML='<div class="pw'+(Store.cfg.theater?' theater':'')+'">'+playerMarkup+'</div>';

    if(stream.qualities&&stream.qualities.length){
      const srvHTML='<div style="margin-top:16px"><div style="font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:9px">Server & Kualitas</div><div class="srv">'+stream.qualities.map(q=>q.servers.map(s=>'<button class="srv-btn" data-server-id="'+esc(s.id)+'">'+esc(s.name)+'</button>').join('')).join('')+'</div></div>';
      $('#wInfo').insertAdjacentHTML('beforeend',srvHTML);

      $$('.srv-btn').forEach(b=>{
        b.addEventListener('click',async()=>{
          const serverId=b.dataset.serverId;
          if(!serverId||provider!=='otakudesu'){toast('Resolver hanya untuk Otakudesu.','err');return}
          b.textContent='Memuat…';b.disabled=true;
          try{
            const url=await API.resolveServer(serverId);
            if(!url) throw new Error('URL kosong.');
            const iframe=$('#playerFrame');
            if(iframe) iframe.src=url;
            $$('.srv-btn').forEach(x=>x.classList.remove('on'));
            b.classList.add('on');
            toast('Server aktif.','ok');
          }catch(e){toast(e.message,'err')}
          finally{b.disabled=false;b.textContent=PROVIDERS[provider]?.name||'Server'}
        });
      });
    }

    /* Save history */
    Store.addHist({key:anime.id+':'+epNum,type:EPTYPE,id:anime.id,slug:anime.slug||anime.id,title:anime.title,cover:anime.poster,ep:epNum,provider,t:0,dur:0});

  }catch(e){
    progress(false);
    $('#wHost').innerHTML='<div class="pw"><div class="psrc on"><div class="ic">'+svg('alert','',1.7)+'</div><h4>Stream gagal dimuat</h4><p>'+esc(e.message||'Tidak ada sumber.')+'</p><div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px"><button class="btn primary" data-act="reload">'+svg('refresh','',2.1)+' Coba lagi</button><a class="btn ghost" href="#/anime/'+esc(anime.slug||anime.id)+'?provider='+encodeURIComponent(provider)+'">Kembali</a></div></div></div>';
  }
}

/* ═══════ GLOBAL EVENTS ═══════ */
document.addEventListener('click',async e=>{
  /* Favorite toggle */
  const fav=e.target.closest('[data-fav]');
  if(fav){
    e.preventDefault();e.stopPropagation();
    const id=fav.dataset.fav;
    const provider=fav.dataset.provider||'oploverz';
    const added=Store.toggleFav({id,slug:fav.dataset.slug,title:fav.dataset.title,cover:fav.dataset.cover,year:+fav.dataset.year||null,score:+fav.dataset.score||0,provider});
    $$('[data-fav="'+id+'"]').forEach(b=>{
      b.classList.toggle('on',added);
      b.setAttribute('aria-pressed',String(added));
      b.classList.remove('beat');void b.offsetWidth;b.classList.add('beat');
      if(b.id==='bigFav'){b.className='btn'+(added?' danger':' ghost');b.innerHTML=added?svg('heart','',2.1)+' Tersimpan':svg('heart','',2.1)+' Favorit'}
    });
    toast(added?'Ditambahkan ke favorit.':'Dihapus dari favorit.',added?'ok':'info');
    renderNav();
    if(curRoute==='favorite')ViewFavorite();
    return;
  }

  /* Actions */
  const act=e.target.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='open-settings'){e.preventDefault();openSettings();return}
    if(a==='close-sheet'){e.preventDefault();closeSheet();return}
    if(a==='reload'){location.reload();return}
    if(a==='back'){e.preventDefault();back();return}
    if(a==='goto'){e.preventDefault();go(act.dataset.to.replace(/^#/,''));return}
    if(a==='toggle-syn'){const s=$('#syn');const open=s.classList.toggle('clip')===false;act.classList.toggle('open',open);act.innerHTML=(open?'Tampilkan lebih sedikit ':'Baca selengkapnya ')+svg('down','',2.4);return}
    if(a==='watch-first'){
      if(!DET)return;
      const idx=+act.dataset.ep;
      const ep=DET.episodeList[idx];
      if(ep) go('/watch/'+encodeURIComponent(DET.slug||DET.id)+'/'+encodeURIComponent(ep.num)+'?provider='+encodeURIComponent(DET.provider)+'&eid='+encodeURIComponent(ep.id)+'&eslug='+encodeURIComponent(ep.slug||''));
      return;
    }
    if(a==='clear-data'){
      if(confirm('Hapus semua data lokal?')){Store.favs=[];Store.hist=[];Store.progress={};Store.watched={};LS.set('favs',[]);LS.set('hist',[]);LS.set('prog',{});LS.set('watched',{});toast('Data dihapus.','ok');renderNav();closeSheet();render()}
      return;
    }
    if(a==='clear-fav'){
      if(confirm('Kosongkan semua favorit?')){Store.favs=[];LS.set('favs',[]);renderNav();ViewFavorite();toast('Favorit dikosongkan.','ok')}
      return;
    }
    if(a==='clear-hist'){
      if(confirm('Hapus semua riwayat?')){Store.hist=[];LS.set('hist',[]);ViewHistory();toast('Riwayat dihapus.','ok')}
      return;
    }
    if(a==='cfg-auto'){Store.setCfg('autoNext',!Store.cfg.autoNext);act.classList.toggle('on',Store.cfg.autoNext);return}
    if(a==='cfg-theater'){Store.setCfg('theater',!Store.cfg.theater);act.classList.toggle('on',Store.cfg.theater);const pw=$('.pw');if(pw)pw.classList.toggle('theater',Store.cfg.theater);return}
    if(a==='cfg-type'){Store.setCfg('type',act.dataset.v);toast('Audio: '+act.dataset.v.toUpperCase(),'ok');return}
    if(a==='rail'){railScroll(act.dataset.rail,+act.dataset.dir);return}
  }

  const railBtn=e.target.closest('[data-rail]');
  if(railBtn){e.preventDefault();railScroll(railBtn.dataset.rail,+railBtn.dataset.dir);return}
});

/* ═══════ BOOT ═══════ */
function boot(){
  renderNav();
  if(!location.hash)location.replace('#/home');
  render();
  window.addEventListener('storage',ev=>{
    if(ev.key&&ev.key.indexOf('nanime.v1.')===0){
      Store.favs=LS.get('favs',[]);Store.hist=LS.get('hist',[]);Store.progress=LS.get('prog',{});Store.watched=LS.get('watched',{});
      renderNav();
    }
  });
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();

})();
</script>
