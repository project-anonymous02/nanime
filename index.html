<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="color-scheme" content="light">
<script>
(function () {
  try {
    var theme = 'light';
    var raw = localStorage.getItem('nanime.v2.theme');
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && parsed.state && (parsed.state.theme === 'dark' || parsed.state.theme === 'light')) {
        theme = parsed.state.theme;
      }
    }
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.colorScheme = theme;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#000000' : '#F2F2F7');
    var scheme = document.querySelector('meta[name="color-scheme"]');
    if (scheme) scheme.setAttribute('content', theme);
  } catch (e) { /* pakai light bila storage tidak tersedia */ }
})();
</script>
<meta name="description" content="Nanime — platform anime, donghua & movie untuk komunitas Indonesia.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nanime">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' https: blob:; frame-src 'self' https: http:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'">
<title>Nanime</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="manifest" href="manifest.webmanifest">

</head>
<body>
<div id="root"></div>
<noscript>Aktifkan JavaScript untuk memakai Nanime.</noscript>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
