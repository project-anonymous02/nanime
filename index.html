<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080A0F">
<meta name="color-scheme" content="dark">

<title>Nanime</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#080A0F;
  --bg2:#0D1118;
  --bg3:#121824;
  --bg4:#182131;

  --text:#F2F5FA;
  --text2:#AEB7C6;
  --text3:#727D90;

  --primary:#7893FF;
  --primary2:#9DAFFF;
  --primarySoft:rgba(120,147,255,.13);

  --pink:#F276A8;

  --green:#39D69F;
  --yellow:#F7C95D;
  --red:#FF7373;

  --border:rgba(255,255,255,.075);
  --border2:rgba(255,255,255,.13);

  --shadow:0 25px 70px rgba(0,0,0,.45);

  --r1:14px;
  --r2:18px;
  --r3:25px;

  --ease:cubic-bezier(.22,1,.36,1);
}

html{
  background:var(--bg);
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  color:var(--text);
  background:
    radial-gradient(
      circle at 15% -5%,
      rgba(120,147,255,.14),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 20%,
      rgba(242,118,168,.07),
      transparent 28%
    ),
    var(--bg);

  font-family:
    "Inter",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  line-height:1.5;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  color:inherit;
}

img{
  max-width:100%;
  display:block;
}

a{
  color:inherit;
  text-decoration:none;
}

::-webkit-scrollbar{
  width:7px;
  height:7px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.13);
  border-radius:99px;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background-orb{
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  pointer-events:none;
  filter:blur(100px);
  opacity:.07;
  z-index:-1;
  animation:orbFloat 12s ease-in-out infinite;
}

.orb1{
  top:-160px;
  left:-160px;
  background:#6685ff;
}

.orb2{
  right:-180px;
  top:35%;
  background:#ec5d9a;
  animation-delay:-5s;
}

@keyframes orbFloat{
  0%,100%{
    transform:translate3d(0,0,0);
  }
  50%{
    transform:translate3d(20px,30px,0);
  }
}

/* =========================================================
   APP
========================================================= */

#app{
  min-height:100vh;
}

.main{
  min-height:100vh;
  padding-bottom:95px;
}

.container{
  width:min(1480px,100%);
  margin:auto;
  padding:18px;
}

/* =========================================================
   TOPBAR
========================================================= */

.topbar{
  position:sticky;
  top:0;
  z-index:500;

  display:flex;
  align-items:center;
  gap:12px;

  padding:
    12px
    max(16px,env(safe-area-inset-left))
    12px
    max(16px,env(safe-area-inset-right));

  background:rgba(8,10,15,.76);
  backdrop-filter:blur(24px) saturate(145%);
  -webkit-backdrop-filter:blur(24px) saturate(145%);

  border-bottom:1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand-logo{
  width:36px;
  height:36px;
  border-radius:11px;
  object-fit:cover;

  border:1px solid var(--border2);
  background:var(--bg3);

  box-shadow:0 8px 25px rgba(0,0,0,.28);
}

.brand-name{
  font-size:17px;
  font-weight:800;
  letter-spacing:-.035em;

  background:
    linear-gradient(
      135deg,
      #ffffff 0%,
      var(--primary2) 55%,
      var(--pink) 100%
    );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.top-spacer{
  flex:1;
}

.top-button{
  width:40px;
  height:40px;

  border-radius:12px;

  display:grid;
  place-items:center;

  background:rgba(255,255,255,.045);
  border:1px solid var(--border);

  cursor:pointer;

  transition:
    transform .25s var(--ease),
    background .25s,
    border-color .25s;
}

.top-button:hover{
  background:rgba(255,255,255,.075);
  border-color:var(--border2);
}

.top-button:active{
  transform:scale(.92);
}

/* =========================================================
   DESKTOP SIDEBAR
========================================================= */

.sidebar{
  display:none;
}

.side-brand{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:32px;
}

.side-brand img{
  width:42px;
  height:42px;
  border-radius:13px;
}

.side-brand strong{
  font-size:21px;

  background:
    linear-gradient(
      135deg,
      #fff,
      var(--primary2),
      var(--pink)
    );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.side-nav{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.side-nav-item{
  width:100%;

  display:flex;
  align-items:center;
  gap:13px;

  padding:12px 14px;

  color:var(--text2);

  border:1px solid transparent;
  border-radius:13px;

  cursor:pointer;

  transition:
    background .25s,
    color .25s,
    transform .25s,
    border-color .25s;
}

.side-nav-item:hover{
  color:var(--text);
  background:rgba(255,255,255,.04);
  transform:translateX(2px);
}

.side-nav-item.active{
  color:var(--primary2);
  background:var(--primarySoft);
  border-color:rgba(120,147,255,.20);
}

.side-footer{
  margin-top:auto;

  padding:14px;

  border:1px solid var(--border);
  border-radius:15px;

  background:rgba(255,255,255,.025);

  color:var(--text3);
  font-size:11px;
}

.api-dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;

  margin-right:6px;

  background:var(--yellow);
}

.api-dot.online{
  background:var(--green);
  box-shadow:0 0 12px rgba(57,214,159,.6);
}

.api-dot.offline{
  background:var(--red);
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:550;

  display:grid;
  grid-template-columns:repeat(5,1fr);

  padding:
    8px
    8px
    calc(8px + env(safe-area-inset-bottom));

  background:rgba(8,10,15,.82);

  backdrop-filter:blur(25px) saturate(150%);
  -webkit-backdrop-filter:blur(25px) saturate(150%);

  border-top:1px solid var(--border);
}

.bottom-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:4px;

  padding:7px 2px;

  color:var(--text3);

  border-radius:13px;

  cursor:pointer;

  transition:
    color .25s,
    background .25s,
    transform .25s;
}

.bottom-item svg{
  width:21px;
  height:21px;
}

.bottom-item span{
  font-size:10px;
  font-weight:600;
}

.bottom-item.active{
  color:var(--primary2);
  background:rgba(120,147,255,.08);
}

.bottom-item:active{
  transform:scale(.94);
}

/* =========================================================
   PAGE TRANSITION
========================================================= */

.page-enter{
  animation:
    pageEnter .42s var(--ease) both;
}

@keyframes pageEnter{
  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================================================
   HERO
========================================================= */

.hero{
  position:relative;
  overflow:hidden;

  min-height:390px;

  border-radius:var(--r3);

  border:1px solid var(--border);

  box-shadow:var(--shadow);

  background:#10151e;

  isolation:isolate;
}

.hero video{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  opacity:.48;

  z-index:-2;
}

.hero::after{
  content:"";

  position:absolute;
  inset:0;

  z-index:-1;

  background:
    linear-gradient(
      90deg,
      rgba(8,10,15,.94) 0%,
      rgba(8,10,15,.63) 43%,
      rgba(8,10,15,.24) 72%,
      rgba(8,10,15,.63) 100%
    );

  pointer-events:none;
}

.hero-inner{
  min-height:390px;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;

  padding:clamp(22px,5vw,55px);
}

.hero-kicker{
  display:inline-flex;
  align-items:center;
  gap:7px;

  width:max-content;

  margin-bottom:13px;

  padding:7px 11px;

  border-radius:999px;

  background:rgba(255,255,255,.07);

  border:1px solid rgba(255,255,255,.1);

  color:#dce3ee;

  font-size:11px;
  font-weight:700;

  backdrop-filter:blur(10px);
}

.hero-kicker i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px var(--green);
}

.hero-title{
  max-width:760px;

  font-size:
    clamp(
      34px,
      8vw,
      74px
    );

  line-height:.98;

  letter-spacing:-.065em;

  font-weight:800;

  background:
    linear-gradient(
      130deg,
      #ffffff 0%,
      #d7dfff 52%,
      #aebdff 70%,
      #f5a3c3 100%
    );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero-description{
  max-width:600px;

  margin-top:14px;

  color:#b4bdcc;

  font-size:
    clamp(
      12px,
      2vw,
      15px
    );
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;

  margin-top:20px;
}

/* =========================================================
   SEARCH
========================================================= */

.search-box{
  position:relative;

  display:flex;
  align-items:center;
  gap:10px;

  min-height:54px;

  padding:0 16px;

  border-radius:16px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.025)
    );

  border:1px solid var(--border);

  transition:
    border-color .25s,
    box-shadow .25s,
    background .25s;
}

.search-box:focus-within{
  border-color:rgba(120,147,255,.46);

  box-shadow:
    0 0 0 4px
    rgba(120,147,255,.08);
}

.search-box svg{
  width:20px;
  height:20px;
  color:var(--text3);
  flex:none;
}

.search-box input{
  width:100%;

  border:0;
  outline:none;

  color:var(--text);

  background:transparent;

  font-size:14px;
}

.search-box input::placeholder{
  color:var(--text3);
}

/* =========================================================
   SECTIONS
========================================================= */

.section{
  margin-top:34px;
}

.section-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  gap:15px;

  margin-bottom:14px;
}

.section-title-wrap{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.section-kicker{
  font-size:10px;

  text-transform:uppercase;
  letter-spacing:.14em;

  color:var(--primary2);

  font-weight:700;
}

.section-title{
  font-size:
    clamp(18px,3vw,24px);

  letter-spacing:-.035em;

  font-weight:800;
}

.section-desc{
  font-size:12px;
  color:var(--text3);
}

.section-more{
  flex:none;

  padding:9px 12px;

  border-radius:11px;

  color:var(--text2);

  background:rgba(255,255,255,.035);

  border:1px solid var(--border);

  cursor:pointer;

  font-size:12px;
  font-weight:600;

  transition:.25s;
}

.section-more:hover{
  color:var(--text);
  border-color:var(--border2);
  background:rgba(255,255,255,.06);
}

/* =========================================================
   HORIZONTAL SHELF
========================================================= */

.shelf{
  display:grid;

  grid-auto-flow:column;

  grid-auto-columns:
    minmax(145px,172px);

  gap:13px;

  overflow-x:auto;

  padding:
    5px
    4px
    12px;

  scroll-snap-type:x mandatory;

  overscroll-behavior-x:contain;

  scrollbar-width:none;
}

.shelf::-webkit-scrollbar{
  display:none;
}

/* =========================================================
   GRID
========================================================= */

.anime-grid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(145px,1fr)
    );

  gap:14px;
}

.card{
  position:relative;

  overflow:hidden;

  border-radius:16px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.018)
    );

  border:1px solid var(--border);

  cursor:pointer;

  transform:translateZ(0);

  transition:
    transform .38s var(--ease),
    border-color .28s,
    box-shadow .38s var(--ease);

  animation:
    cardEnter .55s var(--ease) both;

  scroll-snap-align:start;
}

@keyframes cardEnter{
  from{
    opacity:0;
    transform:translateY(10px) scale(.985);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.card:hover{
  transform:
    translateY(-5px)
    scale(1.015);

  border-color:rgba(255,255,255,.14);

  box-shadow:
    0 18px 45px rgba(0,0,0,.28);
}

.poster{
  position:relative;

  aspect-ratio:2/3;

  overflow:hidden;

  background:var(--bg3);
}

.poster img{
  width:100%;
  height:100%;

  object-fit:cover;

  opacity:0;

  transform:scale(1.015);

  transition:
    opacity .4s,
    transform .5s var(--ease);
}

.poster img.loaded{
  opacity:1;
}

.card:hover .poster img{
  transform:scale(1.055);
}

.poster::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.02),
      rgba(0,0,0,.16)
    );

  pointer-events:none;
}

.badge{
  position:absolute;

  z-index:2;

  top:8px;
  left:8px;

  padding:5px 8px;

  border-radius:8px;

  background:rgba(5,7,11,.70);

  border:1px solid rgba(255,255,255,.1);

  backdrop-filter:blur(9px);

  font-size:9px;
  font-weight:700;

  color:var(--primary2);
}

.card-heart{
  position:absolute;

  z-index:4;

  top:7px;
  right:7px;

  width:31px;
  height:31px;

  display:grid;
  place-items:center;

  border-radius:50%;

  color:#fff;

  background:rgba(5,7,11,.68);

  border:1px solid rgba(255,255,255,.1);

  backdrop-filter:blur(10px);

  cursor:pointer;

  transition:
    transform .25s,
    background .25s;
}

.card-heart:hover{
  transform:scale(1.08);
}

.card-heart.active{
  background:var(--pink);
}

.card-body{
  padding:10px 10px 11px;
}

.card-title{
  height:35px;

  overflow:hidden;

  display:
    -webkit-box;

  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;

  font-size:12px;
  line-height:1.4;

  font-weight:650;

  color:var(--text);
}

.card-meta{
  margin-top:8px;

  display:flex;
  justify-content:space-between;
  gap:7px;

  font-size:10px;

  color:var(--text3);
}

.score{
  color:var(--yellow);
  font-weight:700;
}

/* =========================================================
   GENRE CHIPS
========================================================= */

.genre-scroll{
  display:flex;

  gap:8px;

  overflow-x:auto;

  padding:
    2px
    2px
    7px;

  scrollbar-width:none;
}

.genre-scroll::-webkit-scrollbar{
  display:none;
}

.genre-chip{
  flex:none;

  padding:9px 13px;

  border-radius:999px;

  background:rgba(255,255,255,.035);

  border:1px solid var(--border);

  color:var(--text2);

  cursor:pointer;

  white-space:nowrap;

  font-size:12px;
  font-weight:600;

  transition:
    transform .25s,
    background .25s,
    border-color .25s,
    color .25s;
}

.genre-chip:hover{
  transform:translateY(-2px);
  border-color:var(--border2);
}

.genre-chip.active{
  background:
    linear-gradient(
      135deg,
      rgba(120,147,255,.24),
      rgba(120,147,255,.11)
    );

  border-color:rgba(120,147,255,.36);

  color:var(--primary2);
}

/* =========================================================
   DETAIL
========================================================= */

.detail-layout{
  display:grid;

  grid-template-columns:
    190px
    minmax(0,1fr);

  gap:23px;
}

.detail-poster{
  aspect-ratio:2/3;

  overflow:hidden;

  border-radius:20px;

  border:1px solid var(--border);

  background:var(--bg3);

  box-shadow:var(--shadow);
}

.detail-poster img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.detail-content{
  min-width:0;
}

.detail-provider{
  display:inline-flex;

  padding:6px 9px;

  border-radius:8px;

  color:var(--primary2);

  background:var(--primarySoft);

  border:1px solid rgba(120,147,255,.2);

  font-size:10px;
  font-weight:700;

  margin-bottom:10px;
}

.detail-title{
  font-size:
    clamp(
      26px,
      5vw,
      42px
    );

  line-height:1.02;

  letter-spacing:-.055em;

  font-weight:800;
}

.detail-alt{
  margin-top:7px;

  color:var(--text3);

  font-size:12px;
}

.info-grid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(120px,1fr)
    );

  gap:8px;

  margin-top:18px;
}

.info-box{
  min-height:62px;

  padding:11px 12px;

  border:1px solid var(--border);

  border-radius:13px;

  background:rgba(255,255,255,.025);
}

.info-box label{
  display:block;

  margin-bottom:4px;

  color:var(--text3);

  font-size:9px;

  text-transform:uppercase;
  letter-spacing:.1em;

  font-weight:700;
}

.info-box strong{
  display:block;

  color:var(--text);

  font-size:12px;

  line-height:1.4;
}

.detail-actions{
  display:flex;

  flex-wrap:wrap;

  gap:9px;

  margin-top:18px;
}

.button{
  min-height:44px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  padding:0 16px;

  border-radius:13px;

  cursor:pointer;

  font-size:12px;
  font-weight:700;

  transition:
    transform .25s var(--ease),
    filter .25s,
    background .25s,
    border-color .25s;
}

.button:active{
  transform:scale(.95);
}

.button-primary{
  color:#fff;

  background:
    linear-gradient(
      135deg,
      #7893FF,
      #506EF0
    );

  box-shadow:
    0 12px 25px rgba(80,110,240,.25);
}

.button-secondary{
  color:var(--text);

  background:rgba(255,255,255,.04);

  border:1px solid var(--border);
}

.button-danger{
  color:#fff;
  background:var(--pink);
}

.button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.panel{
  margin-top:18px;

  padding:17px;

  border-radius:18px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.018)
    );

  border:1px solid var(--border);
}

.panel-title{
  font-size:14px;
  font-weight:750;

  margin-bottom:11px;
}

.synopsis{
  color:var(--text2);

  font-size:13px;

  line-height:1.8;

  white-space:pre-line;
}

.episode-grid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(90px,1fr)
    );

  gap:8px;

  max-height:380px;

  overflow:auto;

  padding:2px;
}

.episode-button{
  min-height:50px;

  border-radius:11px;

  background:rgba(255,255,255,.03);

  border:1px solid var(--border);

  color:var(--text2);

  cursor:pointer;

  font-size:12px;
  font-weight:700;

  transition:
    background .25s,
    border-color .25s,
    color .25s,
    transform .25s;
}

.episode-button:hover{
  color:var(--text);

  border-color:var(--border2);

  transform:translateY(-1px);
}

.episode-button.active{
  color:#fff;

  background:var(--primary);

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


function readStorage(key){

  try{

    return JSON.parse(
      localStorage.getItem(key) ||
      "[]"
    );

  }catch{

    return [];

  }

}


function writeStorage(
  key,
  value
){

/* =========================================================
   FETCH
========================================================= */

async function fetchAPI(
  endpoint,
  timeout = 20000
){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      timeout
    );


  try{

    const response =
      await fetch(
        `${API_BASE_URL}${endpoint}`,
        {
          method:"GET",

          headers:{
            Accept:
              "application/json"
          },

          signal:
            controller.signal
        }
      );


    const raw =
      await response.text();


    clearTimeout(timer);


    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    let json;

    try{

      json =
        JSON.parse(raw);

    }catch{

      throw new Error(
        "Tunnel mengirim response non-JSON. Kemungkinan Quick Tunnel sedang stale/error."
      );

    }


    return json;


  }catch(error){

    clearTimeout(timer);


    if(
      error.name ===
      "AbortError"
    ){

      throw new Error(
        "Request timeout. Quick Tunnel tidak merespons."
      );

    }


    throw error;

  }

}


/* =========================================================
   IMAGE LAZY LOAD
========================================================= */

function initLazyImages(){

  const images =
    $$("img[data-src]");


  if(
    !("IntersectionObserver" in window)
  ){

    images.forEach(
      image => {

        image.src =
          image.dataset.src;

        image.classList.add(
          "loaded"
        );

      }
    );

    return;
  }


  const observer =
    new IntersectionObserver(
      entries => {

        entries.forEach(
          entry => {

            if(
              !entry.isIntersecting
            ){
              return;
            }


            const image =
              entry.target;


            image.src =
              image.dataset.src;


            image.onload =
              () =>
                image.classList.add(
                  "loaded"
                );


            image.onerror =
              () => {

                image.removeAttribute(
                  "src"
                );

              };


            observer.unobserve(
              image
            );

          }
        );

      },
      {
        rootMargin:
          "250px"
      }
    );


  images.forEach(
    image =>
      observer.observe(
        image
      )
  );

}

  id,
  provider
){

  return readStorage(

function toggleFavorite(
  anime
){

  let favorites =
    readStorage(
      STORAGE.favorites
    );


  const index =
    favorites.findIndex(
      item =>
        item.id === anime.id &&
        item.provider === anime.provider
    );


  if(index >= 0){

    favorites.splice(
      index,
      1
    );

    toast(
      "Dihapus dari favorit"
    );

  }else{

    favorites.unshift(
      anime
    );

    toast(
      "Ditambahkan ke favorit",
      "ok"
    );

  }


  writeStorage(
    STORAGE.favorites,
    favorites
  );


  renderNavigation();

}


/* =========================================================
   HISTORY
========================================================= */

function saveHistory(
  anime,
  episode
){

  let history =
    readStorage(
      STORAGE.history
    );


  history =
    history.filter(
      item =>
        !(
          item.id === anime.id &&
          item.provider === anime.provider
        )
    );


  history.unshift({

    ...anime,

    episode,

    watchedAt:
      Date.now()

  });


  writeStorage(
    STORAGE.history,
    history.slice(
      0,
      60
    )
  );

}

  /* -------------------------------------------------------

  async search(

    const providers =
      Object.entries(
        PROVIDERS

      .filter(
        ([,provider]) =>
          provider.active &&
          provider.search

    const results =
      await Promise.all(
        providers.map(
          async ([provider]) => {

            try{

              if(

                const response =

                return (
                  response?.data?.animeList ||

                .map(
                  normalizeOploverzSearch
                );

              }


              return [];

            }catch{

              return [];

            }

          }
        )
      );


    return results.flat();

  },


  /* -------------------------------------------------------

  ------------------------------------------------------- */

  async detail(

    if(
      provider ===

          )
          .map(
            item =>
              item.title
          ),

        synopsis:
          (
            data.synopsis?.paragraphList ||
            []
          ).join("\n\n") ||
          "Sinopsis tidak tersedia.",

        episodeList:
          (
            data.episodeList ||
            []
          )
          .map(
            item => ({

              num:
                item.title,

              id:
                item.episodeId,

              slug:"",

              date:""

            })
          )

      };

    }


    /* -----------------------------------------------------
       Oploverz
    ----------------------------------------------------- */

    if(
      provider ===
      "oploverz"
    ){

      return {

        id,

        slug:
          data.title
            ? id
            : id,

        provider,

        title:
          data.title ||
          "Unknown",

        alt:"",

        poster:
          data.poster ||
          "",

        score:
          data.rating ||
          "-",

        type:
          data.type ||
          "-",

        status:
          data.status ||
          "-",

        year:
          data.releasedOn ||
          "-",

        episodes:
          (
            data.episodeList ||
            []
          ).length,

        duration:
          data.duration ||
          "-",

        studio:
          data.studio ||
          "-",

        genres:
          Array.isArray(
            data.genres
          )
            ? data.genres
            : [],

        synopsis:
          (
            data.synopsis?.paragraphList ||
            []
          ).join("\n\n") ||
          "Sinopsis tidak tersedia.",

        episodeList:
          (
            data.episodeList ||
            []
          )
          .map(
            item => {

              const href =
                item.href ||
                "";

              const slugValue =
                href
                  .split("/")
                  .filter(Boolean)
                  .pop() ||
                "";

              return {

                num:
                  item.episode,

                id:
                  href,

                slug:
                  slugValue,

                date:
                  item.date ||
                  ""

              };

            }
          )

      };

    }


    /* -----------------------------------------------------
       Kuramanime
    ----------------------------------------------------- */

    return {

      id:
        data.animeId ||
        id,

      slug:
        data.animeSlug ||
        slug,

      provider,

      title:
        data.title ||
        "Unknown",

      alt:
        data.alternativeTitle ||
        "",

      poster:
        data.poster ||
        "",

      score:
        data.score ||
        "-",

      type:
        data.type?.title ||
        "-",

      status:
        data.status?.title ||
        "-",

      year:
        data.aired ||
        "-",

      episodes:
        data.episodes ||
        "-",

      duration:
        data.duration ||
        "-",

      studio:
        Array.isArray(
          data.studioList
        )
          ? data.studioList
              .map(x => x.title)
              .join(", ")
          : "-",

      genres:
        (
          data.genreList ||
          []
        )
        .map(
          x =>
            cleanText(
              x.title
            )
        ),

      synopsis:
        (
          data.synopsis?.paragraphList ||
          []
        ).join("\n\n") ||
        "Sinopsis tidak tersedia.",

      episodeList:[]

    };

  },


  /* -------------------------------------------------------
     EPISODE
  ------------------------------------------------------- */

  async episode(
    provider,
    params
  ){

    let endpoint;


    if(
      provider ===
      "otakudesu"
    ){

      endpoint =
        `/otakudesu/episode/${encodeURIComponent(params.episodeId)}`;

    }

    else if(
      provider ===
      "oploverz"
    ){

      endpoint =
        `/oploverz/episode/${encodeURIComponent(params.episodeSlug || params.episodeId)}`;

    }

    else if(
      provider ===
      "kuramanime"
    ){

      endpoint =
        `/kuramanime/episode/${encodeURIComponent(params.animeId)}/${encodeURIComponent(params.animeSlug)}/${encodeURIComponent(params.episodeId)}`;

    }

    else{

      throw new Error(
        "Provider tidak tersedia."
      );

    }


    const response =
      await fetchAPI(
        endpoint
      );


    const details =
      response?.data?.details;


    if(!details){

      throw new Error(
        "Data episode tidak ditemukan."
      );

    }


    /* OTakudesu */

    if(
      provider ===
      "otakudesu"
    ){

      return {

        provider,

        title:
          details.title ||
          `Episode ${params.episode}`,

        playerUrl:
          details.defaultStreamingUrl ||
          "",

        qualities:
          (
            details.server?.qualityList ||
            []
          )
          .map(
            quality => ({

              title:
                cleanText(
                  quality.title
                ),

              servers:
                (
                  quality.serverList ||
                  []
                )
                .map(
                  server => ({

                    name:
                      server.title,

                    id:
                      server.serverId

                  })
                )

            })
          )

      };

    }


    /* Oploverz */

    if(
      provider ===
      "oploverz"
    ){

      return {

        provider,

        title:
          details.title ||
          `Episode ${params.episode}`,

        playerUrl:
          details.streamingUrl ||
          "",

        qualities:[]

      };

    }


    /* Kuramanime */

    return {

      provider,

      title:
        details.episodeTitle ||
        details.title ||
        `Episode ${params.episode}`,

      playerUrl:"",

      qualities:
        Array.isArray(
          details.server?.qualityList
        )
          ? details.server.qualityList
          : []

    };

  },


  /* -------------------------------------------------------
     RESOLVE OTakudesu SERVER
  ------------------------------------------------------- */

  async resolveServer(
    serverId
  ){

    const response =
      await fetchAPI(
        `/otakudesu/server/${encodeURIComponent(serverId)}`
      );


    /*
      INI FIX UTAMA:

      Wajik controller:

      data: {
        details: {
          url: "..."
        }
      }

      BUKAN:

      data: {
        url: "..."
      }
    */
    return (
      response?.data?.details?.url ||
      ""
    );

  }

};

function animeCardHTML(
  anime
){

  const key =
    registerCard(
      anime
    );


  const favorite =
    isFavorite(
      anime.id,
      anime.provider
    );


  return `

    <article
      class="card"
      data-card-key="${key}"
    >

      <div class="poster">

        <img
          data-src="${escapeHTML(
            anime.poster
          )}"
          alt="${escapeHTML(
            anime.title
          )}"
        >

        <span class="badge">
          ${escapeHTML(
            PROVIDERS[
              anime.provider
            ]?.name ||
            anime.provider
          )}
        </span>

        <button
          class="card-heart ${
            favorite
              ? "active"
              : ""
          }"
          data-favorite
          aria-label="Favorit"
        >
          ${
            favorite
              ? "♥"
              : "♡"
          }
        </button>

      </div>


      <div class="card-body">

        <div class="card-title">
          ${escapeHTML(
            anime.title
          )}
        </div>

        <div class="card-meta">

          <span>
            ${escapeHTML(
              anime.episodes
                ? `${anime.episodes} eps`
                : anime.meta || ""
            )}
          </span>

          <span class="score">
            ${
              anime.score &&
              anime.score !== "-"
                ? `★ ${escapeHTML(
                    anime.score
                  )}`
                : ""
            }
          </span>

        </div>

      </div>

    </article>

  `;

}


/* =========================================================
   BIND CARDS
========================================================= */

function bindCards(){

  $$("[data-card-key]")
    .forEach(
      card => {

        const key =
          card.dataset.cardKey;

        const anime =
          CARD_CACHE.get(
            key
          );

        if(!anime){
          return;
        }


        card.addEventListener(
          "click",
          event => {

            if(
              event.target.closest(
                "[data-favorite]"
              )
            ){

              return;

            }


            router.navigate(
              "detail",
              {
                provider:
                  anime.provider,

                id:
                  anime.id,

                slug:
                  anime.slug || ""
              }
            );

          }
        );


        const favorite =
          card.querySelector(
            "[data-favorite]"
          );


        favorite?.addEventListener(
          "click",
          event => {

            event.stopPropagation();

            toggleFavorite(
              anime
            );

            const active =
              isFavorite(
                anime.id,
                anime.provider
              );

            favorite.classList.toggle(
              "active",
              active
            );

            favorite.textContent =
              active
                ? "♥"
                : "♡";

          }
        );

      }
    );

}

            <path d="m20 20-3.5-3.5"/>
          </svg>

          <input
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="Contoh: Black Clover..."
          >

        </div>


        <div
          id="searchMeta"
          style="
            margin-top:11px;
            color:var(--text3);
            font-size:11px;
          "
        >
          Cari di Otakudesu dan Oploverz.
        </div>


        <div
          id="searchResult"
          style="margin-top:22px"
        >

          <div class="state">

            <div class="state-icon">
              ⌕
            </div>

            <h3>
              Mulai mencari
            </h3>

            <p>
              Masukkan minimal 2 karakter.
            </p>

          </div>

        </div>

      </section>

    </div>

  `;


  const input =
    $("#searchInput");

  let timer;


  input.addEventListener(
    "input",
    () => {

      clearTimeout(
        timer
      );


      const query =
        input.value.trim();


      if(
        query.length < 2
      ){

        $("#searchResult").innerHTML = `
          <div class="state">
            <div class="state-icon">
              ⌕
            </div>

            <h3>
              Mulai mencari
            </h3>

            <p>
              Masukkan minimal 2 karakter.
            </p>
          </div>
        `;

        return;

      }


      timer =
        setTimeout(
          async () => {

            const result =
              $("#searchResult");


            result.innerHTML = `
              <div class="anime-grid">
                ${skeletonCards(10)}
              </div>
            `;


            try{

              const anime =
                await API.search(
                  query
                );


              if(!anime.length){

                result.innerHTML = `
                  <div class="state">

                    <div class="state-icon">
                      😶
                    </div>

                    <h3>
                      Anime tidak ditemukan
                    </h3>

                    <p>
                      Coba kata kunci lain.
                    </p>

                  </div>
                `;

                return;

              }


              $("#searchMeta")
                .textContent =
                  `${anime.length} hasil ditemukan`;


              result.innerHTML = `

                <div class="anime-grid">

                  ${anime
                    .slice(
                      0,
                      60
                    )
                    .map(
                      animeCardHTML
                    )
                    .join("")}

                </div>

              `;


              bindCards();
              initLazyImages();

            }catch(error){

              result.innerHTML = `
                <div class="state">

                  <div class="state-icon">
                    ⚠️
                  </div>

                  <h3>
                    Search gagal
                  </h3>

                  <p>
                    ${escapeHTML(
                      error.message
                    )}
                  </p>

                </div>
              `;

            }

          },
          450
        );

    }
  );


  setTimeout(
    () =>
      input.focus(),
    100
  );

}

async function renderCatalog(
  params
){

  const type =
    params.type === "completed"
      ? "completed"
      : "ongoing";


  const title =
    type === "ongoing"
      ? "Sedang Tayang"
      : "Anime Selesai";


  let currentPage = 1;

  let hasNextPage = true;


  $("#view").innerHTML = `

    <div class="page-enter">

      <section
        class="section"
        style="margin-top:4px"
      >

        <div class="section-head">

          <div class="section-title-wrap">

            <span class="section-kicker">
              CATALOG
            </span>

            <h1 class="section-title">
              ${title}
            </h1>

          </div>

        </div>


        <div
          id="catalogGrid"
          class="anime-grid"
        >
          ${skeletonCards(12)}
        </div>


        <div
          class="load-more-wrap"
          id="loadMoreWrap"
        >

          <button
            class="button button-secondary load-more"
            id="loadMore"
          >
            Muat lebih banyak
          </button>

        </div>

      </section>

    </div>

  `;


  async function loadPage(
    page,
    append = false
  ){

    const result =
      await (
        type === "ongoing"
          ? API.ongoing(page)
          : API.completed(page)
      );


    currentPage =
      page;

    hasNextPage =
      !!result.pagination
        ?.hasNextPage;


    const normalized =
      result.list;


    const grid =
      $("#catalogGrid");


    if(!append){

      grid.innerHTML =
        normalized
          .map(
            animeCardHTML
          )
          .join("");

    }else{

      grid.insertAdjacentHTML(
        "beforeend",
        normalized
          .map(
            animeCardHTML
          )
          .join("")
      );

    }


    bindCards();
    initLazyImages();


    $("#loadMoreWrap")
      .style.display =
        hasNextPage
          ? "flex"
          : "none";
  }


  try{

    await loadPage(
      1,
      false
    );


    $("#loadMore")
      .onclick =
        async () => {

          if(!hasNextPage){
            return;
          }


          const button =
            $("#loadMore");

          button.disabled =
            true;

          button.textContent =
            "Memuat...";


          try{

            await loadPage(
              currentPage + 1,
              true
            );

          }catch(error){

            toast(
              error.message,
              "err"
            );

          }finally{

            button.disabled =
              false;

            button.textContent =
              "Muat lebih banyak";

          }

        };

  }catch(error){

    $("#catalogGrid").innerHTML = `
      <div
        style="
          grid-column:1/-1;
        "
      >

        <div class="state">

          <div class="state-icon">
            ⚠️
          </div>

          <h3>
            Katalog gagal dimuat
          </h3>

          <p>
            ${escapeHTML(
              error.message
            )}
          </p>

        </div>

      </div>
    `;

    $("#loadMoreWrap")
      .style.display =
        "none";

  }

}

}

async function renderPlayer(

    params,
    params.episode
  );


  $("#view").innerHTML = `

    <div class="page-enter">

      <div
        class="skeleton"
        style="
          aspect-ratio:16/9;
        "

      <div
        class="skeleton"
        style="
          height:120px;
          margin-top:17px;
        "
      ></div>

    </div>

  `;


  try{

    const stream =
      await API.episode(
        params.provider,
        params
      );


    /*
      Default player langsung memakai
      defaultStreamingUrl untuk Otakudesu.
    */

    let playerUrl =
      stream.playerUrl ||
      "";


    const episodes =
      Array.isArray(
        params.episodeList
      )
        ? params.episodeList
        : [];


    const index =
      episodes.findIndex(
        episode =>
          String(
            episode.num
          ) ===
          String(
            params.episode
          )
      );


    const previous =
      index > 0
        ? episodes[index - 1]
        : null;


    const next =
      index >= 0 &&
      index <
        episodes.length - 1
        ? episodes[index + 1]
        : null;


    const playerMarkup =
      playerUrl

        ? `
          <iframe
            id="playerFrame"
            src="${escapeHTML(
              playerUrl
            )}"
            allowfullscreen
            loading="eager"
            referrerpolicy="no-referrer"
          ></iframe>
        `

        : `
          <div class="player-empty">

            <div>

              <div
                class="state-icon"
                style="
                  margin-bottom:13px;
                "
              >
                🎬
              </div>

              <strong>
                Player tidak tersedia
              </strong>

              <p
                style="
                  margin-top:7px;
                "
              >
                Provider tidak memberikan
                player URL untuk episode ini.
              </p>

            </div>

          </div>
        `;


    $("#view").innerHTML = `

      <div class="page-enter">

        <div class="section-head">

          <div class="section-title-wrap">

            <span class="section-kicker">
              PLAYER
            </span>

            <h1 class="section-title">
              ${escapeHTML(
                params.title
              )}
              · Episode
              ${escapeHTML(
                params.episode
              )}
            </h1>

          </div>

        </div>


        <div
          class="player-shell"
        >
          ${playerMarkup}
        </div>


        <div
          class="detail-actions"
          style="
            margin-bottom:17px;
          "
        >

          ${
            previous

              ? `
                <button
                  class="button button-secondary"
                  id="prevEpisode"
                >
                  ← Prev
                </button>
              `

              : `
                <button
                  class="button button-secondary"
                  disabled
                >
                  ← Prev
                </button>
              `
          }


          <button
            class="button button-secondary"
            id="episodeListButton"
          >
            ☷ Episode
          </button>


          ${
            next

              ? `
                <button
                  class="button button-primary"
                  id="nextEpisode"
                >
                  Next →
                </button>
              `

              : `
                <button
                  class="button button-secondary"
                  disabled
                >
                  Next →
                </button>
              `
          }

        </div>


        ${
          stream.qualities.length

            ? `
              <div class="panel">

                <div class="panel-title">
                  Server & Kualitas
                </div>

                <div class="server-list">

                  ${stream.qualities
                    .map(
                      quality => `

                        <div
                          class="server-row"
                        >

                          <span
                            class="server-label"
                          >
                            ${escapeHTML(
                              quality.title
                            )}
                          </span>


                          ${
                            quality.servers
                              .map(
                                server => `

                                  <button
                                    class="server-button"
                                    data-server-id="${escapeHTML(
                                      server.id
                                    )}"
                                  >
                                    ${escapeHTML(
                                      server.name
                                    )}
                                  </button>

                                `
                              )
                              .join("")
                          }

                        </div>

                      `
                    )
                    .join("")}

                </div>

              </div>
            `

            : `
              <div class="panel">

                <div class="panel-title">
                  Player
                </div>

                <div
                  style="
                    color:var(--text3);
                    font-size:12px;
                  "
                >
                  ${
                    playerUrl
                      ? "Provider menggunakan player URL langsung."
                      : "Tidak ada player URL dari API."
                  }
                </div>

              </div>
            `
        }


        ${
          episodes.length

            ? `
              <div class="panel">

                <div class="panel-title">
                  Episode Lainnya
                </div>

                <div
                  class="episode-grid"
                >

                  ${episodes
                    .map(
                      episode => `

                        <button
                          class="
                            episode-button
                            ${
                              String(
                                episode.num
                              ) ===
                              String(
                                params.episode
                              )
                                ? "active"
                                : ""
                            }
                          "
                          data-play-episode="${registerCard(
                            episode
                          )}"
                        >
                          ${escapeHTML(
                            episode.num
                          )}
                        </button>

                      `
                    )
                    .join("")}

                </div>

              </div>
            `

            : ""
        }

      </div>

    `;


    /* -----------------------------------------------------
       PREV
    ----------------------------------------------------- */

    $("#prevEpisode")
      ?.addEventListener(
        "click",
        () => {

          router.navigate(
            "player",
            {
              ...params,

              episode:
                previous.num,

              episodeId:
                previous.id,

              episodeSlug:
                previous.slug

            }
          );

        }
      );


    /* -----------------------------------------------------
       NEXT
    ----------------------------------------------------- */

    $("#nextEpisode")
      ?.addEventListener(
        "click",
        () => {

          router.navigate(
            "player",
            {
              ...params,

              episode:
                next.num,

              episodeId:
                next.id,

              episodeSlug:
                next.slug

            }
          );

        }
      );


    /* -----------------------------------------------------
       EPISODE LIST
    ----------------------------------------------------- */

    $("#episodeListButton")
      ?.addEventListener(
        "click",
        () => {

          router.navigate(
            "detail",
            {
              provider:
                params.provider,

              id:
                params.animeId ||
                params.id,

              slug:
                params.animeSlug ||
                params.slug ||
                ""
            }
          );

        }
      );


    /* -----------------------------------------------------
       SERVER RESOLVER
    ----------------------------------------------------- */

    $$("[data-server-id]")
      .forEach(
        button => {

          button.onclick =
            async () => {

              const serverId =
                button.dataset.serverId;


              if(
                !serverId
              ){

                toast(
                  "Server ID kosong.",
                  "err"
                );

                return;

              }


              if(
                params.provider !==
                "otakudesu"
              ){

                toast(
                  "Resolver server hanya tersedia untuk Otakudesu.",
                  "err"
                );

                return;

              }


              $$(".server-button")
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );


              button.classList.add(
                "loading"
              );


              try{

                const resolvedUrl =
                  await API.resolveServer(
                    serverId
                  );


                if(
                  !resolvedUrl
                ){

                  throw new Error(
                    "Wajik mengembalikan response tanpa data.details.url."
                  );

                }


                const iframe =
                  $("#playerFrame");


                if(!iframe){

                  throw new Error(
                    "Player iframe tidak ditemukan."
                  );

                }


                iframe.src =
                  resolvedUrl;


                button.classList.remove(
                  "loading"
                );

                button.classList.add(
                  "active"
                );


                toast(
                  `Server ${button.textContent.trim()} aktif.`,
                  "ok"
                );


              }catch(error){

                button.classList.remove(
                  "loading"
                );


                toast(
                  error.message,
                  "err"
                );

              }

            };

        }
      );


    /* -----------------------------------------------------
       OTHER EPISODES
    ----------------------------------------------------- */

    $$("[data-play-episode]")
      .forEach(
        button => {

          button.onclick =
            () => {

              const episode =
                CARD_CACHE.get(
                  button.dataset.playEpisode
                );


              if(!episode){
                return;
              }


              router.navigate(
                "player",
                {
                  ...params,

                  episode:
                    episode.num,

                  episodeId:
                    episode.id,

                  episodeSlug:
                    episode.slug

                }
              );

            };

        }
      );

  }catch(error){

    $("#view").innerHTML = `

      <div class="state page-enter">

        <div class="state-icon">
          ⚠️
        </div>

        <h3>
          Stream gagal dimuat
        </h3>

        <p>
          ${escapeHTML(
            error.message
          )}
        </p>

        <div
          class="detail-actions"
          style="
            justify-content:center;
            margin-top:15px;
          "
        >

          <button
            class="button button-primary"
            id="retryPlayer"
          >
            Coba lagi
          </button>

          <button
            class="button button-secondary"
            id="backFromPlayer"
          >
            Kembali
          </button>

        </div>

      </div>

    `;


    $("#retryPlayer").onclick =
      () =>
        renderPlayer(
          params
        );


    $("#backFromPlayer").onclick =
      () =>
        router.back();

  }

}

/* =========================================================
   ROUTER
========================================================= */

const router = {

  stack:[],
  current:null,


  async navigate(
    page,
    params = {},
    options = {}
  ){

    const push =
      options.push !== false;


    if(
      push &&
      this.current
    ){

      this.stack.push(
        this.current
      );

    }


    await this.render(
      page,
      params
    );


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  },


  async back(){

    const previous =
      this.stack.pop();


    if(
      previous
    ){

      await this.render(
        previous.page,
        previous.params
      );

    }else{

      await this.render(
        "home"
      );

    }


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  },


  async render(
    page,
    params = {}
  ){

    this.current = {
      page,
      params
    };


    renderNavigation();


    switch(page){

      case "home":
        await renderHome();
        break;


      case "search":
        renderSearch();
        break;


      case "explore":
        await renderExplore();
        break;


      case "catalog":
        await renderCatalog(
          params
        );
        break;


      case "genre":
        await renderGenre(
          params
        );
        break;


      case "detail":
        await renderDetail(
          params
        );
        break;


      case "player":
        await renderPlayer(
          params
        );
        break;


      case "fav":
        renderFavorites();
        break;


      case "history":
        renderHistory();
        break;


      default:
        await renderHome();

    }


    renderNavigation();
    checkAPIStatus();

  }

};


/* =========================================================
   GLOBAL EVENTS
========================================================= */

$("#backButton")
  .onclick =
    () =>
      router.back();


$("#searchTop")
  .onclick =
    () =>
      router.navigate(
        "search"
      );


/* =========================================================
   START
========================================================= */

router.render(
  "home"
);
